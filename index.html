<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gabarito</title>
<meta name="description" content="Estudo médico com questões comentadas — UFPR e USMLE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F5F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Soft Light & Clean — paleta Tailwind (stone/zinc/teal/emerald/rose), cantos 2xl, sombras quase invisíveis, bordas mínimas */
:root{
  --bg:#F5F5F4;            /* stone-100 */
  --surface:#FFFFFF;       /* white */
  --surface-2:#F4F4F5;     /* zinc-100 */
  --pill:rgba(228,228,231,.5); /* zinc-200/50 */
  --ink:#18181B;           /* zinc-900 */
  --ink-2:#27272A;         /* zinc-800 */
  --muted:#71717A;         /* zinc-500 */
  --subtle:#A1A1AA;        /* zinc-400 */
  --line:#E4E4E7;          /* zinc-200 */
  --hair:rgba(24,24,27,.06);
  --accent:#0F766E;        /* teal-700 */
  --usmle:#4338CA; --usmle-soft:#EEF2FF; --usmle-line:#C7D2FE;  /* indigo 700/50/200 */
  --accent-ink:#FFFFFF;
  --accent-soft:#F0FDFA;   /* teal-50 */
  --ok:#059669; --ok-soft:#ECFDF5; --ok-bar:#6EE7B7;     /* emerald 600/50/300 */
  --bad:#E11D48; --bad-soft:#FFF1F2; --bad-bar:#FDA4AF;  /* rose 600/50/300 */
  --warn:#B45309; --warn-soft:#FFFBEB; --warn-line:#FDE68A; /* amber 700/50/200 */
  --shadow:0 1px 2px rgba(24,24,27,.04),0 1px 1px rgba(24,24,27,.02);
  --shadow-md:0 4px 24px rgba(24,24,27,.05);
  --glass:linear-gradient(135deg,rgba(204,251,241,.75) 0%,rgba(236,253,245,.7) 55%,rgba(240,253,250,.6) 100%);
  --f-display:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-ui:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"Inter", system-ui, sans-serif;
  --fs:1;
  --nav-h:66px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#09090B; --surface:#18181B; --surface-2:#27272A; --pill:rgba(63,63,70,.5); --ink:#F4F4F5; --ink-2:#E4E4E7; --muted:#A1A1AA; --subtle:#71717A; --line:#27272A; --hair:rgba(255,255,255,.06);
  --accent:#5EEAD4; --accent-ink:#042F2E; --accent-soft:#042F2E; --usmle:#A5B4FC; --usmle-soft:#1E1B4B; --usmle-line:#3730A3;
  --ok:#34D399; --ok-soft:#022C22; --ok-bar:#10B981; --bad:#FB7185; --bad-soft:#2A0A12; --bad-bar:#E11D48; --warn:#FCD34D; --warn-soft:#271A04; --warn-line:#78350F;
  --shadow:none; --shadow-md:none; --glass:linear-gradient(135deg,rgba(19,78,74,.55),rgba(6,78,59,.35)); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:calc(15px * var(--fs));line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%;align-content:start}
.top,main{min-width:0}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px;white-space:nowrap;color:var(--ink)}
.brand i{font-style:normal;color:var(--accent)}
.sync{font-size:11px;color:var(--subtle);margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:.02em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--subtle)}
.dot.on{background:#34D399} .dot.warn{background:#FBBF24}
.iconbtn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;color:var(--ink-2)}
.ctx{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
.ctx::-webkit-scrollbar{display:none}
.ctx:empty{display:none}
.sel{position:relative;flex:1 1 150px;min-width:0;max-width:360px}
.sel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--surface);border:0;box-shadow:var(--shadow),0 0 0 1px var(--hair);border-radius:999px;padding:9px 32px 9px 14px;width:100%;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--subtle);border-bottom:1.5px solid var(--subtle);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel .lab{position:absolute;left:-9999px}
.sel.per{flex:0 1 auto;max-width:170px}
.selbtn{font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--surface);border:0;box-shadow:var(--shadow),0 0 0 1px var(--hair);border-radius:999px;padding:9px 32px 9px 14px;width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ptop{display:flex;flex-direction:column;gap:10px;position:sticky;top:-14px;background:var(--surface);padding-top:2px;z-index:1}
.ptop h2{display:flex;align-items:center;gap:8px}
.psearch{font:inherit;font-size:15px;width:100%;padding:10px 14px;border-radius:12px;border:0;box-shadow:0 0 0 1px var(--hair);background:var(--surface);color:var(--ink)}
.plist{display:flex;flex-direction:column;gap:4px;margin-top:-6px}
details.pg{border-radius:14px}
details.pg>summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 4px 6px;cursor:pointer;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
details.pg>summary::-webkit-details-marker{display:none}
details.pg>summary span::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s}
details.pg[open]>summary span::before{transform:rotate(90deg)}
details.pg>summary small{text-transform:none;letter-spacing:0;font-weight:500}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;border:0;background:transparent;color:var(--ink);padding:10px 12px;border-radius:12px;cursor:pointer}
.prow:hover{background:var(--pill)}
.prow.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.prow[disabled]{opacity:.45;cursor:default}
.prow .pt{display:flex;flex-direction:column;min-width:0}
.prow .pt b{font-weight:500;font-size:14.5px}
.prow .pt small{color:var(--muted);font-size:12px;margin-top:1px}
.prow .pm{display:flex;align-items:center;gap:6px;flex:none}
.prow .pl{color:var(--accent);display:inline-flex}
.prow .pd{font-size:11.5px;font-weight:600;background:var(--ink);color:var(--surface);border-radius:999px;padding:2px 7px}
.prow .pp{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--pill)}
.prow .pp.good{color:#15803D}.prow .pp.mid{color:#B45309}.prow .pp.bad{color:#B91C1C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.pri.p3{background:#451A03;color:#FCD34D;box-shadow:0 0 0 1px #92400E inset}:root:not([data-theme="light"]) .prow .pp.good{color:#86EFAC}:root:not([data-theme="light"]) .prow .pp.mid{color:#FCD34D}:root:not([data-theme="light"]) .prow .pp.bad{color:#FCA5A5}}
:root[data-theme="dark"] .prow .pp.good{color:#86EFAC}:root[data-theme="dark"] .prow .pp.mid{color:#FCD34D}:root[data-theme="dark"] .prow .pp.bad{color:#FCA5A5}
.seg{display:inline-flex;background:var(--pill);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(24,24,27,.08)}
.seg button[data-std="usmle"][aria-pressed="true"]{color:var(--usmle);box-shadow:0 0 0 1px var(--usmle-line) inset,0 1px 3px rgba(67,56,202,.12)}
.tag.std.usmle{background:var(--usmle-soft);color:var(--usmle);box-shadow:0 0 0 1px var(--usmle-line) inset}
.ddot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
/* main */
main{padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:600;font-size:calc(26px * var(--fs));line-height:1.15;letter-spacing:-.025em;color:var(--ink)}
h2{font-family:var(--f-display);font-weight:600;font-size:calc(15px * var(--fs));line-height:1.3;letter-spacing:-.01em;color:var(--ink)}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--subtle)}
.lede{color:var(--muted);margin:4px 0 0;font-size:14px}
.panel{background:var(--surface);border:0;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.panel h2{margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--hair);color:var(--ink-2);border-radius:999px;padding:12px 20px;font-weight:500;cursor:pointer;min-height:46px;text-align:center;transition:transform .12s ease,box-shadow .15s ease,background .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--surface);box-shadow:0 1px 2px rgba(24,24,27,.12)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{min-height:36px;padding:7px 14px;font-size:13px}
.btn.danger{color:var(--bad);box-shadow:0 0 0 1px var(--bad-bar)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.block{width:100%}
.big{font-family:var(--f-display);font-weight:300;font-size:46px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--ink)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border-radius:16px;padding:16px 14px 14px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--f-display);font-weight:500;font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--ink)}
.kpi .v small{font-size:13px;font-weight:400;color:var(--subtle);letter-spacing:0;margin-left:1px}
.kpi .l{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);margin-top:8px}
/* due card (vidro fosco) */
.due{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:22px 20px;box-shadow:var(--shadow-md)}
.due::before{content:"";position:absolute;width:180px;height:180px;right:-50px;top:-70px;border-radius:50%;background:radial-gradient(circle,rgba(153,246,228,.55),transparent 70%);pointer-events:none}
.due > *{position:relative}
/* tingido pela cor da disciplina (--dc), quando definida */
.due.dc{background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 16%,#fff) 0%,color-mix(in srgb,var(--dc) 7%,#fff) 55%,color-mix(in srgb,var(--dc) 4%,#fff) 100%)}
.due.dc::before{background:radial-gradient(circle,color-mix(in srgb,var(--dc) 30%,transparent),transparent 70%)}
.due.dc .eyebrow{color:var(--dc);opacity:.9}
.due.dc .lede{color:color-mix(in srgb,var(--dc) 60%,var(--ink));opacity:.9}
.due.dc .btn.pill{box-shadow:0 1px 2px rgba(24,24,27,.06),0 4px 14px color-mix(in srgb,var(--dc) 18%,transparent)}
:root[data-theme="dark"] .due.dc{background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 30%,#18181B),color-mix(in srgb,var(--dc) 14%,#18181B))}
:root[data-theme="dark"] .due.dc .eyebrow,:root[data-theme="dark"] .due.dc .lede{color:color-mix(in srgb,var(--dc) 45%,#fff)}
.due .eyebrow{color:#0F766E;opacity:.75}
.due .big{color:var(--ink);margin-top:6px}
.due .lede{color:#115E59;opacity:.8}
.due .btn.pill{background:#FFFFFF;color:var(--ink);box-shadow:0 1px 2px rgba(24,24,27,.06),0 4px 14px rgba(15,118,110,.10);padding:12px 22px;font-weight:600;white-space:nowrap}
:root[data-theme="dark"] .due{border-color:rgba(255,255,255,.06)}
:root[data-theme="dark"] .due .eyebrow,:root[data-theme="dark"] .due .lede{color:#99F6E4}
:root[data-theme="dark"] .due .btn.pill{background:#F4F4F5;color:#18181B}
/* atalhos */
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:16px 16px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink-2);transition:transform .12s ease,box-shadow .15s ease}
.sc:hover{box-shadow:var(--shadow-md)}
.sc:active{transform:scale(.985)}
.sc .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--pill);display:grid;place-items:center;color:var(--ink-2)}
.sc .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sc .tx{min-width:0;flex:1}
.sc b{display:block;font-weight:500;font-size:14.5px;color:var(--ink-2);letter-spacing:-.01em}
.sc small{display:block;font-size:12px;color:var(--subtle);margin-top:1px}
.sc .go{flex:none;color:var(--subtle)}
.sc.main .ic{background:var(--ink);color:var(--surface)}
@media (min-width:700px){ .sc{flex-direction:column;align-items:flex-start;gap:12px;padding:18px} .sc .go{display:none} }
/* barras */
.bars{display:flex;flex-direction:column;gap:16px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 12px;align-items:baseline}
.bar-row .n{font-size:13.5px;font-weight:500;min-width:0;color:var(--ink-2)}
.bar-row .p{font-size:12px;font-weight:300;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar-row .p b{font-weight:500;color:var(--ink-2)}
.track{grid-column:1/-1;height:4px;border-radius:999px;background:var(--line);overflow:hidden;display:flex;gap:2px}
.track i{display:block;height:100%;border-radius:999px}
.track .ok{background:var(--ok-bar)} .track .bad{background:var(--bad-bar)}
.spark{display:flex;align-items:flex-end;gap:5px;height:72px;padding-top:6px}
.spark div{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%;min-width:0}
.spark i{display:block;border-radius:4px;background:var(--ok-bar)}
.spark i.b{background:var(--bad-bar)}
.spark-l{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin-top:6px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--ok-bar)}
.legend span.b::before{background:var(--bad-bar)}
/* forms */
.field{display:flex;flex-direction:column;gap:7px}
.field label,.flabel{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle)}
.field select,.field input,.field textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:0;box-shadow:0 0 0 1px var(--hair) inset;border-radius:14px;padding:11px 14px;min-height:46px;width:100%}
.field textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--pill);color:var(--ink-2);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:500;transition:background .15s ease}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] span{color:color-mix(in srgb,var(--surface) 70%,transparent)!important}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.switch{position:relative;width:44px;height:26px;flex:none;border-radius:999px;background:var(--line);border:0;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--surface)}
/* question */
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qnum{font-weight:500;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{flex:1;min-width:80px;height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:999px}
.timer{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border:0;border-radius:999px;background:var(--pill);color:var(--muted);white-space:nowrap}
.tag.real{background:var(--warn-soft);color:var(--warn);box-shadow:0 0 0 1px var(--warn-line) inset}
.tag.gen{background:var(--bad-soft);color:var(--bad)}
.tag.exc{background:var(--accent-soft);color:var(--accent)}
.tag.pri{letter-spacing:.02em}.tag.pri.p3{background:#FEF3C7;color:#92400E;box-shadow:0 0 0 1px #FCD34D inset}.tag.pri.p1{opacity:.75}
.stars{font-size:12px;letter-spacing:.5px;color:#D97706;white-space:nowrap}.stars.p1{color:var(--subtle)}.stars.p2{color:#F59E0B}
.ess{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)}
.ess>div{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}.ess>div>b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px}
:root[data-theme="dark"] .tag.pri.p3{background:#451A03;color:#FCD34D;box-shadow:0 0 0 1px #92400E inset}
.tag.std{color:var(--ink-2)}
.stem{font-family:var(--f-read);font-size:calc(18px * var(--fs));line-height:1.65;margin:2px 0 0;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:0;box-shadow:var(--shadow),0 0 0 1px var(--hair);border-radius:18px;padding:15px 16px;cursor:pointer;transition:box-shadow .15s ease,background .15s ease}
.opt:not([disabled]):hover{box-shadow:var(--shadow-md),0 0 0 1px var(--line)}
.opt[disabled]{cursor:default}
.opt.picked{box-shadow:0 0 0 1.5px var(--ink)}

const INTERVALS = [0,1,3,7,16,35]; // legado: só para converter registros antigos
/* FSRS-5 (parâmetros padrão): estabilidade S (dias), dificuldade D (1–10); retenção desejada 90% */
const FSRS={ w:[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621],
  F:19/81, DEC:-0.5, R:0.9, MAX:365,
  clampD(d){ return Math.min(10,Math.max(1,d)); },
  d0(g){ const w=this.w; return this.clampD(w[4]-Math.exp(w[5]*(g-1))+1); },
  ret(t,s){ return Math.pow(1+this.F*t/s, this.DEC); },
  ivl(s){ return Math.min(this.MAX, Math.max(1, Math.round(s/this.F*(Math.pow(this.R,1/this.DEC)-1)))); },
  // r: registro existente (pode ser legado, com box/due), g: 1 errei · 2 difícil · 3 acertei/bom · 4 fácil; t: agora
  next(r, g, t){ const w=this.w; let s=r.s, d=r.d; const last=r.lr||r.ts;
    if(s==null && r.box!=null && last){ s=Math.max(0.5, INTERVALS[r.box]||0.5); d=5; } // migração do sistema antigo
    if(s==null){ s=w[g-1]; d=this.d0(g); }
    else { const el=Math.max(0,(t-last)/DAY);
      if(el<1){ s=s*Math.exp(w[17]*(g-3+w[18])); }
      else { const R=this.ret(el,s);
        if(g===1){ s=Math.min(s, w[11]*Math.pow(d,-w[12])*(Math.pow(s+1,w[13])-1)*Math.exp(w[14]*(1-R))); }
        else { s=s*(Math.exp(w[8])*(11-d)*Math.pow(s,-w[9])*(Math.exp(w[10]*(1-R))-1)*(g===2?w[15]:1)*(g===4?w[16]:1)+1); } }
      const dd=d+(-w[6]*(g-3))*(10-d)/9; d=this.clampD(w[7]*this.d0(4)+(1-w[7])*dd); }
    s=Math.max(0.1,s); const days=g===1?1:this.ivl(s);
    return {s, d, days}; } };
function schedule(r, g){ const t=now(); const n=FSRS.next(r,g,t); r.s=+n.s.toFixed(3); r.d=+n.d.toFixed(3); r.lr=t; r.due=startOfDay(t)+n.days*DAY; r.ivl=n.days; return r; }
function previewDays(r, g){ return FSRS.next(Object.assign({},r||{}), g, now()).days; }

const S = {
  db:null, user:null, sample:null, downloads:null, uid:null, owner:false,

// cache local em IndexedDB (sem o limite de ~5 MB do localStorage). Chaves: "content" (catálogo, questões, lições) e "prog".
const IDB={ db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ try{ const r=indexedDB.open("gabarito",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); },
  async get(k){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("kv").objectStore("kv").get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); },
  async set(k,v){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); } };
function applyContent(c){ if(!c) return; if(c.catalog) S.catalog=c.catalog; if(c.qs) c.qs.forEach(q=>S.qs.set(q.id,q)); if(c.lessons) c.lessons.forEach(l=>S.lessons.set(l.id,l)); }
async function cacheLoad(){
  try{ applyContent(await IDB.get("content")); const pr=await IDB.get("prog"); if(pr) S.prog=mergeProg(S.prog,pr); }catch(e){}
  // migração do cache antigo (localStorage) — uma vez
  try{ const old=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(old){ if(!S.qs.size) applyContent(old); if(old.prog&&!Object.keys(S.prog.q).length) S.prog=mergeProg(S.prog,old.prog); localStorage.removeItem(LS_KEY); cacheSave(); } }catch(e){}
}
let cacheTimer=null, progTimer=null;
function cacheSave(){ clearTimeout(cacheTimer); cacheTimer=setTimeout(()=>{ IDB.set("content",{catalog:S.catalog, qs:[...S.qs.values()], lessons:[...S.lessons.values()]}).catch(()=>{}); cacheSaveProg(); },400); }
function cacheSaveProg(){ clearTimeout(progTimer); progTimer=setTimeout(()=>{ IDB.set("prog",JSON.parse(JSON.stringify(S.prog))).catch(()=>{}); },300); }
function mergeProg(base, p){ return {settings:Object.assign({},base.settings,p.settings||{}), q:p.q||{}, fc:p.fc||{}, log:p.log||{}, sims:p.sims||[], ev:p.ev||base.ev||[], reports:p.reports||base.reports||[], read:Object.assign({},base.read||{},p.read||{})}; }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safe(html){ // allow a tiny tag set from content
  let s = esc(html);
  return s.replace(/&lt;(\/?)(b|i|em|strong|sub|sup|br)&gt;/g, "<$1$2>");
}
function md(text){ // minimal markdown for Claude answers
  const lines = esc(text).split("\n"); let out=[], list=null, tbl=null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<i>$2</i>").replace(/`(.+?)`/g,'<code>$1</code>');
  const flush=()=>{ if(list){out.push(`<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join("")}</${list.t}>`);list=null;} if(tbl){out.push('<div class="mdwrap"><table>'+tbl.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join("")+"</tr>").join("")+"</table></div>");tbl=null;} };
  for(const raw of lines){ const l=raw.trim();
    if(/^\|.*\|$/.test(l)){ if(/^\|[\s:|-]+\|$/.test(l)) continue; if(list) flush(); (tbl=tbl||[]).push(l.slice(1,-1).split("|").map(c=>c.trim())); continue; }
    let m;
    if((m=l.match(/^[-*•]\s+(.*)/))){ if(tbl) flush(); if(!list||list.t!=="ul"){flush();list={t:"ul",items:[]};} list.items.push(m[1]); continue; }
    if((m=l.match(/^\d+[.)]\s+(.*)/))){ if(tbl) flush(); if(!list||list.t!=="ol"){flush();list={t:"ol",items:[]};} list.items.push(m[1]); continue; }
    flush();
    if(!l) continue;
    if((m=l.match(/^#{1,6}\s+(.*)/))){ out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    out.push(`<p>${inline(l)}</p>`);
  }
  flush(); return out.join("");
}
const dayKey = (d=new Date()) => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const now = () => Date.now();
const DAY = 86400000;
function startOfDay(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function fmtTime(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
let toastTimer=null;
function toast(msg){ let el=$("#toast"); if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,2600); }
function arm(btn, label, fn){ if(btn.dataset.armed){ delete btn.dataset.armed; fn(); return; } const old=btn.textContent; btn.dataset.armed="1"; btn.textContent=label; setTimeout(()=>{ if(btn.dataset.armed){ delete btn.dataset.armed; btn.textContent=old; } },3000); }
function applyTheme(){ const t=set().theme; const r=document.documentElement; if(t==="light"||t==="dark") r.setAttribute("data-theme",t); else r.removeAttribute("data-theme"); r.style.setProperty("--fs", set().fs||1); }

// período: set().per = número (ex. 5) ou "all"; sem escolha → período da disciplina atual (ou o mais alto)
function allDiscs(){ return S.catalog?.disciplines || []; }
function periods(){ return [...new Set(allDiscs().map(d=>d.period).filter(p=>p!=null))].sort((a,b)=>a-b); }
function curPer(){ const p=set().per, ps=periods(); if(p==="all"||!ps.length) return "all"; if(ps.includes(p)) return p; const d=allDiscs().find(x=>x.id===set().disc); return d?.period ?? ps[ps.length-1]; }
function inPer(d){ const p=curPer(); return p==="all" || d.period==null || d.period===p; }
// menus: alfabética (pt, sem acento) dentro de cada período; cores seguem a ordem do catálogo (allDiscs)
function discs(){ return allDiscs().filter(inPer).sort((a,b)=>(a.period??99)-(b.period??99) || nm(a).localeCompare(nm(b),"pt",{sensitivity:"base"})); }
let _dmCat=null,_dm=null;
function discById(id){ if(_dmCat!==S.catalog){ _dmCat=S.catalog; _dm=new Map(allDiscs().map(d=>[d.id,d])); } return _dm.get(id); }
function perOk(q){ if(curPer()==="all") return true; const d=discById(q.discipline); return !d || inPer(d); }
function curDisc(){ const d=discs(); return d.find(x=>x.id===set().disc) || d[0] || null; }
function examPseudo(d, exId){ const ex=(d.exams||[]).find(e=>e.id===exId); if(!ex) return null; const tps=d.topics.filter(t=>ex.all || t.exam===ex.id); const L0=set().lang;
  return {id:"exam:"+ex.id, pseudo:true, name:{pt:(ex.name?.pt||ex.id)+" · todos os temas", en:(ex.name?.en||ex.id)+" · all topics"}, topics:tps.map(t=>t.id), subs:tps.map(t=>({id:t.id,name:t.name}))}; }
let _ctKey=null,_ctVal=null;
function curTopic(){ const key=(set().disc||"")+"|"+(set().topic||"")+"|"+S.qs.size+"|"+set().lang+"|"+(S.catalog?.updated||""); if(key===_ctKey) return _ctVal; _ctKey=key; return (_ctVal=curTopic0()); }
function curTopic0(){ const d=curDisc(); if(!d) return null; const k=set().topic||""; if(k.startsWith("exam:")){ const p=examPseudo(d,k.slice(5)); if(p) return p; }
  return d.topics.find(x=>x.id===k) || d.topics.find(x=>topicCount(x.id)>0) || d.topics[0] || null; }
function topicCount(id){ let n=0; for(const q of S.qs.values()) if(q.topic===id) n++; return n; }
function subOf(q){ return curTopic()?.pseudo ? q.topic : q.sub; }
function nm(o){ return o?.name?.[set().lang] || o?.name?.pt || o?.name?.en || o?.id || ""; }
function subName(id){ const t=curTopic(); const s=t?.subs?.find(x=>x.id===id); return s? nm(s) : (id==="banco"?"Banco MED":id); }
// Banco MED: standard "banco" só aparece em "Banco"/"Tudo"; "Ambos" = UFPR+USMLE (como antes)
function stdM(q,st){ return st==="tudo" || (st==="all" ? q.standard!=="banco" : q.standard===st); }
function inCtx(q){ const d=curDisc(), t=curTopic(); if(!d||!t) return false; if(q.discipline!==d.id||(t.pseudo? !t.topics.includes(q.topic) : q.topic!==t.id)) return false; const st=set().std; return stdM(q,st); }
function ctxQs(){ return [...S.qs.values()].filter(inCtx).sort((a,b)=>(a.order??999)-(b.order??999) || a.id.localeCompare(b.id)); }
function content(q){ // returns {c, lang, fallback}
  const L0=set().lang, other=L0==="pt"?"en":"pt";
  if(q.i18n?.[L0]) return {c:q.i18n[L0], lang:L0, fallback:false};
  return {c:q.i18n?.[other], lang:other, fallback:true};
}
function tagsOf(q){ return q.tags?.[set().lang] || q.tags?.pt || q.tags?.en || []; }

/* ---------- progress ---------- */
function rec(id){ return S.prog.q[id]; }
function status(id){ const r=rec(id); if(!r) return "no"; return r.ok? "ok":"bad"; }
function record(q, picked, ctx={}){
  const ok = picked===q.correct; const r = S.prog.q[q.id] || {n:0,nOk:0};
  if(r.first==null) r.first = r.n===0 ? ok : (r.n===1 ? !!r.ok : null);
  r.n++; if(ok) r.nOk++; r.ok=ok; r.a=picked; r.ts=now();
  // registro de cada resposta: [ts(s), id, acerto, revisão, segundos(-1 = n/d)]
  S.prog.ev=(S.prog.ev||[]); S.prog.ev.push([Math.round(now()/1000), q.id, ok?1:0, ctx.rev?1:0, ctx.ms!=null?Math.min(3600,Math.round(ctx.ms/1000)):-1]); if(S.prog.ev.length>20000) S.prog.ev.splice(0,S.prog.ev.length-20000);
  schedule(r, ok?3:1); delete r.box;
  S.prog.q[q.id]=r;
  const k=dayKey(); const lg=S.prog.log[k]||{n:0,ok:0}; lg.n++; if(ok) lg.ok++; S.prog.log[k]=lg;
  pruneLog(); saveProg(); return ok;
}
function rateCard(q, grade){ // 0 errei, 1 difícil, 2 acertei → FSRS 1, 2, 3
  const r = S.prog.fc[q.id] || {};
  schedule(r, [1,2,3][grade]); delete r.box;
  r.ts=now(); S.prog.fc[q.id]=r; saveProg();
}
function pruneLog(){ const keys=Object.keys(S.prog.log).sort(); while(keys.length>120){ delete S.prog.log[keys.shift()]; } }
// revisão espaçada = baralho da disciplina inteira (como no Anki); "ctx" restringe ao tema/prova escolhido
function discQs(){ const d=curDisc(); if(!d) return []; const st=set().std; return [...S.qs.values()].filter(q=>q.discipline===d.id && stdM(q,st)); }
function revPool(){ return set().revScope==="ctx" ? ctxQs() : discQs(); }
function dueQs(){ const end=startOfDay(now())+DAY; return revPool().filter(q=>{ const r=rec(q.id); return r && r.due!=null && r.due < end; }); }
// cards: revisões vencidas do baralho + cards novos (nunca vistos) só do tema atual
function dueCards(){ const end=startOfDay(now())+DAY; const seen=revPool().filter(q=>{ const r=S.prog.fc[q.id]; return r && r.due < end; }); const ids=new Set(seen.map(q=>q.id)); const fresh=ctxQs().filter(q=>!S.prog.fc[q.id] && !ids.has(q.id)); return seen.concat(fresh); }
function scopeChips(){ const sc=set().revScope==="ctx"?"ctx":"disc"; const t=curTopic(); const b=(v,l)=>`<button type="button" class="chip" data-act="revScope" data-val="${v}" aria-pressed="${sc===v}">${l}</button>`;
  return `<div class="chips">${b("disc",(set().lang==="en"?"Whole discipline":"Disciplina inteira"))}${b("ctx",(set().lang==="en"?"Only ":"Só ")+esc(nm(t)))}</div>`; }
function scopeLabel(){ return set().revScope==="ctx" ? nm(curTopic()) : nm(curDisc()); }
let saveTimer=null, saving=false, saveAgain=false;
function saveProg(){ cacheSaveProg(); if(!S.db||!S.uid) return; clearTimeout(saveTimer); saveTimer=setTimeout(flushProg, 1200); }
async function flushProg(){
  if(saving){ saveAgain=true; return; } saving=true;
  try{ await S.db.doc("data/users/"+S.uid+"/state").set(JSON.parse(JSON.stringify(S.prog))); setSync("on"); }
  catch(e){ setSync("warn"); }
  finally{ saving=false; if(saveAgain){ saveAgain=false; flushProg(); } }
}

/* ---------- sync indicator ---------- */
function setSync(s){ S.dbState=s; const d=$("#syncDot"), t=$("#syncTxt"); d.className="dot"+(s==="on"?" on":s==="warn"||s==="off"?" warn":""); t.textContent= s==="on"? tr("online") : s==="loading"? tr("loading") : tr("offline"); }

/* ---------- seletor de tema (folha com busca, grupos por prova e números do tema) ---------- */
function pickerStats(){ const d=curDisc(); const st=set().std; const end=startOfDay(now())+DAY; const agg={};
  for(const q of S.qs.values()){ if(q.discipline!==d.id||!stdM(q,st)) continue;
    const k=q.topic+"|"+(q.sub||""); const e=priOf(q)===3; for(const key of [q.topic, k]){ const a=agg[key]||(agg[key]={n:0,seen:0,ok:0,due:0,e3:0,e3s:0}); a.n++; if(e) a.e3++; const r=rec(q.id); if(r){ a.seen++; if(e) a.e3s++; if(r.ok) a.ok++; if(r.due!=null&&r.due<end) a.due++; } } }
  return agg; }
function pickRow(act,val,label,a,{cur,lesson,dis,sub}={}){ a=a||{n:0,seen:0,ok:0,due:0}; const en=set().lang==="en";
  const pct=a.seen?Math.round(100*a.ok/a.seen):null; const pc=pct==null?"":pct>=75?"good":pct>=50?"mid":"bad";
  const meta=dis? (en?"soon":"em breve") : `${a.n} q${a.seen?` · ${a.seen}/${a.n} ${en?"done":"feitas"}`:""}${a.e3?` · ★★★ ${a.e3s||0}/${a.e3}`:""}`;
  return `<button type="button" class="prow${cur?" cur":""}" data-act="${act}" data-val="${esc(val)}" data-q="${esc(label.toLowerCase())}" ${dis?"disabled":""}>
    <span class="pt"><b>${esc(label)}</b><small>${meta}</small></span>
    <span class="pm">${lesson?`<span class="pl" title="${en?"Lesson":"Lição"}">${ICONS_L}</span>`:""}${a.due?`<span class="pd" title="${en?"Due today":"Revisões hoje"}">${a.due}</span>`:""}${pct!=null?`<span class="pp ${pc}">${pct}%</span>`:""}</span></button>`; }
const ICONS_L='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>';
function pickSheet(title, body, n){ const en=set().lang==="en";
  openSheet(`<div class="ptop"><h2 style="margin:0">${title}</h2>${n>7?`<input type="search" id="pickQ" class="psearch" placeholder="${en?"Search topic…":"Buscar tema…"}" autocomplete="off">`:""}</div><div class="plist">${body}</div><p class="empty" id="pickNone" hidden>${en?"Nothing found.":"Nada encontrado."}</p>`, sh=>{
    const c=sh.querySelector(".prow.cur"); if(c) setTimeout(()=>c.scrollIntoView({block:"center"}),30);
    const qi=sh.querySelector("#pickQ"); if(!qi) return;
    qi.oninput=()=>{ const v=qi.value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); let any=false;
      sh.querySelectorAll("details.pg").forEach(g=>{ let vis=0; g.querySelectorAll(".prow").forEach(r=>{ const ok=!v||r.dataset.q.normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(v); r.hidden=!ok; if(ok) vis++; }); g.hidden=!vis; if(v) g.open=true; if(vis) any=true; });
      sh.querySelectorAll(".plist > .prow").forEach(r=>{ const ok=!v||r.dataset.q.normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(v); r.hidden=!ok; if(ok) any=true; });
      $("#pickNone").hidden=any; }; }); }
function topicPickBody(){ const d=curDisc(); if(!d) return null; const t=curTopic(); const agg=pickerStats(); const en=set().lang==="en";
  const sum=ids=>ids.reduce((s,id)=>{ const a=agg[id]; if(a){ s.n+=a.n; s.seen+=a.seen; s.ok+=a.ok; s.due+=a.due; s.e3+=a.e3; s.e3s+=a.e3s; } return s; },{n:0,seen:0,ok:0,due:0,e3:0,e3s:0});
  const row=x=>pickRow("pickTopic",x.id,nm(x),agg[x.id],{cur:t&&t.id===x.id,lesson:!!lessonOf(d.id,x.id),dis:!topicCount(x.id)});
  const exs=d.exams||[]; let body="", n=(d.topics||[]).length;
  const grp=(label,inner,open,a)=>`<details class="pg" ${open?"open":""}><summary><span>${esc(label)}</span><small>${a.n} q${a.due?` · ${a.due} ${en?"due":"p/ hoje"}`:""}</small></summary>${inner}</details>`;
  if(exs.length){
    for(const ex of exs){ const tps=(d.topics||[]).filter(x=>ex.all?false:x.exam===ex.id); const ids=ex.all?(d.topics||[]).map(x=>x.id):tps.map(x=>x.id); const a=sum(ids);
      const all=pickRow("pickTopic","exam:"+ex.id,"▸ "+nm(ex)+" · "+(en?"all topics":"todos os temas"),a,{cur:t&&t.id==="exam:"+ex.id});
      const open=!t||t.id==="exam:"+ex.id||tps.some(x=>x.id===t.id)||exs.length===1;
      body+=grp(nm(ex),all+tps.map(row).join(""),open,a); }
    const rest=(d.topics||[]).filter(x=>!x.exam); if(rest.length) body+=grp(en?"Other":"Outros",rest.map(row).join(""),!t||rest.some(x=>x.id===t.id),sum(rest.map(x=>x.id)));
  } else body=(d.topics||[]).map(row).join("");
  return {d,body,n}; }
function openTopicPicker(){ const r=topicPickBody(); if(r) pickSheet(`${ddot(r.d)}${esc(nm(r.d))}`, r.body, r.n); }
// telas largas: lista de temas da disciplina sempre visível abaixo do menu
function renderSide(){ let el=$("#side"); if(!el){ el=document.createElement("aside"); el.id="side"; el.setAttribute("aria-label",T2("Temas","Topics")); $(".shell").appendChild(el); }
  const on=WIDE_Q.matches && S.catalog && ["home","study","bank"].includes(S.view) && !document.body.classList.contains("focus");
  const r=on?topicPickBody():null; if(!r){ el.hidden=true; el.innerHTML=""; return; }
  const top=el.scrollTop; el.hidden=false; el.innerHTML=`<div class="sidehd">${ddot(r.d)}${esc(nm(r.d))}</div>${r.body}`; el.scrollTop=top; }
function openSubPicker(){ const d=curDisc(), t=curTopic(); if(!d||!t) return; const su=S.setup||(S.setup=defaultSetup()); const agg=pickerStats(); const en=set().lang==="en";
  let body;

    body=pickRow("pickSub","",tr("allSubs"),sum(t.topics),{cur:!su.sub})+(t.subs||[]).map(s=>pickRow("pickSub",s.id,nm(s),agg[s.id],{cur:su.sub===s.id})).join(""); }
  else body=pickRow("pickSub","",tr("allSubs"),agg[t.id],{cur:!su.sub})+(t.subs||[]).map(s=>pickRow("pickSub",s.id,nm(s),agg[t.id+"|"+s.id],{cur:su.sub===s.id})).join("");
  pickSheet(esc(nm(t)), body, (t.subs||[]).length); }
function go(v){ const changed=S.view!==v; S.view=v; try{ if(changed) history.pushState({v},"","#"+v); else history.replaceState({v},"","#"+v); }catch(e){} render(); window.scrollTo({top:0}); }

function render(){ document.body.classList.toggle("focus", !!inSession() && set().focus!==false); document.documentElement.lang=set().lang==="en"?"en":"pt-BR"; renderCtx(); renderTabs(); const v=$("#view");

}

function priOf(q){ return q.pri||2; }
function prioSort(list){ return list.map((q,i)=>[q,i]).sort((a,b)=>priOf(b[0])-priOf(a[0])||a[1]-b[1]).map(x=>x[0]); }

function buildSession(kind, list, su){
  const ord = su.order || (su.shuffleQ?"rand":"seq");
  let qs = ord==="rand" ? shuffle(list) : ord==="pri" ? prioSort(list) : list.slice();
  if(su.count) qs = qs.slice(0, su.count);
  const items = qs.map(q=>({id:q.id, perm: (su.shuffleO && q.origin!=="real") ? shuffle([0,1,2,3,4].slice(0,(q.i18n.pt||q.i18n.en).opts.length)) : [...Array((q.i18n.pt||q.i18n.en).opts.length).keys()], pick:null}));
  return {kind, mode: kind==="review"?"study":su.mode, items, i:0, t0:now(), done:false, std:set().std, topic:curTopic()?.id};
}

function examReadiness(onlyDisc){ const today=startOfDay(now()), end=today+DAY; const allQ=[...S.qs.values()].filter(stdOk); const exams=[];
  for(const d of discs()){ if(onlyDisc&&d.id!==onlyDisc) continue; const tps=d.topics||[]; for(const ex of (d.exams||[])){ const dt=examDate(ex); if(dt==null||dt<today) continue;
      const tids=new Set(tps.filter(t=>ex.all||t.exam===ex.id).map(t=>t.id)); const qs=allQ.filter(q=>q.discipline===d.id&&tids.has(q.topic)); if(!qs.length) continue;
      const seen=qs.filter(q=>rec(q.id)), ok=seen.filter(q=>rec(q.id).ok), due=qs.filter(q=>{const r=rec(q.id); return r&&r.due!=null&&r.due<end;}).length;
      const days=Math.max(1,Math.round((dt-today)/DAY)); const unseen=qs.length-seen.length;
      const e3=qs.filter(q=>priOf(q)===3), e3s=e3.filter(q=>rec(q.id)), e3o=e3s.filter(q=>rec(q.id).ok);
      exams.push({d,ex,dt,days,n:qs.length,seen:seen.length,ok:ok.length,due,unseen,meta:Math.ceil(unseen/days),e3:e3.length,e3s:e3s.length,e3o:e3o.length}); } }
  return exams.sort((a,b)=>a.dt-b.dt); }

// cor-marcador por disciplina: d.color no catálogo, senão posição dentro do período (as cores se repetem entre períodos)

function discColor(d){ if(!d) return "var(--subtle)"; if(d.color) return d.color; const same=allDiscs().filter(x=>(x.period??null)===(d.period??null)); const i=Math.max(0,same.findIndex(x=>x.id===d.id)); return DCOL[i%DCOL.length]; }

function examDate(ex){ if(ex.date) return startOfDay(new Date(ex.date+"T12:00:00").getTime()); const m=(ex.name?.pt||"").match(/(\d{1,2})(?:[–-]\d{1,2})?\/(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)/i); if(!m) return null;
  const y=new Date(now()).getFullYear(); return startOfDay(new Date(y, MES[m[2].toLowerCase()], Number(m[1]), 12).getTime()); }

// "P2 20.2 · Q33 · 22.2 · Q14" → [{ex:"P2 20.2",n:33},{ex:"P2 22.2",n:14}]
function examPairs(label){ const out=[]; let cur=null, pre="";
  for(const tok of String(label||"").split(" · ").map(x=>x.trim())){ const m=tok.match(/^Q(\d+)$/i); if(m){ if(cur) out.push({ex:cur,n:Number(m[1])}); continue; }
    if(/^\d{2,4}(\.\d)?$/.test(tok)) cur=(pre?pre+" ":"")+tok; else { cur=tok; const p=tok.match(/^(.*?)\s*\d{2,4}(\.\d)?$/); pre=p?p[1]:""; } }
  return out; }
function fullExams(dId){ const map=new Map();
  for(const q of S.qs.values()){ if(q.discipline!==dId||!q.exam) continue; for(const {ex,n} of examPairs(q.exam)){ if(!map.has(ex)) map.set(ex,[]); map.get(ex).push({q,n}); } }
  const yr=ex=>{ const m=ex.match(/(\d{2,4})(?:\.(\d))?$/); if(!m) return 0; let y=Number(m[1]); if(y<100) y+=2000; return y*10+Number(m[2]||0); };
  return [...map.entries()].map(([ex,list])=>({ex, list:list.sort((a,b)=>a.n-b.n)})).sort((a,b)=>a.ex.split(" ")[0].localeCompare(b.ex.split(" ")[0]) || yr(b.ex)-yr(a.ex)); }

  const last=ex=>(S.prog.sims||[]).filter(s=>s.exam===ex).slice(-1)[0];
  const grp=x=>(x.ex.match(/^(P\d|FINAL|Final)/i)||[T2("Outras","Other")])[0].toUpperCase();
  const groups=[...new Set(L.map(grp))];
  return `<p class="lede" style="margin:0;font-size:13px">${T2("Questões reais na ordem original. Questões com figura ou anuladas ficaram de fora.","Real questions in the original order. Figure-based or voided items were left out.")}</p>

     <span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn small" data-act="fullExam" data-ex="${esc(x.ex)}" data-mode="study">${T2("Comentada","Tutor")}</button><button class="btn small primary" data-act="fullExam" data-ex="${esc(x.ex)}" data-mode="sim">${T2("Simulado","Timed")}</button></span></div>`; }).join("")}</div></div>`).join("")}`; }
function startFullExam(ex, mode){ const d=curDisc(); const x=fullExams(d.id).find(e=>e.ex===ex); if(!x) return;
  const qs=x.list.map(i=>i.q); const su=Object.assign(defaultSetup(),{mode, count:0, shuffleQ:false, shuffleO:false}); S.setup=su;

// incidência: cada aparição em prova (questão repetida em anos diferentes conta de novo)
function incidence(dId, exId){ const d=discById(dId); if(!d) return {rows:[],total:0}; const by={}; let total=0;
  const okT=new Set((d.topics||[]).filter(t=>!exId||t.exam===exId).map(t=>t.id));
  for(const q of S.qs.values()){ if(q.discipline!==dId||!q.exam||!okT.has(q.topic)) continue; const k=examPairs(q.exam).length||1; by[q.topic]=(by[q.topic]||0)+k; total+=k; }
  const rows=(d.topics||[]).filter(t=>by[t.id]).map(t=>{ const r=[...S.qs.values()].filter(q=>q.discipline===dId&&q.topic===t.id&&rec(q.id)); const o=r.filter(q=>rec(q.id).ok).length; return {t,n:by[t.id],seen:r.length,o}; }).sort((a,b)=>b.n-a.n);
  return {rows,total,d}; }

     <div class="track" style="margin-top:6px"><i style="width:${100*r.n/mx}%;background:var(--accent)"></i></div>
     <small style="color:var(--subtle);font-size:11.5px">${r.seen?`${T2("seu acerto","your accuracy")}: ${Math.round(100*r.o/r.seen)}% (${r.seen})`:T2("ainda não estudado","not studied yet")}</small></button>`; }).join("")}</div>
   <p class="lede" style="margin:10px 0 0;font-size:12.5px">${T2(`${total} aparições em provas antigas${exSel?` (temas da ${exSel})`:""}. Toque num tema para estudá-lo.`,`${total} appearances in past exams${exSel?` (${exSel} topics)`:""}. Tap a topic to study it.`)}</p></div>`; }

function pdfLabel(l){ const d=discById(l.discipline), i=(d?.topics||[]).findIndex(t=>t.id===l.topic), t=d?.topics?.[i];
  return `${d?.period!=null?d.period+"º · ":""}${nm(d)||l.discipline} · ${i>=0?String(i+1).padStart(2,"0")+" ":""}${t?nm(t):l.title}`.replace(/[\/\\:*?"<>|]/g,"").trim(); }
// altura externa (com margens) e margem superior de um bloco
function pdfM(el){ const c=getComputedStyle(el), mt=parseFloat(c.marginTop)||0; return {el, mt, h:el.getBoundingClientRect().height+mt+(parseFloat(c.marginBottom)||0)}; }
// divide tabela/lista grande em fragmentos que cabem na página (repete thead; mantém numeração)
function pdfSplit(box, el, cap0){
  const isL=/^(UL|OL)$/.test(el.tagName), host=e=>isL?e:e.querySelector("tbody")||e.querySelector("table");
  const items=[...host(el).children].filter(x=>x.tagName!=="THEAD"); if(items.length<2) return null;
  const frag=(a,b)=>{ const c=el.cloneNode(true), h=host(c); [...h.children].forEach(x=>{ if(x.tagName!=="THEAD") x.remove(); }); items.slice(a,b).forEach(x=>h.appendChild(x.cloneNode(true)));
    if(el.tagName==="OL"){ if(el.classList.contains("flow")) c.style.counterReset="f "+a; else c.start=(el.start||1)+a; } return c; };
  const out=[]; let a=0;
  while(a<items.length){ let b=a+1; const cap=out.length?PCAP:(cap0||PCAP);
    if(!out.length&&cap0){ const t=frag(0,1); box.appendChild(t); const h=pdfM(t).h; t.remove(); if(h>cap0) return null; }   // nem o 1º item cabe no resto da página
    while(b<items.length){ const t=frag(a,b+1); box.appendChild(t); const h=pdfM(t).h; t.remove(); if(h>cap) break; b++; }
    const f=frag(a,b); box.appendChild(f); const m=pdfM(f); f.remove(); out.push(m); a=b; }
  return out;
}
// reduz bloco que não cabe numa página (escala, mantendo a proporção)
function pdfScale(box, el){ el.style.margin="0"; const h=el.getBoundingClientRect().height, k=Math.min(1,PCAP/(h+18)), w=document.createElement("div");
  w.style.cssText=`height:${h*k}px;overflow:hidden`; const i=document.createElement("div"); i.style.cssText=`width:${PCW}px;transform:scale(${k});transform-origin:0 0`; i.appendChild(el); w.appendChild(i);
  box.appendChild(w); const m=pdfM(w); w.remove(); return m; }
// pagina gulosamente os filhos diretos; devolve lista de páginas (arrays de nós)
function pdfPaginate(box){
  const items=[]; for(const el of [...box.children]){ const m=pdfM(el); const body=m.h-m.mt;
    if(body>PCAP){ const sp=/^(TABLE|UL|OL)$/.test(el.tagName)||el.classList.contains("tbl")?pdfSplit(box,el):null;
      if(sp) sp.forEach(x=>items.push(x.h>PCAP?pdfScale(box,x.el):x)); else items.push(pdfScale(box,el)); }
    else items.push(m); }
  const pages=[]; let pg=[], used=0; const eff=m=>m.h-(pg.length?0:m.mt), isH=m=>/^H[1-3]$/.test(m.el.tagName);
  const canSplit=el=>/^(TABLE|UL|OL)$/.test(el.tagName)||el.classList.contains("tbl");
  for(let i=0;i<items.length;i++){ const m=items[i];
    if(pg.length&&m.el.classList?.contains("pq-br")){ pages.push(pg); pg=[]; used=0; }   // seção que começa em página nova
    let need=eff(m); if(isH(m)){ let j=i; while(j<items.length-1&&isH(items[j])) { j++; need+=canSplit(items[j].el)?Math.min(items[j].h,140):items[j].h; } }   // título vai junto com o próximo bloco (ou o começo dele)
    if(pg.length&&used+need>PCAP){ const rem=PCAP-used;
      if(!isH(m)&&rem>=140&&canSplit(m.el)){ const sp=pdfSplit(box,m.el,rem-m.mt); if(sp&&sp.length>1){ items.splice(i,1,...sp); i--; continue; } }   // lista/tabela começa no espaço que sobrou
      pages.push(pg); pg=[]; used=0; }
    used+=eff(m); pg.push(m.el); }
  if(pg.length) pages.push(pg); return pages;
}
// página → JPEG (via SVG foreignObject)
async function pdfRaster(nodes, label, n, N, qual=.88){
  const pg=document.createElement("div"); pg.className="pg"; const bd=document.createElement("div"); bd.className="bd"; const c=document.createElement("div"); c.className="pdfc"; nodes.forEach(x=>c.appendChild(x.cloneNode(true))); bd.appendChild(c);
  const add=(cls,t)=>{ const e=document.createElement("div"); e.className=cls; if(t) e.textContent=t; pg.appendChild(e); };
  add("hd",label); add("ln"); add("nt","Notas"); pg.appendChild(bd); add("ft",`Gabarito · p. ${n}/${N}`);
  const root=document.createElement("div"); root.innerHTML=`<style>${PDF_CSS}</style>`; root.appendChild(pg);
  const xml=new XMLSerializer().serializeToString(root);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml">${xml}</div></foreignObject></svg>`;
  const img=new Image(); await new Promise((ok,no)=>{ img.onload=ok; img.onerror=()=>no(new Error("falha ao desenhar a página")); img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg); });
  const cv=document.createElement("canvas"); cv.width=PW*2; cv.height=PH*2; const g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img,0,0,cv.width,cv.height);
  const blob=await new Promise(ok=>cv.toBlob(ok,"image/jpeg",qual)); if(!blob) throw new Error("falha ao gerar imagem");
  return {b:new Uint8Array(await blob.arrayBuffer()), w:cv.width, h:cv.height};
}
// PDF 1.4 mínimo: uma página A4 por JPEG
function jpegPdf(pages, title){
  const enc=new TextEncoder(), parts=[], off=[]; let len=0;
  const put=x=>{ const u=typeof x==="string"?enc.encode(x):x; parts.push(u); len+=u.length; };
  const obj=(n,s,bin)=>{ off[n]=len; put(`${n} 0 obj\n${s}`); if(bin){ put("\nstream\n"); put(bin); put("\nendstream"); } put("\nendobj\n"); };
  const N=3+pages.length*3, hex=[...title].map(ch=>ch.charCodeAt(0).toString(16).padStart(4,"0")).join("").toUpperCase();
  put("%PDF-1.4\n"); put(new Uint8Array([37,226,227,207,211,10]));
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,`<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_,i)=>`${4+i*3} 0 R`).join(" ")}] >>`);
  obj(3,`<< /Title <FEFF${hex}> /Producer (Gabarito) >>`);
  pages.forEach((p,i)=>{ const k=4+i*3, cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(k,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${k+2} 0 R >> >> /Contents ${k+1} 0 R >>`);
    obj(k+1,`<< /Length ${cs.length} >>`,enc.encode(cs));
    obj(k+2,`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.b.length} >>`,p.b); });
  const xr=len; put(`xref\n0 ${N+1}\n0000000000 65535 f \n`); for(let n=1;n<=N;n++) put(String(off[n]).padStart(10,"0")+" 00000 n \n");
  put(`trailer\n<< /Size ${N+1} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xr}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}
// HTML → páginas → PDF (File)
async function pdfFromHtml(label, html, qual){
  const box=document.createElement("div"); box.style.cssText="position:fixed;left:-10000px;top:0";
  box.innerHTML=`<style>${PDF_CSS}</style><div class="pdfc" style="width:${PCW}px">${html}</div>`; document.body.appendChild(box);
  let pages; try{ pages=pdfPaginate(box.querySelector(".pdfc")); pages=pages.map(p=>p.map(x=>x.cloneNode(true))); } finally{ box.remove(); }
  const jp=[]; for(let i=0;i<pages.length;i++) jp.push(await pdfRaster(pages[i],label,i+1,pages.length,qual));
  return new File([jpegPdf(jp,label)], label+".pdf", {type:"application/pdf"});
}

// figura → data URL (null se falhar)
async function pqImgData(url){
  try{ const ac=new AbortController(), t=setTimeout(()=>ac.abort(),8000);
    try{ const r=await fetch(url,{signal:ac.signal}); if(!r.ok) return null; const b=await r.blob();
      return await new Promise((ok,no)=>{ const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.onerror=no; fr.readAsDataURL(b); }); }
    finally{ clearTimeout(t); }
  }catch(e){ return null; }
}

async function pqHtml(groups){

      g+=`<div class="pq-g"><b class="n">Q${n} — ${L[x.correct]??"?"}</b> · ${safe(ok?.why||"")}${c.peg?` <em>${T2("Pegadinha","Trap")}:</em> ${safe(c.peg)}`:""}</div>`; } }
  return {q,g};
}
// PDF único com as questões de toda a disciplina, agrupadas por tema (null se não houver)
async function questionsPdf(d){

// pacote da disciplina: um PDF de lição por tema (sem questões) + o das questões por último
async function discPdfFiles(dId, prog){
  const d=discById(dId), ls=lessonsOf(dId), files=[], N=ls.length+1;
  for(let i=0;i<ls.length;i++){ prog&&prog(i+1,N); files.push(await lessonPdf(ls[i],false)); }
  prog&&prog(N,N); const f=d&&await questionsPdf(d); if(f) files.push(f); return files;
}
function pdfSave(f){ const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),8000); }

// entrega: compartilhar (→ Samsung Notes); sem Web Share, baixa
async function pdfDeliver(files){
  S.pdfFiles=files; const can=!!navigator.canShare?.({files});
  if(files.length===1&&!can){ pdfSave(files[0]); return toast(T2("PDF baixado: abra no Samsung Notes","PDF downloaded: open it in Samsung Notes")); }
  if(files.length===1){ try{ await navigator.share({files}); return; }catch(e){ if(e?.name==="AbortError") return; } }   // gesto expirado ou erro → sheet
  pdfSheet();
}

  const fs=S.pdfFiles||[], one=fs.length===1, can=f=>!!navigator.canShare?.({files:f});

// gera 1 ou vários PDFs com feedback no botão
async function pdfRun(ls, btn, dId){
  if(!(ls.length||dId)||btn?.disabled) return; const txt=btn?.textContent; if(btn){ btn.disabled=true; btn.textContent=T2("Gerando PDF…","Generating PDF…"); }
  try{ let files=[]; if(dId) files=await discPdfFiles(dId,(i,N)=>toast(T2(`Gerando ${i}/${N}…`,`Generating ${i}/${N}…`))); else for(let i=0;i<ls.length;i++){ if(ls.length>1) toast(T2(`Gerando ${i+1}/${ls.length}…`,`Generating ${i+1}/${ls.length}…`)); files.push(await lessonPdf(ls[i])); }
    if(!files.length) return;
    await pdfDeliver(files);
  }catch(e){ toast(T2("Erro ao gerar o PDF: ","PDF error: ")+(e?.message||e)); }
  finally{ if(btn?.isConnected){ btn.disabled=false; btn.textContent=txt; } }
}

function lev(a,b,max){ // Damerau (transposição adjacente) com corte

    for(let j=1;j<=n;j++){ let v=Math.min(p[j]+1, c[j-1]+1, p[j-1]+(a[i-1]===b[j-1]?0:1)); if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,p2[j-2]+1); c.push(v); if(v<mn) mn=v; }
    if(mn>max) return max+1; p2=p; p=c; }

// Tudo calculado na hora a partir do catálogo (datas das provas), das questões (★) e do progresso; só as preferências ficam em settings.plan.
const PLAN_COV=.85; // tema "coberto" quando 85% das questões foram vistas
function PL(){ const s=set(), p=s.plan||(s.plan={}); if(typeof p.cap!=="number") p.cap=30; for(const k of ["offWd","offDates"]) if(!Array.isArray(p[k])) p[k]=[]; for(const k of ["dates","hide"]) if(!p[k]||typeof p[k]!=="object") p[k]={}; return p; }
const addDays=(t,n)=>{ const d=new Date(t); d.setDate(d.getDate()+n); return d.getTime(); };
const exKey=(d,ex)=>d.id+"|"+ex.id;
function planExDate(d,ex){ const o=PL().dates[exKey(d,ex)]; return o ? startOfDay(new Date(o+"T12:00:00").getTime()) : examDate(ex); }
function planIsOff(t,P){ return P.offWd.includes(new Date(t).getDay()) || P.offDates.includes(dayKey(new Date(t))); }
function planIndex(){ const m=new Map(); for(const q of S.qs.values()){ if(q.standard==="usmle"||q.standard==="banco") continue; const k=q.discipline+"|"+q.topic; let a=m.get(k); if(!a) m.set(k,a=[]); a.push(q); } return m; }
function planTopic(d,t,idx){ const qs=idx.get(d.id+"|"+t.id)||[]; const n=qs.length; let seen=0,ok=0,ps=0; const wrong=[];
  for(const q of qs){ ps+=priOf(q); const r=rec(q.id); if(r){ seen++; if(r.ok) ok++; else wrong.push(q); } }
  const need=Math.max(0,Math.ceil(n*PLAN_COV)-seen), acc=seen?ok/seen:null, w=n?ps/n:2;
  return {d,t,n,seen,ok,acc,w,need,wrong,done:n>0&&need===0,score:w+(seen?1.5*(1-acc):.3)}; }
function planCompute(){
  const idx=planIndex(), P=PL(), today=startOfDay(now()), tk=dayKey(new Date(today));
  const exams=[];
  for(const d of discs()) for(const ex of (d.exams||[])){ if(P.hide[exKey(d,ex)]) continue; const dt=planExDate(d,ex); if(dt==null||dt<today) continue;
    const tps=(d.topics||[]).filter(t=>ex.all||t.exam===ex.id).map(t=>planTopic(d,t,idx)).filter(x=>x.n); if(!tps.length) continue;
    exams.push({d,ex,dt,days:Math.round((dt-today)/DAY),tps,n:tps.reduce((s,x)=>s+x.n,0),seen:tps.reduce((s,x)=>s+x.seen,0),ok:tps.reduce((s,x)=>s+x.ok,0)}); }
  exams.sort((a,b)=>a.dt-b.dt);

  const doneToday=(S.prog.log[tk]||{}).n||0, used={}, claimed=new Set();
  for(const e of exams){
    const free=[]; for(let t=today;t<e.dt;t=addDays(t,1)) if(!planIsOff(t,P)) free.push(t);
    e.freeN=free.length; e.reviewDay=free.length>=4?free.pop():null;
    const pend=e.tps.filter(x=>!x.done&&!claimed.has(x.d.id+"|"+x.t.id)).sort((a,b)=>b.score-a.score);
    pend.forEach(x=>claimed.add(x.d.id+"|"+x.t.id));
    e.needTotal=pend.reduce((s,x)=>s+x.need,0); e.quota=free.length?Math.min(P.cap,Math.ceil(e.needTotal/free.length)):0;
    const left=new Map(pend.map(x=>[x,x.need]));

      for(const x of pend){ let l=left.get(x); if(l<=0) continue;
        for(const t of free){ const k=dayKey(new Date(t)); const room=(t===today?Math.max(0,lim-doneToday):lim)-(used[k]||0); if(room<=0) continue;
          const take=Math.min(l,room); used[k]=(used[k]||0)+take; l-=take; push(k,{k:"new",tp:x,n:take}); if(l<=0) break; }
        left.set(x,l); } }
    e.over=[...left.values()].reduce((s,v)=>s+v,0);
    // erros voltam na data de revisão do FSRS (nunca antes de hoje, nem em dia sem estudo, nem depois da prova)
    for(const x of e.tps){ const by={}; for(const q of x.wrong){ const r=rec(q.id); let t=Math.max(today,r.due!=null?startOfDay(r.due):today+DAY);
        while(t<e.dt&&planIsOff(t,P)) t=addDays(t,1); if(t>=e.dt) t=e.reviewDay||free[free.length-1]||today; by[dayKey(new Date(t))]=(by[dayKey(new Date(t))]||0)+1; }
      for(const k in by) push(k,{k:"rev",tp:x,n:by[k]}); }
    if(e.reviewDay!=null){ const q3=e.tps.reduce((s,x)=>s+x.wrong.length,0); push(dayKey(new Date(e.reviewDay)),{k:"final",e,n:q3}); }
  }
  // o que já foi feito hoje fica verde no topo da célula de hoje
  const seenDone=new Set(); for(const e of exams) for(const x of e.tps){ const id=x.d.id+"|"+x.t.id; if(seenDone.has(id)) continue; seenDone.add(id);
    let c=0; for(const q of S.qs.values()) if(q.discipline===x.d.id&&q.topic===x.t.id&&q.standard!=="usmle"&&q.standard!=="banco"){ const r=rec(q.id); if(r&&r.ts>=today) c++; }
    if(c) (days.get(tk)||(days.set(tk,[]),days.get(tk))).unshift({k:"done",tp:x,n:c}); }
  return {exams,days,today,tk,doneToday};
}
