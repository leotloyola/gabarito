<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gabarito</title>
<meta name="description" content="Estudo médico com questões comentadas — UFPR e USMLE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E6B5A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: app de estudo mobile-first — barra de contexto no topo, navegação inferior no celular / trilho lateral no desktop, uma questão por tela */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#E9ECE7; --ink:#15201D; --muted:#5B6964; --line:#D7DDD7;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8;
  --ok:#1E7743; --ok-soft:#E0F1E6; --bad:#B3261E; --bad-soft:#F8E2DF; --warn:#875700; --warn-soft:#FAEFD3;
  --f-display:"Fraunces", Georgia, serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs:1;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1211; --surface:#141C1A; --surface-2:#1C2623; --ink:#E5EDE9; --muted:#94A49E; --line:#283431;
  --accent:#52CFAF; --accent-ink:#062019; --accent-soft:#12382F;
  --ok:#62C98E; --ok-soft:#132E20; --bad:#F2877E; --bad-soft:#3A1917; --warn:#E6B95C; --warn-soft:#32270E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1211; --surface:#141C1A; --surface-2:#1C2623; --ink:#E5EDE9; --muted:#94A49E; --line:#283431;
  --accent:#52CFAF; --accent-ink:#062019; --accent-soft:#12382F;
  --ok:#62C98E; --ok-soft:#132E20; --bad:#F2877E; --bad-soft:#3A1917; --warn:#E6B95C; --warn-soft:#32270E; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:calc(15px * var(--fs));line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.top,main{min-width:0}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.warn{background:var(--warn)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px}
.ctx{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
.ctx::-webkit-scrollbar{display:none}
.ctx:empty{display:none}
.sel{position:relative;flex:1 1 150px;min-width:0;max-width:360px}
.sel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:999px;padding:8px 30px 8px 12px;width:100%;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel .lab{position:absolute;left:-9999px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);font-family:var(--f-mono);letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* main */
main{padding-block:18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:calc(28px * var(--fs));line-height:1.1;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:calc(19px * var(--fs));line-height:1.2}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h2{margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:44px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.block{width:100%}
.big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.due{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:16px}
.due .big{color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.bar-row .n{font-size:14px;font-weight:500;min-width:0}
.bar-row .p{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{grid-column:1/-1;height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .ok{background:var(--ok)} .track .bad{background:var(--bad);opacity:.8}
.spark{display:flex;align-items:flex-end;gap:4px;height:70px;padding-top:6px}
.spark div{flex:1;display:flex;flex-direction:column-reverse;gap:1px;height:100%;min-width:0}
.spark i{display:block;border-radius:3px 3px 0 0;background:var(--ok)}
.spark i.b{background:var(--bad);opacity:.75;border-radius:0}
.spark-l{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--ok)}
.legend span.b::before{background:var(--bad)}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
.field select,.field input,.field textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.field textarea{min-height:120px;font-family:var(--f-mono);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.switch{position:relative;width:46px;height:28px;flex:none;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-ink)}
/* question */
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.progress{flex:1;min-width:80px;height:5px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.timer{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap}
.tag.real{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.tag.gen{border-color:var(--bad);color:var(--bad)}
.tag.exc{border-color:var(--accent);color:var(--accent)}
.tag.std{color:var(--ink)}
.stem{font-family:var(--f-read);font-size:calc(18px * var(--fs));line-height:1.6;margin:2px 0 0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer}
.opt[disabled]{cursor:default}
.opt.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 0 0 1px var(--ok) inset}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 0 0 1px var(--bad) inset}
.orow{display:flex;gap:12px;align-items:baseline}
.letter{font-family:var(--f-mono);font-weight:500;color:var(--accent);flex:none;width:18px}
.opt.correct .letter{color:var(--ok)} .opt.wrong .letter{color:var(--bad)}
.otext{font-family:var(--f-read);font-size:calc(16.5px * var(--fs));line-height:1.5;min-width:0;flex:1}
.mark{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;flex:none;align-self:center}
.opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--bad)}
.why{margin:10px 0 0 30px;padding-top:10px;border-top:1px dashed var(--line);font-size:calc(14.5px * var(--fs));line-height:1.55}
.why .v{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;color:var(--bad)}
.opt.correct .why .v{color:var(--ok)}
.why .v.neutral{color:var(--muted)}
.result{font-family:var(--f-mono);font-size:13px;font-weight:500}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
.box{border-radius:14px;padding:13px 15px;font-size:calc(14.5px * var(--fs));line-height:1.55}
.box h3{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px}
.box.peg{background:var(--warn-soft);border:1px solid var(--warn)} .box.peg h3{color:var(--warn)}
.box.src{border:1px solid var(--line);color:var(--muted);font-size:13px} .box.src h3{color:var(--muted)}
.box.ai{border:1px solid var(--accent);background:var(--surface)} .box.ai h3{color:var(--accent)}
.box.note{background:var(--surface-2);font-size:13.5px}
.md p{margin:0 0 8px} .md ul,.md ol{margin:0 0 8px;padding-left:20px} .md h4{margin:10px 0 4px;font-size:14px} .md table{border-collapse:collapse;font-size:13px} .md td,.md th{border:1px solid var(--line);padding:4px 6px}
.mdwrap{overflow-x:auto}
.qnav{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);padding:8px 0;z-index:5}
.qnav .btn{flex:1}
.qnav .btn.icon{flex:none;min-width:52px}
/* flashcard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-height:260px;display:flex;flex-direction:column;gap:12px}
.card .face{font-family:var(--f-read);font-size:calc(18px * var(--fs));line-height:1.55}
.card .ans{border-top:1px dashed var(--line);padding-top:12px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:2px;font-size:13px}
.rate small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:400}
/* list */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .t{font-family:var(--f-read);font-size:15px;line-height:1.4;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .m{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.li .st{font-family:var(--f-mono);font-size:11px;align-self:start}
.st.ok{color:var(--ok)} .st.bad{color:var(--bad)} .st.no{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.banner{border-radius:12px;padding:10px 14px;font-size:13px;background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink)}
.banner.info{background:var(--accent-soft);border-color:var(--accent)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-family:var(--f-mono);font-size:10px;border-radius:999px;padding:0 5px;line-height:16px;min-width:16px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:50;max-width:calc(100% - 32px)}
@media (min-width:960px){
  :root{--nav-h:0px}
  .shell{grid-template-columns:220px minmax(0,1fr)}
  nav.tabs{position:sticky;top:0;height:100vh;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;border-top:0;border-right:1px solid var(--line);padding:84px 12px 0;gap:4px;grid-row:1/span 2;grid-column:1}
  nav.tabs button{height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;border-radius:12px;font-size:14px}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
  nav.tabs button[aria-current="page"]::before{display:none}
  .badge{position:static;margin-left:auto}
  .top{grid-column:2} main{grid-column:2}
  .qnav{bottom:12px}
  .toast{bottom:24px}
  .sheet{left:50%;right:auto;transform:translateX(-50%);width:min(680px,100%);bottom:auto;top:10vh;border-radius:20px;max-height:80vh}
}
/* focus mode: hide app chrome during a session */
body.focus .top, body.focus nav.tabs{display:none}
body.focus main{padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
body.focus .qnav{bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}
body.focus .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.focus .wrap{gap:12px}
.fsbtn{min-width:40px;padding:0 10px}
@media (min-width:960px){ body.focus .shell{grid-template-columns:minmax(0,1fr)} body.focus main{grid-column:1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-in">
      <div class="brand">Gabarito<i>.</i></div>
      <div class="sync" id="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">…</span></div>
      <button class="iconbtn" type="button" data-act="settings" aria-label="Ajustes" id="btnSettings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="ctx" id="ctx"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Seções"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<div id="layer"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- i18n ---------- */
const T = {
pt:{home:"Início",study:"Estudar",review:"Revisão",cards:"Flashcards",bank:"Banco",
 discipline:"Disciplina",topic:"Tema",all:"Todos",allSubs:"Todos os sub-blocos",

};
function cacheLoad(){ try{ const c=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(c){ if(c.catalog) S.catalog=c.catalog; if(c.qs) c.qs.forEach(q=>S.qs.set(q.id,q)); if(c.prog) S.prog=mergeProg(S.prog,c.prog); } }catch(e){} }
let cacheTimer=null;
function cacheSave(){ clearTimeout(cacheTimer); cacheTimer=setTimeout(()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify({catalog:S.catalog, qs:[...S.qs.values()], prog:S.prog})); }catch(e){} },400); }
function mergeProg(base, p){ return {settings:Object.assign({},base.settings,p.settings||{}), q:p.q||{}, fc:p.fc||{}, log:p.log||{}, sims:p.sims||[]}; }
const set = () => S.prog.settings;
const tr = k => (T[set().lang]||T.pt)[k] ?? T.pt[k] ?? k;

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safe(html){ // allow a tiny tag set from content
  let s = esc(html);
  return s.replace(/&lt;(\/?)(b|i|em|strong|sub|sup|br)&gt;/g, "<$1$2>");
}
function md(text){ // minimal markdown for Claude answers
  const lines = esc(text).split("\n"); let out=[], list=null, tbl=null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<i>$2</i>").replace(/`(.+?)`/g,'<code>$1</code>');
  const flush=()=>{ if(list){out.push(`<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join("")}</${list.t}>`);list=null;} if(tbl){out.push('<div class="mdwrap"><table>'+tbl.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join("")+"</tr>").join("")+"</table></div>");tbl=null;} };
  for(const raw of lines){ const l=raw.trim();
    if(/^\|.*\|$/.test(l)){ if(/^\|[\s:|-]+\|$/.test(l)) continue; if(list) flush(); (tbl=tbl||[]).push(l.slice(1,-1).split("|").map(c=>c.trim())); continue; }
    let m;
    if((m=l.match(/^[-*•]\s+(.*)/))){ if(tbl) flush(); if(!list||list.t!=="ul"){flush();list={t:"ul",items:[]};} list.items.push(m[1]); continue; }
    if((m=l.match(/^\d+[.)]\s+(.*)/))){ if(tbl) flush(); if(!list||list.t!=="ol"){flush();list={t:"ol",items:[]};} list.items.push(m[1]); continue; }
    flush();
    if(!l) continue;
    if((m=l.match(/^#{1,6}\s+(.*)/))){ out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    out.push(`<p>${inline(l)}</p>`);
  }
  flush(); return out.join("");
}
const dayKey = (d=new Date()) => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const now = () => Date.now();
const DAY = 86400000;
function startOfDay(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function fmtTime(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
let toastTimer=null;
function toast(msg){ let el=$("#toast"); if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,2600); }
function arm(btn, label, fn){ if(btn.dataset.armed){ delete btn.dataset.armed; fn(); return; } const old=btn.textContent; btn.dataset.armed="1"; btn.textContent=label; setTimeout(()=>{ if(btn.dataset.armed){ delete btn.dataset.armed; btn.textContent=old; } },3000); }
function applyTheme(){ const t=set().theme; const r=document.documentElement; if(t==="light"||t==="dark") r.setAttribute("data-theme",t); else r.removeAttribute("data-theme"); r.style.setProperty("--fs", set().fs||1); }

/* ---------- catalog / filters ---------- */
function discs(){ return S.catalog?.disciplines || []; }
function curDisc(){ const d=discs(); return d.find(x=>x.id===set().disc) || d[0] || null; }
function curTopic(){ const d=curDisc(); if(!d) return null; return d.topics.find(x=>x.id===set().topic) || d.topics[0] || null; }
function nm(o){ return o?.name?.[set().lang] || o?.name?.pt || o?.name?.en || o?.id || ""; }
function subName(id){ const t=curTopic(); const s=t?.subs?.find(x=>x.id===id); return s? nm(s) : id; }
function inCtx(q){ const d=curDisc(), t=curTopic(); if(!d||!t) return false; if(q.discipline!==d.id||q.topic!==t.id) return false; const st=set().std; return st==="all" || q.standard===st; }
function ctxQs(){ return [...S.qs.values()].filter(inCtx).sort((a,b)=>(a.order??999)-(b.order??999) || a.id.localeCompare(b.id)); }
function content(q){ // returns {c, lang, fallback}
  const L0=set().lang, other=L0==="pt"?"en":"pt";
  if(q.i18n?.[L0]) return {c:q.i18n[L0], lang:L0, fallback:false};
  return {c:q.i18n?.[other], lang:other, fallback:true};
}
function tagsOf(q){ return q.tags?.[set().lang] || q.tags?.pt || q.tags?.en || []; }

/* ---------- progress ---------- */
function rec(id){ return S.prog.q[id]; }
function status(id){ const r=rec(id); if(!r) return "no"; return r.ok? "ok":"bad"; }
function record(q, picked){
  const ok = picked===q.correct; const r = S.prog.q[q.id] || {n:0,nOk:0,box:0};
  r.n++; if(ok) r.nOk++; r.ok=ok; r.a=picked; r.ts=now();
  r.box = ok ? Math.min((r.box||0)+1, INTERVALS.length-1) : 0;
  r.due = ok ? startOfDay(now()) + INTERVALS[r.box]*DAY : startOfDay(now()) + DAY;
  S.prog.q[q.id]=r;
  const k=dayKey(); const lg=S.prog.log[k]||{n:0,ok:0}; lg.n++; if(ok) lg.ok++; S.prog.log[k]=lg;
  pruneLog(); saveProg(); return ok;
}
function rateCard(q, grade){ // 0 missed, 1 hard, 2 good
  const r = S.prog.fc[q.id] || {box:0};
  if(grade===0){ r.box=0; r.due=startOfDay(now())+DAY; }
  else { r.box = grade===1 ? Math.max(1,r.box||0) : Math.min((r.box||0)+1, INTERVALS.length-1); r.due = startOfDay(now()) + INTERVALS[r.box]*DAY; }
  r.ts=now(); S.prog.fc[q.id]=r; saveProg();
}
function pruneLog(){ const keys=Object.keys(S.prog.log).sort(); while(keys.length>120){ delete S.prog.log[keys.shift()]; } }
function dueQs(){ const end=startOfDay(now())+DAY; return ctxQs().filter(q=>{ const r=rec(q.id); return r && r.due!=null && r.due < end; }); }
function dueCards(){ const end=startOfDay(now())+DAY; return ctxQs().filter(q=>{ const r=S.prog.fc[q.id]; return !r || r.due < end; }); }
let saveTimer=null, saving=false, saveAgain=false;
function saveProg(){ cacheSave(); if(!S.db||!S.uid) return; clearTimeout(saveTimer); saveTimer=setTimeout(flushProg, 1200); }
async function flushProg(){
  if(saving){ saveAgain=true; return; } saving=true;
  try{ await S.db.doc("data/users/"+S.uid+"/state").set(JSON.parse(JSON.stringify(S.prog))); setSync("on"); }
  catch(e){ setSync("warn"); }
  finally{ saving=false; if(saveAgain){ saveAgain=false; flushProg(); } }
}

/* ---------- sync indicator ---------- */
function setSync(s){ S.dbState=s; const d=$("#syncDot"), t=$("#syncTxt"); d.className="dot"+(s==="on"?" on":s==="warn"||s==="off"?" warn":""); t.textContent= s==="on"? tr("online") : s==="loading"? tr("loading") : tr("offline"); }

function go(v){ S.view=v; if(location.hash!=="#"+v){ try{ history.replaceState(null,"","#"+v); }catch(e){} } render(); window.scrollTo({top:0}); }
function inSession(){ return (S.session && !S.session.done && (S.view==="study"||S.view==="review") && (S.view==="review"?S.session.kind==="review":S.session.kind!=="review")) || (S.view==="cards" && S.fcDeck && S.fcDeck.i < S.fcDeck.ids.length); }
function render(){ document.body.classList.toggle("focus", !!inSession() && set().focus!==false); document.documentElement.lang=set().lang==="en"?"en":"pt-BR"; renderCtx(); renderTabs(); const v=$("#view");
  if(!S.catalog){ v.innerHTML = S.dbState==="loading"? `<p class="empty">${tr("loading")}…</p>` : `<div class="panel"><h2>${tr("noData")}</h2><p class="lede">${tr("howAddTxt")}</p>${S.owner&&S.db?`<div class="row" style="margin-top:12px"><button class="btn primary" data-act="importOpen">${tr("importJ")}</button></div>`:""}</div>`; return; }
  ({home:vHome, study:vStudy, review:vReview, cards:vCards, bank:vBank}[S.view]||vHome)(v);

/* ---------- STUDY: setup ---------- */
function defaultSetup(){ return {mode:"study", sub:"", origin:"", filter:"all", count:10, shuffleQ:false, shuffleO:true}; }
function setupPool(su){ return ctxQs().filter(q=>{
  if(su.sub && q.sub!==su.sub) return false;
  if(su.origin && q.origin!==su.origin) return false;
  const st=status(q.id); if(su.filter==="open"&&st!=="no") return false; if(su.filter==="wrong"&&st!=="bad") return false; return true; }); }
function vStudy(v){
  if(S.session && S.session.kind!=="review") return vPlayer(v);
  const su = S.setup || (S.setup=defaultSetup()); const t=curTopic(); const pool=setupPool(su);

  v.innerHTML = `
   <div><div class="eyebrow">${esc(nm(t))}</div><h1>${tr("studySetup")}</h1></div>

      <button type="button" class="chip" data-su="mode" data-val="study" aria-pressed="${su.mode==="study"}" style="text-align:left;border-radius:12px;padding:10px 12px"><b>${tr("mStudy")}</b><br><span style="color:var(--muted);font-size:12.5px">${tr("mStudyD")}</span></button>
      <button type="button" class="chip" data-su="mode" data-val="sim" aria-pressed="${su.mode==="sim"}" style="text-align:left;border-radius:12px;padding:10px 12px"><b>${tr("mSim")}</b><br><span style="color:var(--muted);font-size:12.5px">${tr("mSimD")}</span></button></div></div>
    <div class="field"><label for="suSub">${tr("sub")}</label><select id="suSub"><option value="">${tr("allSubs")}</option>${(t?.subs||[]).map(s=>`<option value="${esc(s.id)}" ${su.sub===s.id?"selected":""}>${esc(nm(s))}</option>`).join("")}</select></div>
    <div class="field"><span class="flabel">${tr("origin")}</span><div class="chips">${chip("origin","",tr("oAll"))}${chip("origin","real",tr("oReal"))}${chip("origin","authored",tr("oAuth"))}${chip("origin","generated",tr("oGen"))}</div></div>
    <div class="field"><span class="flabel">${tr("filter")}</span><div class="chips">${chip("filter","all",tr("fAll"))}${chip("filter","open",tr("fOpen"))}${chip("filter","wrong",tr("fWrong"))}</div></div>
    <div class="field"><span class="flabel">${tr("count")}</span><div class="chips">${[5,10,20,40].map(n=>chip("count",n,n)).join("")}${chip("count",0,tr("all"))}</div></div>
    <div>
      <div class="toggle"><span>${tr("shuffleQ")}</span><button type="button" class="switch" role="switch" data-sw="shuffleQ" aria-checked="${su.shuffleQ}" aria-label="${tr("shuffleQ")}"></button></div>
      <div class="toggle"><span>${tr("shuffleO")}</span><button type="button" class="switch" role="switch" data-sw="shuffleO" aria-checked="${su.shuffleO}" aria-label="${tr("shuffleO")}"></button></div>
    </div>
    <div class="row" style="justify-content:space-between"><span class="mono" style="color:var(--muted);font-size:13px">${pool.length} ${tr("available")}</span>
      <button class="btn primary" data-act="startSession" ${pool.length?"":"disabled"}>${tr("start")}</button></div>
   </div>`;
  $("#suSub").onchange=e=>{ su.sub=e.target.value; render(); };
}
function buildSession(kind, list, su){
  let qs = su.shuffleQ ? shuffle(list) : list.slice();
  if(su.count) qs = qs.slice(0, su.count);
  const items = qs.map(q=>({id:q.id, perm: (su.shuffleO && q.origin!=="real") ? shuffle([0,1,2,3,4].slice(0,(q.i18n.pt||q.i18n.en).opts.length)) : [...Array((q.i18n.pt||q.i18n.en).opts.length).keys()], pick:null}));
  return {kind, mode: kind==="review"?"study":su.mode, items, i:0, t0:now(), done:false, std:set().std, topic:curTopic()?.id};
}

/* ---------- PLAYER ---------- */
let timerInt=null;
function vPlayer(v){
  const s=S.session; clearInterval(timerInt);
  if(!s.items.length){ v.innerHTML=`<p class="empty">${tr("sessionEmpty")}</p>`; return; }
  if(s.done) return vResult(v);
  const it=s.items[s.i]; const q=S.qs.get(it.id);
  if(!q){ s.items.splice(s.i,1); s.i=Math.min(s.i,s.items.length-1); return vPlayer(v); }
  const reveal = s.mode==="study" && it.pick!==null;
  v.innerHTML = `
   <div class="qtop"><span class="qnum">${tr("q")} ${s.i+1} ${tr("of")} ${s.items.length}</span>
     <div class="progress"><i style="width:${100*(s.items.filter(x=>x.pick!==null).length)/s.items.length}%"></i></div>
     ${s.mode==="sim"?`<span class="timer" id="timer">${fmtTime((now()-s.t0)/1000)}</span>`:""}
     ${document.fullscreenEnabled?`<button class="btn small ghost fsbtn" data-act="fs" aria-label="Tela cheia">${document.fullscreenElement?"⤡":"⛶"}</button>`:""}<button class="btn small ghost fsbtn" data-act="exit" aria-label="${tr("exitSession")}" title="${tr("exitSession")}">✕</button></div>
   ${questionHTML(q, it, reveal, s.mode==="sim")}
   <div class="qnav">
     <button class="btn icon" data-act="prev" ${s.i===0?"disabled":""} aria-label="${tr("prev")}">←</button>
     ${s.i<s.items.length-1 ? `<button class="btn ${ (reveal || (s.mode==="sim"&&it.pick!==null)) ? "primary":""}" data-act="next">${tr("next")} →</button>`
       : (s.mode==="sim" ? `<button class="btn primary" data-act="finish">${tr("finish")}</button>` : `<button class="btn primary" data-act="finish">${tr("finish")}</button>`)}
   </div>`;
  if(s.mode==="sim"){ timerInt=setInterval(()=>{ const el=$("#timer"); if(el) el.textContent=fmtTime((now()-s.t0)/1000); else clearInterval(timerInt); },1000); }
  hydrateAI(q);
}
function questionHTML(q, it, reveal, simMode){
  const {c, lang, fallback} = content(q); if(!c) return "";
  const perm = it?.perm || c.opts.map((_,i)=>i);
  const pick = it?.pick ?? null;
  const tags = [];
  tags.push(`<span class="tag std">${q.standard.toUpperCase()}${q.step?" · "+esc(q.step):""}</span>`);
  if(q.exam) tags.push(`<span class="tag real">${esc(q.exam)}</span>`);
  if(q.origin==="generated") tags.push(`<span class="tag gen">IA${q.reviewed?"":" · "+tr("notReviewed")}</span>`);
  tagsOf(q).forEach(t=>tags.push(`<span class="tag">${esc(t)}</span>`));
  if(q.exc) tags.push(`<span class="tag exc">${set().lang==="en"?"Except / incorrect":"Exceto / incorreta"}</span>`);
  const hasMore = c.opts.some(o=>o.more) || !!c.pegMore;
  const det = hasMore && (S.detail.has(q.id) ? !set().detail : !!set().detail);
  const opts = perm.map((orig,pos)=>{
    const o=c.opts[orig]; let cls="opt", mark="";
    if(reveal){ if(orig===q.correct){cls+=" correct";mark=orig===pick?tr("answer")+" · ✓":tr("answer");} else if(orig===pick){cls+=" wrong";mark=tr("yourAns");} }
    else if(simMode && orig===pick){ cls+=" picked"; }
    const verdict = orig===q.correct ? tr("answer") : (q.exc ? tr("trueStmt") : tr("whyNot"));
    const why = reveal ? `<div class="why"><span class="v ${orig!==q.correct&&q.exc?"neutral":""}">${verdict}</span>${safe(det&&o.more?o.more:o.why)}</div>` : "";
    return `<button type="button" class="${cls}" data-pick="${orig}" ${reveal?"disabled":""}><div class="orow"><span class="letter">${L[pos]}</span><span class="otext">${safe(o.t)}</span>${mark?`<span class="mark">${mark}</span>`:""}</div>${why}</button>`;
  }).join("");
  const fb = fallback ? `<div class="banner info"><div>${set().lang==="pt"?tr("onlyIn"):tr("onlyInEn")}</div>${S.sample?`<div class="row" style="margin-top:8px"><button class="btn small" data-act="translate" data-q="${esc(q.id)}">${tr("translate")}</button></div>`:""}<div id="tr-${esc(q.id)}"></div></div>` : "";
  const after = reveal ? `
    <div class="result ${pick===q.correct?"ok":"bad"}">${pick===q.correct?"✓ "+tr("right"):"✗ "+tr("wrongAns")+" "+L[perm.indexOf(q.correct)]}</div>
    ${hasMore?`<div class="row"><button class="btn small" data-act="detail" data-q="${esc(q.id)}" aria-pressed="${det}">${det?"− "+tr("less"):"+ "+tr("more")}</button></div>`:""}
    ${c.peg?`<div class="box peg"><h3>${tr("trap")}</h3>${safe(det&&c.pegMore?c.pegMore:c.peg)}</div>`:""}
    ${c.src?`<div class="box src"><h3>${tr("source")}</h3>${safe(c.src)}</div>`:""}
    ${S.sample?`<div class="row"><button class="btn" data-act="explain" data-q="${esc(q.id)}">✦ ${tr("explain")}</button></div><div id="ai-${esc(q.id)}"></div>`:""}` : "";
  return `<div class="tags">${tags.join("")}</div>${fb}<p class="stem" lang="${lang==="en"?"en":"pt-BR"}">${safe(c.stem)}</p><div class="opts" lang="${lang==="en"?"en":"pt-BR"}">${opts}</div>${after}`;
}
function vResult(v){
  const s=S.session; const n=s.items.length; const ok=s.items.filter(it=>{ const q=S.qs.get(it.id); return q && it.pick===q.correct; }).length;
  const secs=s.secs ?? (now()-s.t0)/1000;
  v.innerHTML = `
   <div><div class="eyebrow">${tr("simDone")}</div><h1>${ok}/${n} · ${Math.round(100*ok/n)}%</h1><p class="lede">${tr("time")}: ${fmtTime(secs)} · ${fmtTime(secs/n)}/${set().lang==="en"?"question":"questão"}</p></div>
   <div class="row"><button class="btn primary" data-act="newSession">${tr("newSession")}</button><button class="btn" data-nav="home">${tr("backHome")}</button></div>
   <div class="panel"><h2>${tr("reviewList")}</h2><div class="list">${s.items.map((it,i)=>{ const q=S.qs.get(it.id); if(!q) return ""; const c=content(q).c; const good=it.pick===q.correct; return `
     <button type="button" class="li" data-act="reviewItem" data-i="${i}"><span class="t">${i+1}. ${safe(c.stem)}</span><span class="st ${it.pick===null?"no":good?"ok":"bad"}">${it.pick===null?"—":good?"✓":"✗"}</span>
     <span class="m">${tagsOf(q).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</span></button>`; }).join("")}</div></div>`;
}

   + "QUESTION:\n" + plain(c.stem) + "\n\nOPTIONS:\n" + c.opts.map((o,i)=>`${"ABCDE"[i]}) ${plain(o.t)}${i===q.correct?"  [CORRECT]":""}`).join("\n")

const CFG = window.GABARITO_CONFIG || {};
let SB = null;
function sbReady(){ return !!(SB && S.uid); }
function rowToQ(r){ return Object.assign({id:r.id}, r.data); }
function qToRow(q){ const {id, ...data}=q; return {id, discipline:data.discipline, topic:data.topic, data, updated_at:new Date().toISOString()}; }
// adapter with the subset of the artifact db API the UI uses
const DBA = {
  doc(path){
    const [col,id] = path.startsWith("data/users/") ? ["progress", null] : path.split("/");
    return {
      async set(obj){
        if(col==="progress"){ const {error}=await SB.from("progress").upsert({user_id:S.uid, state:obj, updated_at:new Date().toISOString()}); if(error) throw error; return; }
        if(col==="questions"){ const {error}=await SB.from("questions").upsert(qToRow(Object.assign({id},obj))); if(error) throw error; return; }
        if(col==="catalog"){ const {error}=await SB.from("catalog").upsert({id, data:obj, updated_at:new Date().toISOString()}); if(error) throw error; return; }
      },
      async update(patch){
        if(col!=="questions") throw new Error("unsupported");
        const cur=S.qs.get(id); if(!cur) throw new Error("missing");
        const merged=deepMerge(JSON.parse(JSON.stringify(cur)), patch);
        const {error}=await SB.from("questions").upsert(qToRow(merged)); if(error) throw error; S.qs.set(id, merged);
      },
      async delete(){ const {error}=await SB.from(col).delete().eq("id",id); if(error) throw error; }
    };
  }
};
function deepMerge(a,b){ for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }

async function fetchAll(){
  setSync("loading");
  try{
    const c=await SB.from("catalog").select("id,data").eq("id","main").maybeSingle();
    if(c.error) throw c.error;
    if(c.data) S.catalog=c.data.data;
    const qs=new Map(); let from=0;
    for(;;){ const r=await SB.from("questions").select("id,data").order("id").range(from, from+999); if(r.error) throw r.error; r.data.forEach(x=>qs.set(x.id,rowToQ(x))); if(r.data.length<1000) break; from+=1000; }
    S.qs=qs;
    const p=await SB.from("progress").select("state,updated_at").eq("user_id",S.uid).maybeSingle();
    if(p.error) throw p.error;
    if(p.data?.state){ const remote=p.data.state; const lt=Math.max(0,...Object.values(S.prog.q).map(r=>r.ts||0)); const rt=Math.max(0,...Object.values(remote.q||{}).map(r=>r.ts||0));
      if(rt>=lt) S.prog=mergeProg(S.prog,remote); else saveProg(); }
    else if(Object.keys(S.prog.q).length) saveProg();
    applyTheme(); setSync("on"); cacheSave();
  }catch(e){ console.error(e); setSync("off"); }
  if(!(S.session && (S.view==="study"||S.view==="review"))) render(); else renderTabs();
}

   <form class="panel" id="loginForm" style="display:flex;flex-direction:column;gap:12px">
     <div class="field"><label for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="email" required></div>
     <div class="field"><label for="lgPass">${set().lang==="en"?"Password":"Senha"}</label><input id="lgPass" type="password" autocomplete="current-password" minlength="6" required></div>
     ${msg?`<div class="banner">${esc(msg)}</div>`:""}
     <button class="btn primary" type="submit" id="lgIn">${set().lang==="en"?"Sign in":"Entrar"}</button>
     <button class="btn" type="button" id="lgUp">${set().lang==="en"?"Create account (first time)":"Criar conta (primeiro acesso)"}</button>
     ${S.qs.size?`<button class="btn ghost" type="button" id="lgOff">${set().lang==="en"?"Continue offline with saved copy":"Continuar offline com a cópia salva"}</button>`:""}
   </form>`;
  const f=$("#loginForm"), em=$("#lgEmail"), pw=$("#lgPass");
  f.onsubmit=async e=>{ e.preventDefault(); $("#lgIn").disabled=true; const {error}=await SB.auth.signInWithPassword({email:em.value.trim(), password:pw.value}); const b=$("#lgIn"); if(b) b.disabled=false; if(error) return vLogin(error.message); };
  $("#lgUp").onclick=async ()=>{ if(!f.reportValidity()) return; const {data,error}=await SB.auth.signUp({email:em.value.trim(), password:pw.value, options:{emailRedirectTo:location.origin+location.pathname}}); if(error) return vLogin(error.message); if(!data.session) vLogin(set().lang==="en"?"Check your e-mail to confirm the account, then sign in.":"Confira seu e-mail para confirmar a conta e depois entre."); };
  const off=$("#lgOff"); if(off) off.onclick=()=>{ S.offlineMode=true; setSync("off"); render(); };
}
async function signOut(){ try{ await SB.auth.signOut(); }catch(e){} S.uid=null; S.owner=false; closeSheet(); vLogin(); }

/* import / export packs */
function openImport(){
  openSheet(`<div class="row" style="justify-content:space-between"><h2>${tr("importJ")}</h2><button class="btn small ghost" data-act="closeSheet">✕</button></div>
   <p class="lede">${set().lang==="en"?"Choose a .json content pack sent by Claude, or paste its content.":"Escolha o pacote .json enviado pelo Claude, ou cole o conteúdo."}</p>
   <div class="field"><label for="impFile">${set().lang==="en"?"File":"Arquivo"}</label><input id="impFile" type="file" accept="application/json,.json"></div>
   <div class="field"><label for="impTxt">JSON</label><textarea id="impTxt" placeholder="${tr("importPh")}"></textarea></div>
   <button class="btn primary" data-act="importRun" id="impBtn">${tr("importDo")}</button>`, ()=>{
     $("#impFile").onchange=async e=>{ const f=e.target.files[0]; if(f) $("#impTxt").value=await f.text(); };
   });
}
async function importRun(){
  let pack; try{ pack=JSON.parse($("#impTxt").value); }catch(e){ toast("JSON inválido / invalid JSON"); return; }
  const qs = Array.isArray(pack) ? pack : (pack.questions||[]);
  const btn=$("#impBtn"); btn.disabled=true;
  try{
    if(pack.catalog){ const merged=mergeCatalog(S.catalog||{disciplines:[]}, pack.catalog); const {error}=await SB.from("catalog").upsert({id:"main", data:merged, updated_at:new Date().toISOString()}); if(error) throw error; S.catalog=merged; }
    const rows=qs.filter(q=>q&&q.id&&q.i18n&&q.discipline&&q.topic).map(qToRow);
    for(let i=0;i<rows.length;i+=200){ const {error}=await SB.from("questions").upsert(rows.slice(i,i+200)); if(error) throw error; }
    toast(`${tr("imported")}: ${rows.length}`); closeSheet(); await fetchAll();
  }catch(e){ toast((e&&e.message)||tr("aiErr")); btn.disabled=false; }
}
function mergeCatalog(a,b){
  const out=JSON.parse(JSON.stringify(a)); out.disciplines=out.disciplines||[];
  for(const d of (b.disciplines||[])){ let od=out.disciplines.find(x=>x.id===d.id); if(!od){ out.disciplines.push(JSON.parse(JSON.stringify(d))); continue; } od.name=d.name||od.name; od.topics=od.topics||[];
    for(const t of (d.topics||[])){ const i=od.topics.findIndex(x=>x.id===t.id); if(i<0) od.topics.push(t); else od.topics[i]=Object.assign({},od.topics[i],t); } }
  out.updated=new Date().toISOString(); return out;
}
function exportJSON(){
  const pack={format:"gabarito-pack",version:1,catalog:S.catalog,questions:ctxQs()};
  const blob=new Blob([JSON.stringify(pack,null,1)],{type:"application/json"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`gabarito-${curDisc()?.id}-${curTopic()?.id}-${dayKey()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
function subscribeQs(){ /* questions are fetched on open and when the app returns to foreground */ }

async function boot(){
  cacheLoad(); applyTheme();
  const h=(location.hash||"").slice(1); if(["home","study","review","cards","bank"].includes(h)) S.view=h;
  S.downloads=true; // enables the export button (plain browser download)
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
  if(!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase){ setSync("off"); render(); if(!CFG.SUPABASE_URL) toast("config.js sem Supabase"); return; }
  SB = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  S.db = DBA;
  const {data:{session}} = await SB.auth.getSession();
  const onSession = async sess=>{
    if(sess?.user){ const changed=S.uid!==sess.user.id; S.uid=sess.user.id; window.__email=sess.user.email; S.owner=(sess.user.email||"").toLowerCase()===(CFG.ADMIN_EMAIL||"").toLowerCase(); if(changed){ render(); fetchAll(); } }
    else { S.uid=null; if(!S.offlineMode) vLogin(); }
  };
  SB.auth.onAuthStateChange((_e,sess)=>{ onSession(sess); });
  if(session) onSession(session); else if(navigator.onLine===false && S.qs.size){ S.offlineMode=true; setSync("off"); render(); } else vLogin();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && sbReady()) fetchAll(); });
  window.addEventListener("online",()=>{ if(sbReady()){ saveProg(); fetchAll(); } });
}
boot();
</script>
