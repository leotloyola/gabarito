<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gabarito</title>
<meta name="description" content="Estudo médico com questões comentadas — UFPR e USMLE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F5F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Soft Light & Clean — paleta Tailwind (stone/zinc/teal/emerald/rose), cantos 2xl, sombras quase invisíveis, bordas mínimas */
:root{
  --bg:#F5F5F4;            /* stone-100 */
  --surface:#FFFFFF;       /* white */
  --surface-2:#F4F4F5;     /* zinc-100 */
  --pill:rgba(228,228,231,.5); /* zinc-200/50 */
  --ink:#18181B;           /* zinc-900 */
  --ink-2:#27272A;         /* zinc-800 */
  --muted:#71717A;         /* zinc-500 */
  --subtle:#A1A1AA;        /* zinc-400 */
  --line:#E4E4E7;          /* zinc-200 */
  --hair:rgba(24,24,27,.06);
  --accent:#0F766E;        /* teal-700 */
  --usmle:#4338CA; --usmle-soft:#EEF2FF; --usmle-line:#C7D2FE;  /* indigo 700/50/200 */
  --accent-ink:#FFFFFF;
  --accent-soft:#F0FDFA;   /* teal-50 */
  --ok:#059669; --ok-soft:#ECFDF5; --ok-bar:#6EE7B7;     /* emerald 600/50/300 */
  --bad:#E11D48; --bad-soft:#FFF1F2; --bad-bar:#FDA4AF;  /* rose 600/50/300 */
  --warn:#B45309; --warn-soft:#FFFBEB; --warn-line:#FDE68A; /* amber 700/50/200 */
  --shadow:0 1px 2px rgba(24,24,27,.04),0 1px 1px rgba(24,24,27,.02);
  --shadow-md:0 4px 24px rgba(24,24,27,.05);
  --glass:linear-gradient(135deg,rgba(204,251,241,.75) 0%,rgba(236,253,245,.7) 55%,rgba(240,253,250,.6) 100%);
  --f-display:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-ui:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"Inter", system-ui, sans-serif;
  --fs:1;
  --nav-h:66px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#09090B; --surface:#18181B; --surface-2:#27272A; --pill:rgba(63,63,70,.5); --ink:#F4F4F5; --ink-2:#E4E4E7; --muted:#A1A1AA; --subtle:#71717A; --line:#27272A; --hair:rgba(255,255,255,.06);
  --accent:#5EEAD4; --accent-ink:#042F2E; --accent-soft:#042F2E; --usmle:#A5B4FC; --usmle-soft:#1E1B4B; --usmle-line:#3730A3;
  --ok:#34D399; --ok-soft:#022C22; --ok-bar:#10B981; --bad:#FB7185; --bad-soft:#2A0A12; --bad-bar:#E11D48; --warn:#FCD34D; --warn-soft:#271A04; --warn-line:#78350F;
  --shadow:none; --shadow-md:none; --glass:linear-gradient(135deg,rgba(19,78,74,.55),rgba(6,78,59,.35)); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:calc(15px * var(--fs));line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%;align-content:start}
.top,main{min-width:0}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px;white-space:nowrap;color:var(--ink)}
.brand i{font-style:normal;color:var(--accent)}
.sync{font-size:11px;color:var(--subtle);margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:.02em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--subtle)}
.dot.on{background:#34D399} .dot.warn{background:#FBBF24}
.iconbtn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;color:var(--ink-2)}
.ctx{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
.ctx::-webkit-scrollbar{display:none}
.ctx:empty{display:none}
.sel{position:relative;flex:1 1 150px;min-width:0;max-width:360px}
.sel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--surface);border:0;box-shadow:var(--shadow),0 0 0 1px var(--hair);border-radius:999px;padding:9px 32px 9px 14px;width:100%;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--subtle);border-bottom:1.5px solid var(--subtle);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel .lab{position:absolute;left:-9999px}
.seg{display:inline-flex;background:var(--pill);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(24,24,27,.08)}
.seg button[data-std="usmle"][aria-pressed="true"]{color:var(--usmle);box-shadow:0 0 0 1px var(--usmle-line) inset,0 1px 3px rgba(67,56,202,.12)}
.tag.std.usmle{background:var(--usmle-soft);color:var(--usmle);box-shadow:0 0 0 1px var(--usmle-line) inset}
.ddot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
/* main */
main{padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:600;font-size:calc(26px * var(--fs));line-height:1.15;letter-spacing:-.025em;color:var(--ink)}
h2{font-family:var(--f-display);font-weight:600;font-size:calc(15px * var(--fs));line-height:1.3;letter-spacing:-.01em;color:var(--ink)}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--subtle)}
.lede{color:var(--muted);margin:4px 0 0;font-size:14px}
.panel{background:var(--surface);border:0;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.panel h2{margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--hair);color:var(--ink-2);border-radius:999px;padding:12px 20px;font-weight:500;cursor:pointer;min-height:46px;text-align:center;transition:transform .12s ease,box-shadow .15s ease,background .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--surface);box-shadow:0 1px 2px rgba(24,24,27,.12)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{min-height:36px;padding:7px 14px;font-size:13px}
.btn.danger{color:var(--bad);box-shadow:0 0 0 1px var(--bad-bar)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.block{width:100%}
.big{font-family:var(--f-display);font-weight:300;font-size:46px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--ink)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border-radius:16px;padding:16px 14px 14px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--f-display);font-weight:500;font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--ink)}
.kpi .v small{font-size:13px;font-weight:400;color:var(--subtle);letter-spacing:0;margin-left:1px}
.kpi .l{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);margin-top:8px}
/* due card (vidro fosco) */
.due{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:22px 20px;box-shadow:var(--shadow-md)}
.due::before{content:"";position:absolute;width:180px;height:180px;right:-50px;top:-70px;border-radius:50%;background:radial-gradient(circle,rgba(153,246,228,.55),transparent 70%);pointer-events:none}
.due > *{position:relative}
/* tingido pela cor da disciplina (--dc), quando definida */
.due.dc{background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 16%,#fff) 0%,color-mix(in srgb,var(--dc) 7%,#fff) 55%,color-mix(in srgb,var(--dc) 4%,#fff) 100%)}
.due.dc::before{background:radial-gradient(circle,color-mix(in srgb,var(--dc) 30%,transparent),transparent 70%)}
.due.dc .eyebrow{color:var(--dc);opacity:.9}
.due.dc .lede{color:color-mix(in srgb,var(--dc) 60%,var(--ink));opacity:.9}
.due.dc .btn.pill{box-shadow:0 1px 2px rgba(24,24,27,.06),0 4px 14px color-mix(in srgb,var(--dc) 18%,transparent)}
:root[data-theme="dark"] .due.dc{background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 30%,#18181B),color-mix(in srgb,var(--dc) 14%,#18181B))}
:root[data-theme="dark"] .due.dc .eyebrow,:root[data-theme="dark"] .due.dc .lede{color:color-mix(in srgb,var(--dc) 45%,#fff)}
.due .eyebrow{color:#0F766E;opacity:.75}
.due .big{color:var(--ink);margin-top:6px}
.due .lede{color:#115E59;opacity:.8}
.due .btn.pill{background:#FFFFFF;color:var(--ink);box-shadow:0 1px 2px rgba(24,24,27,.06),0 4px 14px rgba(15,118,110,.10);padding:12px 22px;font-weight:600;white-space:nowrap}
:root[data-theme="dark"] .due{border-color:rgba(255,255,255,.06)}
:root[data-theme="dark"] .due .eyebrow,:root[data-theme="dark"] .due .lede{color:#99F6E4}
:root[data-theme="dark"] .due .btn.pill{background:#F4F4F5;color:#18181B}
/* atalhos */
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:16px 16px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink-2);transition:transform .12s ease,box-shadow .15s ease}
.sc:hover{box-shadow:var(--shadow-md)}
.sc:active{transform:scale(.985)}
.sc .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--pill);display:grid;place-items:center;color:var(--ink-2)}
.sc .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sc .tx{min-width:0;flex:1}
.sc b{display:block;font-weight:500;font-size:14.5px;color:var(--ink-2);letter-spacing:-.01em}
.sc small{display:block;font-size:12px;color:var(--subtle);margin-top:1px}
.sc .go{flex:none;color:var(--subtle)}
.sc.main .ic{background:var(--ink);color:var(--surface)}
@media (min-width:700px){ .sc{flex-direction:column;align-items:flex-start;gap:12px;padding:18px} .sc .go{display:none} }
/* barras */
.bars{display:flex;flex-direction:column;gap:16px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 12px;align-items:baseline}
.bar-row .n{font-size:13.5px;font-weight:500;min-width:0;color:var(--ink-2)}
.bar-row .p{font-size:12px;font-weight:300;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar-row .p b{font-weight:500;color:var(--ink-2)}
.track{grid-column:1/-1;height:4px;border-radius:999px;background:var(--line);overflow:hidden;display:flex;gap:2px}
.track i{display:block;height:100%;border-radius:999px}
.track .ok{background:var(--ok-bar)} .track .bad{background:var(--bad-bar)}
.spark{display:flex;align-items:flex-end;gap:5px;height:72px;padding-top:6px}
.spark div{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%;min-width:0}
.spark i{display:block;border-radius:4px;background:var(--ok-bar)}
.spark i.b{background:var(--bad-bar)}
.spark-l{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin-top:6px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--ok-bar)}
.legend span.b::before{background:var(--bad-bar)}
/* forms */
.field{display:flex;flex-direction:column;gap:7px}
.field label,.flabel{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle)}
.field select,.field input,.field textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:0;box-shadow:0 0 0 1px var(--hair) inset;border-radius:14px;padding:11px 14px;min-height:46px;width:100%}
.field textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--pill);color:var(--ink-2);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:500;transition:background .15s ease}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] span{color:color-mix(in srgb,var(--surface) 70%,transparent)!important}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.switch{position:relative;width:44px;height:26px;flex:none;border-radius:999px;background:var(--line);border:0;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--surface)}
/* question */
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qnum{font-weight:500;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{flex:1;min-width:80px;height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:999px}
.timer{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border:0;border-radius:999px;background:var(--pill);color:var(--muted);white-space:nowrap}
.tag.real{background:var(--warn-soft);color:var(--warn);box-shadow:0 0 0 1px var(--warn-line) inset}
.tag.gen{background:var(--bad-soft);color:var(--bad)}
.tag.exc{background:var(--accent-soft);color:var(--accent)}
.tag.std{color:var(--ink-2)}
.stem{font-family:var(--f-read);font-size:calc(18px * var(--fs));line-height:1.65;margin:2px 0 0;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:0;box-shadow:var(--shadow),0 0 0 1px var(--hair);border-radius:18px;padding:15px 16px;cursor:pointer;transition:box-shadow .15s ease,background .15s ease}
.opt:not([disabled]):hover{box-shadow:var(--shadow-md),0 0 0 1px var(--line)}
.opt[disabled]{cursor:default}
.opt.picked{box-shadow:0 0 0 1.5px var(--ink)}
.opt.correct{background:var(--ok-soft);box-shadow:0 0 0 1.5px var(--ok-bar)}
.opt.wrong{background:var(--bad-soft);box-shadow:0 0 0 1.5px var(--bad-bar)}
.orow{display:flex;gap:12px;align-items:baseline}
.letter{font-weight:600;font-size:13px;color:var(--subtle);flex:none;width:18px}
.opt.picked .letter{color:var(--ink)}
.opt.correct .letter{color:var(--ok)} .opt.wrong .letter{color:var(--bad)}
.otext{font-family:var(--f-read);font-size:calc(16.5px * var(--fs));line-height:1.55;min-width:0;flex:1;color:var(--ink)}
.mark{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;flex:none;align-self:center}
.opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--bad)}
.why{margin:12px 0 0 30px;padding-top:12px;border-top:1px solid var(--hair);font-size:calc(14.5px * var(--fs));line-height:1.6;color:var(--ink-2)}
.why .v{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;color:var(--bad)}
.opt.correct .why .v{color:var(--ok)}
.why .v.neutral{color:var(--subtle)}
.result{font-size:13px;font-weight:600}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
.box{border-radius:18px;padding:15px 16px;font-size:calc(14.5px * var(--fs));line-height:1.6}
.box h3{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}
.box.peg{background:var(--warn-soft);box-shadow:0 0 0 1px var(--warn-line) inset} .box.peg h3{color:var(--warn)}
.box.src{background:transparent;box-shadow:0 0 0 1px var(--line) inset;color:var(--muted);font-size:13px} .box.src h3{color:var(--subtle)}
.box.ai{background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--hair)} .box.ai h3{color:var(--accent)}
.box.note{background:var(--pill);font-size:13.5px}
.md p{margin:0 0 8px} .md ul,.md ol{margin:0 0 8px;padding-left:20px} .md h4{margin:10px 0 4px;font-size:14px} .md table{border-collapse:collapse;font-size:13px} .md td,.md th{border:1px solid var(--line);padding:4px 6px}
.mdwrap{overflow-x:auto}
.qnav{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:10px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 0;z-index:5}
.qnav .btn{flex:1}
.qnav .btn.icon{flex:none;min-width:52px}
/* flashcard */
.card{background:var(--surface);border:0;box-shadow:var(--shadow-md);border-radius:24px;padding:24px 22px;min-height:260px;display:flex;flex-direction:column;gap:14px}
.card .face{font-family:var(--f-read);font-size:calc(18px * var(--fs));line-height:1.6}
.card .ans{border-top:1px solid var(--hair);padding-top:14px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:2px;font-size:13px;border-radius:18px}
.rate small{font-size:10.5px;color:var(--subtle);font-weight:400}
/* list */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 0;border-top:1px solid var(--hair);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .t{font-family:var(--f-read);font-size:15px;line-height:1.45;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}

function md(text){ // minimal markdown for Claude answers
  const lines = esc(text).split("\n"); let out=[], list=null, tbl=null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<i>$2</i>").replace(/`(.+?)`/g,'<code>$1</code>');
  const flush=()=>{ if(list){out.push(`<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join("")}</${list.t}>`);list=null;} if(tbl){out.push('<div class="mdwrap"><table>'+tbl.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join("")+"</tr>").join("")+"</table></div>");tbl=null;} };
  for(const raw of lines){ const l=raw.trim();
    if(/^\|.*\|$/.test(l)){ if(/^\|[\s:|-]+\|$/.test(l)) continue; if(list) flush(); (tbl=tbl||[]).push(l.slice(1,-1).split("|").map(c=>c.trim())); continue; }
    let m;
    if((m=l.match(/^[-*•]\s+(.*)/))){ if(tbl) flush(); if(!list||list.t!=="ul"){flush();list={t:"ul",items:[]};} list.items.push(m[1]); continue; }
    if((m=l.match(/^\d+[.)]\s+(.*)/))){ if(tbl) flush(); if(!list||list.t!=="ol"){flush();list={t:"ol",items:[]};} list.items.push(m[1]); continue; }
    flush();
    if(!l) continue;
    if((m=l.match(/^#{1,6}\s+(.*)/))){ out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    out.push(`<p>${inline(l)}</p>`);
  }
  flush(); return out.join("");
}
const dayKey = (d=new Date()) => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const now = () => Date.now();
const DAY = 86400000;
function startOfDay(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function fmtTime(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
let toastTimer=null;
function toast(msg){ let el=$("#toast"); if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,2600); }
function arm(btn, label, fn){ if(btn.dataset.armed){ delete btn.dataset.armed; fn(); return; } const old=btn.textContent; btn.dataset.armed="1"; btn.textContent=label; setTimeout(()=>{ if(btn.dataset.armed){ delete btn.dataset.armed; btn.textContent=old; } },3000); }
function applyTheme(){ const t=set().theme; const r=document.documentElement; if(t==="light"||t==="dark") r.setAttribute("data-theme",t); else r.removeAttribute("data-theme"); r.style.setProperty("--fs", set().fs||1); }

/* ---------- catalog / filters ---------- */
function discs(){ return S.catalog?.disciplines || []; }
function curDisc(){ const d=discs(); return d.find(x=>x.id===set().disc) || d[0] || null; }
function examPseudo(d, exId){ const ex=(d.exams||[]).find(e=>e.id===exId); if(!ex) return null; const tps=d.topics.filter(t=>ex.all || t.exam===ex.id); const L0=set().lang;
  return {id:"exam:"+ex.id, pseudo:true, name:{pt:(ex.name?.pt||ex.id)+" · todos os temas", en:(ex.name?.en||ex.id)+" · all topics"}, topics:tps.map(t=>t.id), subs:tps.map(t=>({id:t.id,name:t.name}))}; }
let _ctKey=null,_ctVal=null;
function curTopic(){ const key=(set().disc||"")+"|"+(set().topic||"")+"|"+S.qs.size+"|"+set().lang+"|"+(S.catalog?.updated||""); if(key===_ctKey) return _ctVal; _ctKey=key; return (_ctVal=curTopic0()); }
function curTopic0(){ const d=curDisc(); if(!d) return null; const k=set().topic||""; if(k.startsWith("exam:")){ const p=examPseudo(d,k.slice(5)); if(p) return p; }
  return d.topics.find(x=>x.id===k) || d.topics.find(x=>topicCount(x.id)>0) || d.topics[0] || null; }
function topicCount(id){ let n=0; for(const q of S.qs.values()) if(q.topic===id) n++; return n; }
function subOf(q){ return curTopic()?.pseudo ? q.topic : q.sub; }
function nm(o){ return o?.name?.[set().lang] || o?.name?.pt || o?.name?.en || o?.id || ""; }
function subName(id){ const t=curTopic(); const s=t?.subs?.find(x=>x.id===id); return s? nm(s) : id; }
function inCtx(q){ const d=curDisc(), t=curTopic(); if(!d||!t) return false; if(q.discipline!==d.id||(t.pseudo? !t.topics.includes(q.topic) : q.topic!==t.id)) return false; const st=set().std; return st==="all" || q.standard===st; }
function ctxQs(){ return [...S.qs.values()].filter(inCtx).sort((a,b)=>(a.order??999)-(b.order??999) || a.id.localeCompare(b.id)); }
function content(q){ // returns {c, lang, fallback}
  const L0=set().lang, other=L0==="pt"?"en":"pt";
  if(q.i18n?.[L0]) return {c:q.i18n[L0], lang:L0, fallback:false};
  return {c:q.i18n?.[other], lang:other, fallback:true};
}
function tagsOf(q){ return q.tags?.[set().lang] || q.tags?.pt || q.tags?.en || []; }

/* ---------- progress ---------- */
function rec(id){ return S.prog.q[id]; }
function status(id){ const r=rec(id); if(!r) return "no"; return r.ok? "ok":"bad"; }
function record(q, picked, ctx={}){
  const ok = picked===q.correct; const r = S.prog.q[q.id] || {n:0,nOk:0,box:0};
  if(r.first==null) r.first = r.n===0 ? ok : (r.n===1 ? !!r.ok : null);
  r.n++; if(ok) r.nOk++; r.ok=ok; r.a=picked; r.ts=now();
  // registro de cada resposta: [ts(s), id, acerto, revisão, segundos(-1 = n/d)]
  S.prog.ev=(S.prog.ev||[]); S.prog.ev.push([Math.round(now()/1000), q.id, ok?1:0, ctx.rev?1:0, ctx.ms!=null?Math.min(3600,Math.round(ctx.ms/1000)):-1]); if(S.prog.ev.length>20000) S.prog.ev.splice(0,S.prog.ev.length-20000);
  r.box = ok ? Math.min((r.box||0)+1, INTERVALS.length-1) : 0;
  r.due = ok ? startOfDay(now()) + INTERVALS[r.box]*DAY : startOfDay(now()) + DAY;
  S.prog.q[q.id]=r;
  const k=dayKey(); const lg=S.prog.log[k]||{n:0,ok:0}; lg.n++; if(ok) lg.ok++; S.prog.log[k]=lg;
  pruneLog(); saveProg(); return ok;
}
function rateCard(q, grade){ // 0 missed, 1 hard, 2 good
  const r = S.prog.fc[q.id] || {box:0};
  if(grade===0){ r.box=0; r.due=startOfDay(now())+DAY; }
  else { r.box = grade===1 ? Math.max(1,r.box||0) : Math.min((r.box||0)+1, INTERVALS.length-1); r.due = startOfDay(now()) + INTERVALS[r.box]*DAY; }
  r.ts=now(); S.prog.fc[q.id]=r; saveProg();
}
function pruneLog(){ const keys=Object.keys(S.prog.log).sort(); while(keys.length>120){ delete S.prog.log[keys.shift()]; } }
// revisão espaçada = baralho da disciplina inteira (como no Anki); "ctx" restringe ao tema/prova escolhido
function discQs(){ const d=curDisc(); if(!d) return []; const st=set().std; return [...S.qs.values()].filter(q=>q.discipline===d.id && (st==="all"||q.standard===st)); }
function revPool(){ return set().revScope==="ctx" ? ctxQs() : discQs(); }
function dueQs(){ const end=startOfDay(now())+DAY; return revPool().filter(q=>{ const r=rec(q.id); return r && r.due!=null && r.due < end; }); }
// cards: revisões vencidas do baralho + cards novos (nunca vistos) só do tema atual
function dueCards(){ const end=startOfDay(now())+DAY; const seen=revPool().filter(q=>{ const r=S.prog.fc[q.id]; return r && r.due < end; }); const ids=new Set(seen.map(q=>q.id)); const fresh=ctxQs().filter(q=>!S.prog.fc[q.id] && !ids.has(q.id)); return seen.concat(fresh); }
function scopeChips(){ const sc=set().revScope==="ctx"?"ctx":"disc"; const t=curTopic(); const b=(v,l)=>`<button type="button" class="chip" data-act="revScope" data-val="${v}" aria-pressed="${sc===v}">${l}</button>`;
  return `<div class="chips">${b("disc",(set().lang==="en"?"Whole discipline":"Disciplina inteira"))}${b("ctx",(set().lang==="en"?"Only ":"Só ")+esc(nm(t)))}</div>`; }
function scopeLabel(){ return set().revScope==="ctx" ? nm(curTopic()) : nm(curDisc()); }
let saveTimer=null, saving=false, saveAgain=false;
function saveProg(){ cacheSave(); if(!S.db||!S.uid) return; clearTimeout(saveTimer); saveTimer=setTimeout(flushProg, 1200); }
async function flushProg(){
  if(saving){ saveAgain=true; return; } saving=true;
  try{ await S.db.doc("data/users/"+S.uid+"/state").set(JSON.parse(JSON.stringify(S.prog))); setSync("on"); }
  catch(e){ setSync("warn"); }
  finally{ saving=false; if(saveAgain){ saveAgain=false; flushProg(); } }
}

      <div class="toggle"><span>${tr("shuffleO")}</span><button type="button" class="switch" role="switch" data-sw="shuffleO" aria-checked="${su.shuffleO}" aria-label="${tr("shuffleO")}"></button></div>

   </div>`;
  $("#suSub").onchange=e=>{ su.sub=e.target.value; render(); };

function buildSession(kind, list, su){
  let qs = su.shuffleQ ? shuffle(list) : list.slice();
  if(su.count) qs = qs.slice(0, su.count);
  const items = qs.map(q=>({id:q.id, perm: (su.shuffleO && q.origin!=="real") ? shuffle([0,1,2,3,4].slice(0,(q.i18n.pt||q.i18n.en).opts.length)) : [...Array((q.i18n.pt||q.i18n.en).opts.length).keys()], pick:null}));
  return {kind, mode: kind==="review"?"study":su.mode, items, i:0, t0:now(), done:false, std:set().std, topic:curTopic()?.id};
}

let timerInt=null;
function vPlayer(v){
  const s=S.session; clearInterval(timerInt);
  if(!s.items.length){ v.innerHTML=`<p class="empty">${tr("sessionEmpty")}</p>`; return; }
  if(s.done) return vResult(v);
  const it=s.items[s.i]; const q=S.qs.get(it.id);
  if(!q){ s.items.splice(s.i,1); s.i=Math.min(s.i,s.items.length-1); return vPlayer(v); }
  const reveal = s.mode==="study" && it.pick!==null;
  if(it.t0==null && it.pick===null) it.t0=now();
  v.innerHTML = `
   <div class="qtop"><span class="qnum">${tr("q")} ${s.i+1} ${tr("of")} ${s.items.length}</span>
     <div class="progress"><i style="width:${100*(s.items.filter(x=>x.pick!==null).length)/s.items.length}%"></i></div>
     ${s.mode==="sim"?`<span class="timer" id="timer">${fmtTime((now()-s.t0)/1000)}</span>`:""}
     ${document.fullscreenEnabled?`<button class="btn small ghost fsbtn" data-act="fs" aria-label="Tela cheia">${document.fullscreenElement?"⤡":"⛶"}</button>`:""}<button class="btn small ghost fsbtn" data-act="exit" aria-label="${tr("exitSession")}" title="${tr("exitSession")}">✕</button></div>
   ${questionHTML(q, it, reveal, s.mode==="sim")}
   <div class="qnav">
     <button class="btn icon" data-act="prev" ${s.i===0?"disabled":""} aria-label="${tr("prev")}">←</button>
     ${s.i<s.items.length-1 ? `<button class="btn ${ (reveal || (s.mode==="sim"&&it.pick!==null)) ? "primary":""}" data-act="next">${tr("next")} →</button>`
       : (s.mode==="sim" ? `<button class="btn primary" data-act="finish">${tr("finish")}</button>` : `<button class="btn primary" data-act="finish">${tr("finish")}</button>`)}
   </div>`;
  if(s.mode==="sim"){ timerInt=setInterval(()=>{ const el=$("#timer"); if(el) el.textContent=fmtTime((now()-s.t0)/1000); else clearInterval(timerInt); },1000); }
  hydrateAI(q);
}
function questionHTML(q, it, reveal, simMode){
  const {c, lang, fallback} = content(q); if(!c) return "";
  const perm = it?.perm || c.opts.map((_,i)=>i);
  const pick = it?.pick ?? null;
  const tags = [];
  tags.push(`<span class="tag std ${q.standard==="usmle"?"usmle":""}">${q.standard.toUpperCase()}${q.step?" · "+esc(q.step):""}</span>`);
  if(q.exam) tags.push(`<span class="tag real">${esc(q.exam)}</span>`);
  if(q.origin==="generated") tags.push(`<span class="tag gen">IA${q.reviewed?"":" · "+tr("notReviewed")}</span>`);
  tagsOf(q).forEach(t=>tags.push(`<span class="tag">${esc(t)}</span>`));
  if(c.outdated) tags.push(`<span class="tag old">${set().lang==="en"?"Outdated":"Defasada"}</span>`);
  if(q.exc) tags.push(`<span class="tag exc">${set().lang==="en"?"Except / incorrect":"Exceto / incorreta"}</span>`);
  const hasMore = c.opts.some(o=>o.more) || !!c.pegMore;
  const det = hasMore && (S.detail.has(q.id) ? !set().detail : !!set().detail);
  const opts = perm.map((orig,pos)=>{
    const o=c.opts[orig]; let cls="opt", mark="";
    if(reveal){ if(orig===q.correct){cls+=" correct";mark=orig===pick?tr("answer")+" · ✓":tr("answer");} else if(orig===pick){cls+=" wrong";mark=tr("yourAns");} }
    else if(simMode && orig===pick){ cls+=" picked"; }
    const verdict = orig===q.correct ? tr("answer") : (q.exc ? tr("trueStmt") : tr("whyNot"));
    const why = reveal ? `<div class="why"><span class="v ${orig!==q.correct&&q.exc?"neutral":""}">${verdict}</span>${safe(det&&o.more?o.more:o.why)}</div>` : "";
    return `<button type="button" class="${cls}" data-pick="${orig}" ${reveal?"disabled":""}><div class="orow"><span class="letter">${L[pos]}</span><span class="otext">${safe(o.t)}</span>${mark?`<span class="mark">${mark}</span>`:""}</div>${why}</button>`;
  }).join("");
  const fb = (fallback && q.standard!=="usmle") ? `<div class="banner info"><div>${set().lang==="pt"?tr("onlyIn"):tr("onlyInEn")}</div>${S.sample?`<div class="row" style="margin-top:8px"><button class="btn small" data-act="translate" data-q="${esc(q.id)}">${tr("translate")}</button></div>`:""}<div id="tr-${esc(q.id)}"></div></div>` : "";
  const after = reveal ? `
    <div class="result ${pick===q.correct?"ok":"bad"}">${pick===q.correct?"✓ "+tr("right"):"✗ "+tr("wrongAns")+" "+L[perm.indexOf(q.correct)]}</div>
    ${hasMore?`<div class="row"><button class="btn small" data-act="detail" data-q="${esc(q.id)}" aria-pressed="${det}">${det?"− "+tr("less"):"+ "+tr("more")}</button></div>`:""}
    ${c.outdated?`<div class="banner old"><b>⚠ ${set().lang==="en"?"Outdated question":"Questão defasada"}:</b> ${safe(c.outdated)}</div>`:""}
    ${c.peg?`<div class="box peg"><h3>${tr("trap")}</h3>${safe(det&&c.pegMore?c.pegMore:c.peg)}</div>`:""}
    ${c.src?`<div class="box src"><h3>${tr("source")}</h3>${safe(c.src)}</div>`:""}
    ${S.sample?`<div class="row"><button class="btn" data-act="explain" data-q="${esc(q.id)}">✦ ${tr("explain")}</button></div><div id="ai-${esc(q.id)}"></div>`:""}` : "";
  const lsn=!simMode&&lessonOf(q.discipline,q.topic);
  return `<div class="tags">${tags.join("")}${lsn?`<button type="button" class="tag" data-act="lesson" data-id="${esc(lsn.id)}" style="cursor:pointer;background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 1px #99F6E4 inset">📖 ${T2("Lição","Lesson")}</button>`:""}</div>${fb}<p class="stem" lang="${lang==="en"?"en":"pt-BR"}">${safe(c.stem)}</p><div class="opts" lang="${lang==="en"?"en":"pt-BR"}">${opts}</div>${after}`;
}
function vResult(v){
  const s=S.session; const n=s.items.length; const ok=s.items.filter(it=>{ const q=S.qs.get(it.id); return q && it.pick===q.correct; }).length;
  const secs=s.secs ?? (now()-s.t0)/1000;
  v.innerHTML = `
   <div><div class="eyebrow">${tr("simDone")}</div><h1>${ok}/${n} · ${Math.round(100*ok/n)}%</h1><p class="lede">${tr("time")}: ${fmtTime(secs)} · ${fmtTime(secs/n)}/${set().lang==="en"?"question":"questão"}</p></div>

   <div class="panel"><h2>${tr("reviewList")}</h2><div class="list">${s.items.map((it,i)=>{ const q=S.qs.get(it.id); if(!q) return ""; const c=content(q).c; const good=it.pick===q.correct; return `
     <button type="button" class="li" data-act="reviewItem" data-i="${i}"><span class="t">${i+1}. ${safe(c.stem)}</span><span class="st ${it.pick===null?"no":good?"ok":"bad"}">${it.pick===null?"—":good?"✓":"✗"}</span>
     <span class="m">${tagsOf(q).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</span></button>`; }).join("")}</div></div>`;

/* ---------- STATS (banco inteiro) ---------- */
function examReadiness(onlyDisc){ const today=startOfDay(now()), end=today+DAY; const allQ=[...S.qs.values()].filter(stdOk); const exams=[];
  for(const d of discs()){ if(onlyDisc&&d.id!==onlyDisc) continue; const tps=d.topics||[]; for(const ex of (d.exams||[])){ const dt=examDate(ex); if(dt==null||dt<today) continue;
      const tids=new Set(tps.filter(t=>ex.all||t.exam===ex.id).map(t=>t.id)); const qs=allQ.filter(q=>q.discipline===d.id&&tids.has(q.topic)); if(!qs.length) continue;
      const seen=qs.filter(q=>rec(q.id)), ok=seen.filter(q=>rec(q.id).ok), due=qs.filter(q=>{const r=rec(q.id); return r&&r.due!=null&&r.due<end;}).length;
      const days=Math.max(1,Math.round((dt-today)/DAY)); const unseen=qs.length-seen.length;
      exams.push({d,ex,dt,days,n:qs.length,seen:seen.length,ok:ok.length,due,unseen,meta:Math.ceil(unseen/days)}); } }
  return exams.sort((a,b)=>a.dt-b.dt); }
function nextExamHTML(){ const d=curDisc(); if(!d) return ""; const x=examReadiness(d.id)[0]; if(!x) return "";

    <span class="tag ${x.days<=7?"old":""}">${x.days} ${T2(x.days===1?"dia":"dias",x.days===1?"day":"days")}</span></div>
    <div class="track" style="margin:12px 0 8px"><i class="ok" style="width:${100*x.ok/x.n}%"></i><i class="bad" style="width:${100*(x.seen-x.ok)/x.n}%"></i></div>
    <div class="row" style="justify-content:space-between;gap:8px"><span style="font-size:12.5px;color:var(--muted)">${T2("Vistas","Seen")} ${x.seen}/${x.n} · ${T2("acerto","accuracy")} <b>${pct(x.ok,x.seen)}</b>${x.unseen?` · ${T2("meta","goal")} <b>${x.meta}/${T2("dia","day")}</b>`:""}</span>
    <button class="btn small" data-act="examStudy" data-ex="${esc(x.ex.id)}">${T2("Estudar","Study")} ${esc(x.ex.all?T2("tudo","all"):x.ex.id)}</button></div></div>`; }

const T2=(pt,en)=>set().lang==="en"?en:pt;
// cor-marcador por disciplina: d.color no catálogo, senão posição dentro do período (as cores se repetem entre períodos)
const DCOL=["#7C3AED","#0284C7","#EA580C","#C026D3","#2563EB","#DB2777","#65A30D","#A16207","#0891B2","#57534E","#9A3412","#1E3A8A","#86198F","#4D7C0F","#475569"];
function discColor(d){ if(!d) return "var(--subtle)"; if(d.color) return d.color; const same=discs().filter(x=>(x.period??null)===(d.period??null)); const i=Math.max(0,same.findIndex(x=>x.id===d.id)); return DCOL[i%DCOL.length]; }
const ddot=d=>`<i class="ddot" style="background:${discColor(d)}" aria-hidden="true"></i>`;
const MES={jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
function examDate(ex){ if(ex.date) return startOfDay(new Date(ex.date+"T12:00:00").getTime()); const m=(ex.name?.pt||"").match(/(\d{1,2})(?:[–-]\d{1,2})?\/(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)/i); if(!m) return null;
  const y=new Date(now()).getFullYear(); return startOfDay(new Date(y, MES[m[2].toLowerCase()], Number(m[1]), 12).getTime()); }
function stdOk(q){ const st=set().std; return st==="all"||q.standard===st; }
function pct(a,b){ return b?Math.round(100*a/b)+"%":"—"; }
function leechList(){ return [...S.qs.values()].filter(q=>stdOk(q)&&rec(q.id)&&(rec(q.id).n-rec(q.id).nOk)>=2).sort((a,b)=>((rec(b.id).n-rec(b.id).nOk)-(rec(a.id).n-rec(a.id).nOk))||((rec(a.id).ok?1:0)-(rec(b.id).ok?1:0))); }
function vStats(v){
  const tab=["geral","provas","cobrados"].includes(S.statsTab)?S.statsTab:"geral";
  const today=startOfDay(now()), end=today+DAY; const ds=discs(); const allQ=[...S.qs.values()].filter(stdOk);
  const recs=allQ.map(q=>[q,rec(q.id)]).filter(x=>x[1]);
  const okN=recs.filter(x=>x[1].ok).length;
  let streak=0; for(let i=0;i<400;i++){ const k=dayKey(new Date(today-i*DAY)); if(S.prog.log[k]?.n) streak++; else if(i>0) break; }
  // 1) prontidão por prova
  const exams=examReadiness();
  // 2) temas fracos (último resultado de cada questão)
  const weak=[]; for(const d of ds) for(const t of (d.topics||[])){ const r=recs.filter(([q])=>q.discipline===d.id&&q.topic===t.id); if(r.length<5) continue; const o=r.filter(x=>x[1].ok).length; weak.push({d,t,n:r.length,o,acc:o/r.length}); }
  weak.sort((a,b)=>a.acc-b.acc);
  // 3) retenção: 1ª tentativa × revisões (últimos 30 dias) e tempo médio
  const fr=recs.filter(x=>x[1].first!=null||x[1].n===1).map(x=>x[1].first!=null?x[1].first:x[1].ok); const frOk=fr.filter(Boolean).length;
  const since=Math.round((now()-30*DAY)/1000); const ev=(S.prog.ev||[]).filter(e=>e[0]>=since && S.qs.has(e[1]) && stdOk(S.qs.get(e[1])));
  const rv=ev.filter(e=>e[3]===1), rvOk=rv.filter(e=>e[2]===1).length; const tm=ev.filter(e=>e[4]>=0); const secs=tm.length?Math.round(tm.reduce((a,e)=>a+e[4],0)/tm.length):null;
  // 4) sanguessugas

  // 5) carga futura
  const load=[...Array(30)].map((_,i)=>{ const a=today+(i+1)*DAY; const by={}; recs.forEach(([q,r])=>{ if(r.due>=a&&r.due<a+DAY) by[q.discipline]=(by[q.discipline]||0)+1; }); return {i,by,n:Object.values(by).reduce((x,y)=>x+y,0)}; });
  const lmax=Math.max(1,...load.map(l=>l.n)); const week=ds.map(d=>({d,n:load.slice(0,7).reduce((a,l)=>a+(l.by[d.id]||0),0)})).filter(x=>x.n);
  const dueNow=recs.filter(([q,r])=>r.due!=null&&r.due<end).length;
  const tname=(d,id)=>nm((d.topics||[]).find(t=>t.id===id))||id;
  const fmtS=s=>s==null?"—":(s>=60?Math.floor(s/60)+"m"+String(s%60).padStart(2,"0"):s+"s");
  v.innerHTML = `
   <div class="seg" role="group" style="align-self:flex-start">${[["geral",T2("Desempenho","Performance")],["provas",T2("Provas","Exams")],["cobrados",T2("Mais cobrados","Most tested")]].map(([k,l])=>`<button type="button" data-act="statsTab" data-val="${k}" aria-pressed="${tab===k}">${l}</button>`).join("")}</div>
   <div><div class="eyebrow">${T2("Banco inteiro","Whole bank")} · ${tr("std_"+set().std)}</div><h1>${T2("Seus números","Your stats")}</h1></div>
   ${tab==="geral"?`
   <div class="kpis">
     <div class="kpi"><div class="v">${recs.length}<small>/${allQ.length}</small></div><div class="l">${tr("answered")}</div></div>
     <div class="kpi"><div class="v">${pct(okN,recs.length)}</div><div class="l">${tr("accuracy")}</div></div>
     <div class="kpi"><div class="v">${streak}</div><div class="l">${T2("dias seguidos","day streak")}</div></div>
   </div>
   ${radarHTML()}
   <div class="panel"><h2>${T2("Temas mais fracos","Weakest topics")}</h2><p class="lede" style="margin:-4px 0 10px;font-size:12.5px">${T2("Último resultado de cada questão; temas com 5 ou mais respondidas.","Latest result per question; topics with at least 5 answered.")}</p>
     <div class="bars">${weak.slice(0,6).map(x=>`<div class="bar-row"><span class="n">${esc(nm(x.t))}<small style="color:var(--subtle)"> · ${ddot(x.d)}${esc(nm(x.d))}</small></span><span class="p">${x.o}/${x.n}&ensp;<b>${Math.round(100*x.acc)}%</b></span>
       <div class="track"><i class="ok" style="width:${100*x.acc}%"></i><i class="bad" style="width:${100*(1-x.acc)}%"></i></div></div>`).join("")||`<p class="empty">${T2("Responda ao menos 5 questões de um tema.","Answer at least 5 questions in a topic.")}</p>`}</div></div>
   <div class="panel"><h2>${T2("Retenção","Retention")}</h2>

     <div class="spark" style="height:70px">${load.map(l=>`<div title="+${l.i+1}${tr("days")}: ${l.n}"><i style="height:${100*l.n/lmax}%;background:var(--accent)"></i></div>`).join("")}</div>

   <div class="panel"><h2>${T2("Prontidão para as provas","Exam readiness")}</h2>

       <div class="track" style="margin:10px 0 8px" role="img" aria-label="${x.seen}/${x.n}"><i class="ok" style="width:${100*x.ok/x.n}%"></i><i class="bad" style="width:${100*(x.seen-x.ok)/x.n}%"></i></div>
       <div style="font-size:12.5px;color:var(--muted);line-height:1.5">${T2("Vistas","Seen")} ${x.seen}/${x.n} · ${T2("acerto","accuracy")} <b>${pct(x.ok,x.seen)}</b>${x.due?` · ${x.due} ${T2("para revisar","due")}`:""}<br>

`:""}${tab==="cobrados"?`

/* ---------- PROVAS NA ÍNTEGRA + INCIDÊNCIA ---------- */
// "P2 20.2 · Q33 · 22.2 · Q14" → [{ex:"P2 20.2",n:33},{ex:"P2 22.2",n:14}]
function examPairs(label){ const out=[]; let cur=null, pre="";
  for(const tok of String(label||"").split(" · ").map(x=>x.trim())){ const m=tok.match(/^Q(\d+)$/i); if(m){ if(cur) out.push({ex:cur,n:Number(m[1])}); continue; }
    if(/^\d{2,4}(\.\d)?$/.test(tok)) cur=(pre?pre+" ":"")+tok; else { cur=tok; const p=tok.match(/^(.*?)\s*\d{2,4}(\.\d)?$/); pre=p?p[1]:""; } }
  return out; }
function fullExams(dId){ const map=new Map();
  for(const q of S.qs.values()){ if(q.discipline!==dId||!q.exam) continue; for(const {ex,n} of examPairs(q.exam)){ if(!map.has(ex)) map.set(ex,[]); map.get(ex).push({q,n}); } }
  const yr=ex=>{ const m=ex.match(/(\d{2,4})(?:\.(\d))?$/); if(!m) return 0; let y=Number(m[1]); if(y<100) y+=2000; return y*10+Number(m[2]||0); };
  return [...map.entries()].map(([ex,list])=>({ex, list:list.sort((a,b)=>a.n-b.n)})).sort((a,b)=>a.ex.split(" ")[0].localeCompare(b.ex.split(" ")[0]) || yr(b.ex)-yr(a.ex)); }
function fullExamsHTML(){ const d=curDisc(); if(!d||set().std==="usmle") return ""; const L=fullExams(d.id); if(!L.length) return "";
  const last=ex=>(S.prog.sims||[]).filter(s=>s.exam===ex).slice(-1)[0];
  const grp=x=>(x.ex.match(/^(P\d|FINAL|Final)/i)||[T2("Outras","Other")])[0].toUpperCase();
  const groups=[...new Set(L.map(grp))];
  return `<p class="lede" style="margin:0;font-size:13px">${T2("Questões reais na ordem original. Questões com figura ou anuladas ficaram de fora.","Real questions in the original order. Figure-based or voided items were left out.")}</p>
   ${groups.map(g=>`<div class="panel"><h2>${esc(g)}</h2><div class="list">${L.filter(x=>grp(x)===g).map(x=>{ const l=last(x.ex); return `<div class="li" style="cursor:default;align-items:center"><span class="t" style="font-family:var(--f-ui)"><b>${esc(x.ex)}</b><br><small style="color:var(--subtle)">${x.list.length} ${T2("questões","questions")}${l?` · ${T2("última","last")}: ${l.ok}/${l.n}`:""}</small></span>
     <span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn small" data-act="fullExam" data-ex="${esc(x.ex)}" data-mode="study">${T2("Comentada","Tutor")}</button><button class="btn small primary" data-act="fullExam" data-ex="${esc(x.ex)}" data-mode="sim">${T2("Simulado","Timed")}</button></span></div>`; }).join("")}</div></div>`).join("")}`; }
function startFullExam(ex, mode){ const d=curDisc(); const x=fullExams(d.id).find(e=>e.ex===ex); if(!x) return;
  const qs=x.list.map(i=>i.q); const su=Object.assign(defaultSetup(),{mode, count:0, shuffleQ:false, shuffleO:false}); S.setup=su;
  S.session=buildSession("study", qs, su); S.session.exam=ex; go("study"); }
// incidência: cada aparição em prova (questão repetida em anos diferentes conta de novo)
function incidence(dId, exId){ const d=discs().find(x=>x.id===dId); if(!d) return {rows:[],total:0}; const by={}; let total=0;
  const okT=new Set((d.topics||[]).filter(t=>!exId||t.exam===exId).map(t=>t.id));
  for(const q of S.qs.values()){ if(q.discipline!==dId||!q.exam||!okT.has(q.topic)) continue; const k=examPairs(q.exam).length||1; by[q.topic]=(by[q.topic]||0)+k; total+=k; }
  const rows=(d.topics||[]).filter(t=>by[t.id]).map(t=>{ const r=[...S.qs.values()].filter(q=>q.discipline===dId&&q.topic===t.id&&rec(q.id)); const o=r.filter(q=>rec(q.id).ok).length; return {t,n:by[t.id],seen:r.length,o}; }).sort((a,b)=>b.n-a.n);
  return {rows,total,d}; }
function incidenceHTML(){ const ds=discs().filter(d=>[...S.qs.values()].some(q=>q.discipline===d.id&&q.exam)); if(!ds.length) return "";
  const cur=ds.find(d=>d.id===S.incDisc)||ds.find(d=>d.id===curDisc()?.id)||ds[0];
  const exs=(cur.exams||[]).filter(e=>!e.all&&(cur.topics||[]).some(t=>t.exam===e.id&&[...S.qs.values()].some(q=>q.discipline===cur.id&&q.topic===t.id&&q.exam)));
  const exSel=exs.find(e=>e.id===S.incExam)?S.incExam:"";
  const {rows,total}=incidence(cur.id, exSel); const mx=Math.max(1,...rows.map(r=>r.n));
  return `<div class="panel"><h2>${T2("Mais cobrados nas provas da UFPR","Most tested in UFPR exams")}</h2>
   <div class="chips" style="margin:2px 0 8px">${ds.map(d=>`<button type="button" class="chip" data-act="incDisc" data-val="${esc(d.id)}" aria-pressed="${d.id===cur.id}">${ddot(d)}${esc(nm(d))}</button>`).join("")}</div>
   ${exs.length>1?`<div class="seg" role="group" style="margin:0 0 12px">${[["",T2("Todas","All")],...exs.map(e=>[e.id,e.id])].map(([id,l])=>`<button type="button" data-act="incExam" data-val="${esc(id)}" aria-pressed="${exSel===id}">${esc(l)}</button>`).join("")}</div>`:""}
   <div class="bars">${rows.map(r=>{ const ex=(cur.exams||[]).find(e=>e.id===r.t.exam); return `<button type="button" class="bar-row" data-act="incTopic" data-d="${esc(cur.id)}" data-t="${esc(r.t.id)}" style="all:unset;display:block;cursor:pointer;width:100%">
     <span class="row" style="justify-content:space-between;gap:8px;flex-wrap:nowrap"><span class="n">${esc(nm(r.t))}${ex?`<small style="color:var(--subtle)"> · ${esc(r.t.exam)}</small>`:""}</span><span class="p">${r.n}&ensp;<b>${Math.round(100*r.n/total)}%</b></span></span>
     <div class="track" style="margin-top:6px"><i style="width:${100*r.n/mx}%;background:var(--accent)"></i></div>
     <small style="color:var(--subtle);font-size:11.5px">${r.seen?`${T2("seu acerto","your accuracy")}: ${Math.round(100*r.o/r.seen)}% (${r.seen})`:T2("ainda não estudado","not studied yet")}</small></button>`; }).join("")}</div>
   <p class="lede" style="margin:10px 0 0;font-size:12.5px">${T2(`${total} aparições em provas antigas${exSel?` (temas da ${exSel})`:""}. Toque num tema para estudá-lo.`,`${total} appearances in past exams${exSel?` (${exSel} topics)`:""}. Tap a topic to study it.`)}</p></div>`; }
/* ---------- RADAR por disciplina (eixos = temas) ---------- */
function radarHTML(){ const ds=discs().filter(d=>[...S.qs.values()].some(q=>q.discipline===d.id&&stdOk(q))); if(!ds.length) return "";
  const cur=ds.find(d=>d.id===S.incDisc)||ds.find(d=>d.id===curDisc()?.id)||ds[0];
  const tps=(cur.topics||[]).map(t=>{ const qs=[...S.qs.values()].filter(q=>q.discipline===cur.id&&q.topic===t.id&&stdOk(q)); const seen=qs.filter(q=>rec(q.id)); const ok=seen.filter(q=>rec(q.id).ok).length;
    return {t,n:qs.length,seen:seen.length,ok,acc:seen.length?ok/seen.length:0,cov:qs.length?seen.length/qs.length:0}; }).filter(x=>x.n);
  if(tps.length<3) return "";
  const W=320,C=W/2,R=118,N=tps.length; const ang=i=>-Math.PI/2+2*Math.PI*i/N; const pt=(i,v)=>[C+R*v*Math.cos(ang(i)),C+R*v*Math.sin(ang(i))];
  const poly=f=>tps.map((x,i)=>pt(i,f(x)).map(n=>n.toFixed(1)).join(",")).join(" ");
  const ring=v=>`<polygon points="${tps.map((_,i)=>pt(i,v).map(n=>n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  const axes=tps.map((x,i)=>{ const [a,b]=pt(i,1), [lx,ly]=pt(i,1.13); const weak=x.seen<5;
    return `<line x1="${C}" y1="${C}" x2="${a.toFixed(1)}" y2="${b.toFixed(1)}" stroke="var(--line)" ${weak?'stroke-dasharray="3 3"':""}/><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="${weak?"var(--subtle)":"var(--ink-2)"}">${i+1}</text>`; }).join("");
  const dots=tps.map((x,i)=>{ if(!x.seen) return ""; const [a,b]=pt(i,x.acc); return `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="3.5" fill="${x.seen>=5?discColor(cur):"var(--surface)"}" stroke="${discColor(cur)}" stroke-width="1.5"/>`; }).join("");
  const ref=`<polygon points="${tps.map((_,i)=>pt(i,.7).map(n=>n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--warn)" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>`;
  const svg=`<svg viewBox="0 0 ${W} ${W}" width="100%" style="max-width:360px;display:block;margin:0 auto" role="img" aria-label="${T2("Radar de acerto e cobertura por tema","Accuracy and coverage radar by topic")}">
    ${[.25,.5,.75,1].map(ring).join("")}${axes}
    <polygon points="${poly(x=>x.cov)}" fill="var(--accent)" fill-opacity=".10" stroke="none"/>${ref}
    <polygon points="${poly(x=>x.seen?x.acc:0)}" fill="${discColor(cur)}" fill-opacity=".16" stroke="${discColor(cur)}" stroke-width="2" stroke-linejoin="round"/>${dots}</svg>`;
  const leg=tps.map((x,i)=>`<button type="button" data-act="incTopic" data-d="${esc(cur.id)}" data-t="${esc(x.t.id)}" style="all:unset;cursor:pointer;display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px">
     <b style="min-width:18px;color:${x.seen<5?"var(--subtle)":"var(--ink)"}">${i+1}</b><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)">${esc(nm(x.t))}</span>
     <span class="mono" style="color:var(--muted)">${x.seen?`<b style="color:${x.seen<5?"var(--subtle)":x.acc>=.7?"var(--ok)":"var(--bad)"}">${Math.round(100*x.acc)}%</b>`:"—"} · ${Math.round(100*x.cov)}%</span></button>`).join("");
  return `<div class="panel"><h2>${T2("Mapa da disciplina","Discipline map")}</h2>
   <div class="chips" style="margin:2px 0 8px">${ds.map(d=>`<button type="button" class="chip" data-act="incDisc" data-val="${esc(d.id)}" aria-pressed="${d.id===cur.id}">${ddot(d)}${esc(nm(d))}</button>`).join("")}</div>
   ${svg}
   <div style="display:flex;justify-content:center;gap:16px;margin:4px 0 10px;font-size:11.5px;color:var(--muted);align-items:center">
     <span style="display:inline-flex;gap:6px;align-items:center"><i style="width:14px;height:3px;border-radius:2px;background:${discColor(cur)}"></i>${T2("acerto","accuracy")}</span>
     <span style="display:inline-flex;gap:6px;align-items:center"><i style="width:12px;height:12px;border-radius:3px;background:var(--accent);opacity:.18"></i>${T2("cobertura","coverage")}</span>
     <span style="display:inline-flex;gap:6px;align-items:center"><i style="width:14px;border-top:1.5px dashed var(--warn)"></i>70%</span></div>
   <div style="display:grid;grid-template-columns:1fr;column-gap:20px" class="radar-leg">${leg}</div>
   <p class="lede" style="margin:8px 0 0;font-size:12px">${T2("Acerto · cobertura. Eixo tracejado = menos de 5 respondidas (pouco confiável). Toque num tema para estudá-lo.","Accuracy · coverage. Dashed axis = fewer than 5 answered. Tap a topic to study it.")}</p></div>`; }

async function explain(id, btn){
  const q=S.qs.get(id); if(!q||!S.sample) return; const {c}=content(q); const lang=set().lang;
  const el=document.getElementById("ai-"+id); const ctl=new AbortController();
  btn.disabled=true; el.innerHTML=`<div class="box ai"><h3>${tr("aiTitle")}</h3><div class="md" id="aiT-${id}">${tr("explaining")}</div><div class="row" style="margin-top:8px"><button class="btn small" id="aiStop-${id}">${tr("stop")}</button></div></div>`;
  document.getElementById("aiStop-"+id).onclick=()=>ctl.abort();
  const it=S.session?.items?.find(x=>x.id===id); const pick=it?.pick ?? null;
  const plain=s=>String(s).replace(/<[^>]+>/g,"");
  const prompt = (lang==="en"
   ? "You are a tutor for a Brazilian medical student (also a federal highway police officer with little time) preparing for UFPR exams and USMLE Step 1/2 CK. Be direct, technical, dense, no greetings. Use US guidelines (AHA, ADA, IDSA etc.) when relevant. Reply in ENGLISH using exactly these sections as short bullet lists:\n**Flashcard** (Anki-style question + 1-3 line answer)\n**Don't confuse with** (the commonly confused drug/condition and the key difference)\n**Best next step** (diagnostic/therapeutic, guideline-based)\n**Source** (ONE reference: First Aid, Pathoma, Harrison, Robbins, Costanzo, UWorld/Amboss or Katzung)\n**Recall** (one question answerable in 1 line)\nIf Brazilian and USMLE nomenclature or guidelines differ, flag it in one line.\n\n"
   : "Você é tutor de um estudante de Medicina da UFPR (também policial rodoviário federal, com pouco tempo) que estuda para a prova da UFPR e para o USMLE Step 1/2 CK. Seja direto, técnico, denso, sem saudações. Use guidelines americanos (AHA, ADA, IDSA etc.) quando pertinente. Responda em PORTUGUÊS usando exatamente estas seções, em tópicos curtos:\n**Flashcard** (pergunta estilo Anki + resposta em 1-3 linhas)\n**Não confundir com** (fármaco/condição confundida e a diferença-chave)\n**Best Next Step** (diagnóstico/terapêutico, baseado em guideline)\n**Fonte** (UMA referência: First Aid, Pathoma, Harrison, Robbins, Costanzo, UWorld/Amboss ou Katzung)\n**Recall** (uma pergunta respondível em 1 linha)\nSe nomenclatura ou guideline do Brasil e do USMLE divergirem, sinalize em uma linha.\n\n")
   + "QUESTION:\n" + plain(c.stem) + "\n\nOPTIONS:\n" + c.opts.map((o,i)=>`${"ABCDE"[i]}) ${plain(o.t)}${i===q.correct?"  [CORRECT]":""}`).join("\n")
   + (pick!==null && pick!==q.correct ? `\n\nThe student chose ${"ABCDE"[pick]} (wrong). Address that misconception first.` : "")
   + "\n\nEXISTING EXPLANATION (do not repeat it, go deeper):\n" + plain(c.opts[q.correct].why);
  try{
    const r=await S.sample(prompt,{signal:ctl.signal,onText:({text})=>{ const t=document.getElementById("aiT-"+id); if(t) t.innerHTML=md(text); }});
    S.ai[id]={html:md(r.text)}; hydrateAI(q);
  }catch(e){ const t=document.getElementById("aiT-"+id); if(e.code==="cancelled"){ if(e.text){ S.ai[id]={html:md(e.text)}; hydrateAI(q);} else el.innerHTML=""; } else if(t){ t.innerHTML=(e.text?md(e.text):"")+`<p style="color:var(--bad)">${aiErr(e)}</p>`; } }
  finally{ btn.disabled=false; const s=document.getElementById("aiStop-"+id); if(s) s.remove(); }
}
async function translateQ(id, btn){
  const q=S.qs.get(id); if(!q||!S.sample) return; const target=set().lang; const srcLang=target==="pt"?"en":"pt"; const c=q.i18n[srcLang];
  const box=document.getElementById("tr-"+id); btn.disabled=true; box.innerHTML=`<p class="mono" style="font-size:12px;margin:8px 0 0">${tr("explaining")}</p>`;
  const prompt=`Translate this medical exam question object from ${srcLang==="en"?"English":"Brazilian Portuguese"} to ${target==="en"?"English (US medical terminology, USMLE style)":"Brazilian Portuguese (terminologia médica brasileira)"}. Keep the same JSON shape and keys, keep the order of "opts", keep any <b> tags, translate every string value. Reply with only the JSON object, plus a "tags" array translating these tags: ${JSON.stringify(q.tags?.[srcLang]||[])}.\n\n`+JSON.stringify(c);
  try{
    const out=await S.sample.json(prompt,{modelTier:"default"});

    const tags=Array.isArray(out.tags)?out.tags.map(String).slice(0,6):null; delete out.tags;
    q.i18n[target]=out; if(tags){ q.tags=Object.assign({},q.tags,{[target]:tags}); }
    if(S.owner&&S.db){ try{ await S.db.doc("questions/"+id).update({i18n:{[target]:out}, ...(tags?{tags:{[target]:tags}}:{})}); toast(tr("trSaved")); }catch(e){ toast(tr("aiErr")); } }
    cacheSave(); render(); if($("#layer").innerHTML) bankPreview(id);
  }catch(e){ box.innerHTML=`<p style="color:var(--bad);margin:8px 0 0">${aiErr(e)}</p>`; btn.disabled=false; }
}

  if(act==="newSession"){ S.session=null; return go("study"); }
  if(act==="reviewItem"){ const s=S.session; const i=Number(a.dataset.i); s.mode="study"; s.done=false; s.i=i; s.reviewing=true; return render(); }
  if(act==="detail"){ const id=a.dataset.q; if(S.detail.has(id)) S.detail.delete(id); else S.detail.add(id); const y=window.scrollY; if($("#layer").innerHTML){ bankPreview(id); } else { render(); } window.scrollTo({top:y}); return; }
  if(act==="toggleDetail"){ set().detail=!set().detail; S.detail.clear(); saveProg(); render(); return openSettings(); }
  if(act==="explain") return explain(a.dataset.q, a);
  if(act==="translate") return translateQ(a.dataset.q, a);
  if(act==="fcStart"){ const all=a.dataset.all==="1"; const ids=shuffle((all?ctxQs():dueCards()).map(q=>q.id)); S.fcDeck={ids,i:0,show:false,topic:curTopic()?.id,std:set().std}; return render(); }
  if(act==="fcShow"){ S.fcDeck.show=true; return render(); }
  if(act==="fcRate"){ const d=S.fcDeck; const q=S.qs.get(d.ids[d.i]); rateCard(q,Number(a.dataset.g)); d.i++; d.show=false; render(); window.scrollTo({top:0}); return; }
  if(act==="fcReset"){ S.fcDeck=null; return render(); }
  if(act==="bankOpen") return bankPreview(a.dataset.q);
  if(act==="genOpen") return openGen();
  if(act==="genRun") return genRun();
  if(act==="genSave") return genSave();
  if(act==="genDiscard"){ S.gen.items=null; return openGen(); }
  if(act==="importOpen") return openImport();
  if(act==="importRun") return importRun();
  if(act==="export") return exportJSON();
  if(act==="markRev"){ const id=a.dataset.q; try{ await S.db.doc("questions/"+id).update({reviewed:true}); toast(tr("reviewed")); closeSheet(); }catch(err){ toast(tr("aiErr")); } return; }
  if(act==="delQ"){ const id=a.dataset.q; return arm(a, tr("confirmDel"), async ()=>{ try{ await S.db.doc("questions/"+id).delete(); S.qs.delete(id); toast(tr("deleted")); closeSheet(); cacheSave(); render(); }catch(err){ toast(tr("aiErr")); } }); }
  if(act==="resetProg"){ return arm(a, tr("confirmReset"), ()=>{ S.prog=mergeProg(S.prog,{settings:S.prog.settings}); S.session=null; S.fcDeck=null; saveProg(); closeSheet(); toast(tr("resetDone")); render(); }); }
});
document.addEventListener("keydown", e=>{
  if(e.target.closest("input,textarea,select")) return;
  if(e.key==="Escape" && $("#layer").innerHTML){ closeSheet(); return; }
  const s=S.session; if(!s||s.done||!(S.view==="study"||S.view==="review")) return;
  const k=e.key.toLowerCase(); const idx="abcde".indexOf(k)>=0?"abcde".indexOf(k):"12345".indexOf(k);
  if(idx>=0){ const b=document.querySelectorAll(".opts .opt")[idx]; if(b&&!b.disabled){ b.click(); e.preventDefault(); } return; }
  if(k==="arrowright"||(k==="enter"&&!e.target.closest("button"))){ const n=document.querySelector('[data-act="next"]'); if(n){ n.click(); e.preventDefault(); } }
  if(k==="arrowleft"){ const p=document.querySelector('[data-act="prev"]'); if(p&&!p.disabled){ p.click(); e.preventDefault(); } }
});

/* ---------- data wiring (Supabase) ---------- */
const CFG = window.GABARITO_CONFIG || {};
let SB = null;
function sbReady(){ return !!(SB && S.uid); }
function rowToQ(r){ return Object.assign({id:r.id}, r.data); }
function qToRow(q){ const {id, ...data}=q; return {id, discipline:data.discipline, topic:data.topic, data, updated_at:new Date().toISOString()}; }
// adapter with the subset of the artifact db API the UI uses
const DBA = {
  doc(path){
    const [col,id] = path.startsWith("data/users/") ? ["progress", null] : path.split("/");
    return {
      async set(obj){
        if(col==="progress"){ const {error}=await SB.from("progress").upsert({user_id:S.uid, state:obj, updated_at:new Date().toISOString()}); if(error) throw error; return; }
        if(col==="questions"){ const {error}=await SB.from("questions").upsert(qToRow(Object.assign({id},obj))); if(error) throw error; return; }
        if(col==="catalog"){ const {error}=await SB.from("catalog").upsert({id, data:obj, updated_at:new Date().toISOString()}); if(error) throw error; return; }
      },
      async update(patch){
        if(col!=="questions") throw new Error("unsupported");
        const cur=S.qs.get(id); if(!cur) throw new Error("missing");
        const merged=deepMerge(JSON.parse(JSON.stringify(cur)), patch);
        const {error}=await SB.from("questions").upsert(qToRow(merged)); if(error) throw error; S.qs.set(id, merged);
      },
      async delete(){ const {error}=await SB.from(col).delete().eq("id",id); if(error) throw error; }
    };
  }
};
function deepMerge(a,b){ for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }

async function fetchAll(){
  setSync("loading");
  try{
    const c=await SB.from("catalog").select("id,data").eq("id","main").maybeSingle();
    if(c.error) throw c.error;
    if(c.data) S.catalog=c.data.data;
    const qs=new Map(), ls=new Map(); let from=0;
    for(;;){ const r=await SB.from("questions").select("id,data").order("id").range(from, from+999); if(r.error) throw r.error; r.data.forEach(x=>{ const o=rowToQ(x); if(o.kind==="lesson") ls.set(o.id,o); else qs.set(o.id,o); }); if(r.data.length<1000) break; from+=1000; }
    S.qs=qs; S.lessons=ls;
    const p=await SB.from("progress").select("state,updated_at").eq("user_id",S.uid).maybeSingle();
    if(p.error) throw p.error;
    if(p.data?.state){ const remote=p.data.state; const lt=Math.max(0,...Object.values(S.prog.q).map(r=>r.ts||0)); const rt=Math.max(0,...Object.values(remote.q||{}).map(r=>r.ts||0));
      if(rt>=lt) S.prog=mergeProg(S.prog,remote); else saveProg(); }
    else if(Object.keys(S.prog.q).length) saveProg();
    applyTheme(); setSync("on"); cacheSave();
  }catch(e){ console.error(e); setSync("off"); }
  if(!(S.session && (S.view==="study"||S.view==="review"))) render(); else renderTabs();
}

/* login */
function vLogin(msg){
  $("#ctx").innerHTML=""; $("#tabs").innerHTML="";
  $("#view").innerHTML = `
   <div style="padding-top:6vh"><div class="eyebrow">${set().lang==="en"?"Medical study":"Estudo médico"}</div><h1 style="font-size:40px">Gabarito<span style="color:var(--accent)">.</span></h1>
   <p class="lede">${set().lang==="en"?"Sign in to sync your progress across devices.":"Entre para sincronizar seu progresso entre aparelhos."}</p></div>
   <form class="panel" id="loginForm" style="display:flex;flex-direction:column;gap:12px">
     <div class="field"><label for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="email" required></div>
     <div class="field"><label for="lgPass">${set().lang==="en"?"Password":"Senha"}</label><input id="lgPass" type="password" autocomplete="current-password" minlength="6" required></div>
     ${msg?`<div class="banner">${esc(msg)}</div>`:""}
     <button class="btn primary" type="submit" id="lgIn">${set().lang==="en"?"Sign in":"Entrar"}</button>
     <button class="btn" type="button" id="lgUp">${set().lang==="en"?"Create account (first time)":"Criar conta (primeiro acesso)"}</button>
     ${S.qs.size?`<button class="btn ghost" type="button" id="lgOff">${set().lang==="en"?"Continue offline with saved copy":"Continuar offline com a cópia salva"}</button>`:""}
   </form>`;
  const f=$("#loginForm"), em=$("#lgEmail"), pw=$("#lgPass");
  f.onsubmit=async e=>{ e.preventDefault(); $("#lgIn").disabled=true; const {error}=await SB.auth.signInWithPassword({email:em.value.trim(), password:pw.value}); const b=$("#lgIn"); if(b) b.disabled=false; if(error) return vLogin(error.message); };
  $("#lgUp").onclick=async ()=>{ if(!f.reportValidity()) return; const {data,error}=await SB.auth.signUp({email:em.value.trim(), password:pw.value, options:{emailRedirectTo:location.origin+location.pathname}}); if(error) return vLogin(error.message); if(!data.session) vLogin(set().lang==="en"?"Check your e-mail to confirm the account, then sign in.":"Confira seu e-mail para confirmar a conta e depois entre."); };
  const off=$("#lgOff"); if(off) off.onclick=()=>{ S.offlineMode=true; setSync("off"); render(); };
}
async function signOut(){ try{ await SB.auth.signOut(); }catch(e){} S.uid=null; S.owner=false; closeSheet(); vLogin(); }

/* import / export packs */
function openImport(){
  openSheet(`<div class="row" style="justify-content:space-between"><h2>${tr("importJ")}</h2><button class="btn small ghost" data-act="closeSheet">✕</button></div>
   <p class="lede">${set().lang==="en"?"Choose a .json content pack sent by Claude, or paste its content.":"Escolha o pacote .json enviado pelo Claude, ou cole o conteúdo."}</p>
   <div class="field"><label for="impFile">${set().lang==="en"?"File":"Arquivo"}</label><input id="impFile" type="file" accept="application/json,.json"></div>
   <div class="field"><label for="impTxt">JSON</label><textarea id="impTxt" placeholder="${tr("importPh")}"></textarea></div>
   <button class="btn primary" data-act="importRun" id="impBtn">${tr("importDo")}</button>`, ()=>{
     $("#impFile").onchange=async e=>{ const f=e.target.files[0]; if(f) $("#impTxt").value=await f.text(); };
   });
}
async function importRun(){
  let pack; try{ pack=JSON.parse($("#impTxt").value); }catch(e){ toast("JSON inválido / invalid JSON"); return; }
  const qs = Array.isArray(pack) ? pack : (pack.questions||[]);
  const btn=$("#impBtn"); btn.disabled=true;
  try{
    if(pack.catalog){ const merged=mergeCatalog(S.catalog||{disciplines:[]}, pack.catalog); const {error}=await SB.from("catalog").upsert({id:"main", data:merged, updated_at:new Date().toISOString()}); if(error) throw error; S.catalog=merged; }
    const rows=qs.filter(q=>q&&q.id&&q.i18n&&q.discipline&&q.topic).map(qToRow);
    for(let i=0;i<rows.length;i+=200){ const {error}=await SB.from("questions").upsert(rows.slice(i,i+200)); if(error) throw error; }
    toast(`${tr("imported")}: ${rows.length}`); closeSheet(); await fetchAll();
  }catch(e){ toast((e&&e.message)||tr("aiErr")); btn.disabled=false; }
}
function mergeCatalog(a,b){
  const out=JSON.parse(JSON.stringify(a)); out.disciplines=out.disciplines||[];
  for(const d of (b.disciplines||[])){ let od=out.disciplines.find(x=>x.id===d.id); if(!od){ out.disciplines.push(JSON.parse(JSON.stringify(d))); continue; } Object.keys(d).forEach(k=>{ if(k!=='topics') od[k]=d[k]; }); od.topics=od.topics||[];
    for(const t of (d.topics||[])){ const i=od.topics.findIndex(x=>x.id===t.id); if(i<0) od.topics.push(t); else od.topics[i]=Object.assign({},od.topics[i],t); } }
  out.updated=new Date().toISOString(); return out;
}
function exportJSON(){
  const pack={format:"gabarito-pack",version:1,catalog:S.catalog,questions:ctxQs()};
  const blob=new Blob([JSON.stringify(pack,null,1)],{type:"application/json"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`gabarito-${curDisc()?.id}-${curTopic()?.id}-${dayKey()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
function subscribeQs(){ /* questions are fetched on open and when the app returns to foreground */ }

async function boot(){
  cacheLoad(); applyTheme();
  const h=(location.hash||"").slice(1); if(["home","study","review","cards","stats","bank"].includes(h)) S.view=h;
  try{ history.replaceState({v:S.view},"","#"+S.view); }catch(e){}
  S.downloads=true; // enables the export button (plain browser download)
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
  if(!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase){ setSync("off"); render(); if(!CFG.SUPABASE_URL) toast("config.js sem Supabase"); return; }
  SB = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  S.db = DBA;
  const {data:{session}} = await SB.auth.getSession();
  const onSession = async sess=>{
    if(sess?.user){ const changed=S.uid!==sess.user.id; S.uid=sess.user.id; window.__email=sess.user.email; S.owner=(sess.user.email||"").toLowerCase()===(CFG.ADMIN_EMAIL||"").toLowerCase(); if(changed){ render(); fetchAll(); } }
    else { S.uid=null; if(!S.offlineMode) vLogin(); }
  };
  SB.auth.onAuthStateChange((_e,sess)=>{ onSession(sess); });
  if(session) onSession(session); else if(navigator.onLine===false && S.qs.size){ S.offlineMode=true; setSync("off"); render(); } else vLogin();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && sbReady()) fetchAll(); });
  window.addEventListener("online",()=>{ if(sbReady()){ saveProg(); fetchAll(); } });
}
boot();
</script>
