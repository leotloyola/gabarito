(()=>{ let st=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const scroller=b=>{ for(let e=b;e&&e!==document.body;e=e.parentElement){ const o=getComputedStyle(e).overflowY; if((o==="auto"||o==="scroll")&&e.scrollHeight>e.clientHeight+1) return e; } return document.scrollingElement; };
  document.addEventListener("touchstart",e=>{ const b=e.target.closest&&e.target.closest(".gbox"); if(!b||e.touches.length!==2){ if(st&&e.touches.length!==2) st=null; return; }
    st={b,d:dist(e.touches),z:parseFloat(b.style.getPropertyValue("--gz"))||1,sc:scroller(b)}; },{passive:true});
  document.addEventListener("touchmove",e=>{ if(!st||e.touches.length!==2) return; const {b}=st, t=e.touches, cx=(t[0].clientX+t[1].clientX)/2, cy=(t[0].clientY+t[1].clientY)/2;
    const old=parseFloat(b.style.getPropertyValue("--gz"))||1, nz=Math.min(5,Math.max(1,st.z*dist(t)/st.d)); if(Math.abs(nz-old)<0.005) return;
    const r=b.getBoundingClientRect(), k=nz/old, own=st.sc===b, x0=b.scrollLeft+cx-r.left, y0=(own?b.scrollTop:0)+cy-r.top;
    b.style.setProperty("--gz",nz.toFixed(3)); b.scrollLeft=x0*k-(cx-r.left); st.sc.scrollTop+=y0*(k-1); if(e.cancelable) e.preventDefault(); },{passive:false});
  const end=e=>{ if(!st||e.touches.length>=2) return; const b=st.b; st=null; clearTimeout(b._zt); if(b._rerender) b._zt=setTimeout(b._rerender,200); };
  document.addEventListener("touchend",end,{passive:true}); document.addEventListener("touchcancel",end,{passive:true});
  document.addEventListener("dblclick",e=>{ const b=e.target.closest&&e.target.closest(".gbox"); if(b&&b.style.getPropertyValue("--gz")){ b.style.removeProperty("--gz"); b.scrollLeft=0; if(b._rerender) setTimeout(b._rerender,100); } });
})();

function aiErr(e){ const c=e?.code; return c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed" ? tr("aiDenied") : c==="rate_limited" ? tr("aiRate") : tr("aiErr"); }
function hydrateAI(q){ const a=S.ai[q.id]; const el=document.getElementById("ai-"+q.id); if(a&&el) el.innerHTML=`<div class="box ai"><h3>${tr("aiTitle")}</h3><div class="md">${a.html}</div></div>`; }
async function explain(id, btn){
  const q=S.qs.get(id); if(!q||!S.sample) return; const {c}=content(q); const lang=set().lang;
  const el=document.getElementById("ai-"+id); const ctl=new AbortController();
  btn.disabled=true; el.innerHTML=`<div class="box ai"><h3>${tr("aiTitle")}</h3><div class="md" id="aiT-${id}">${tr("explaining")}</div><div class="row" style="margin-top:8px"><button class="btn small" id="aiStop-${id}">${tr("stop")}</button></div></div>`;
  document.getElementById("aiStop-"+id).onclick=()=>ctl.abort();
  const it=S.session?.items?.find(x=>x.id===id); const pick=it?.pick ?? null;
  const plain=s=>String(s).replace(/<[^>]+>/g,"");
  const prompt = (lang==="en"
   ? "You are a tutor for a Brazilian medical student (also a federal highway police officer with little time) preparing for UFPR exams and USMLE Step 1/2 CK. Be direct, technical, dense, no greetings. Use US guidelines (AHA, ADA, IDSA etc.) when relevant. Reply in ENGLISH using exactly these sections as short bullet lists:\n**Flashcard** (Anki-style question + 1-3 line answer)\n**Don't confuse with** (the commonly confused drug/condition and the key difference)\n**Best next step** (diagnostic/therapeutic, guideline-based)\n**Source** (ONE reference: First Aid, Pathoma, Harrison, Robbins, Costanzo, UWorld/Amboss or Katzung)\n**Recall** (one question answerable in 1 line)\nIf Brazilian and USMLE nomenclature or guidelines differ, flag it in one line.\n\n"
   : "Você é tutor de um estudante de Medicina da UFPR (também policial rodoviário federal, com pouco tempo) que estuda para a prova da UFPR e para o USMLE Step 1/2 CK. Seja direto, técnico, denso, sem saudações. Use guidelines americanos (AHA, ADA, IDSA etc.) quando pertinente. Responda em PORTUGUÊS usando exatamente estas seções, em tópicos curtos:\n**Flashcard** (pergunta estilo Anki + resposta em 1-3 linhas)\n**Não confundir com** (fármaco/condição confundida e a diferença-chave)\n**Best Next Step** (diagnóstico/terapêutico, baseado em guideline)\n**Fonte** (UMA referência: First Aid, Pathoma, Harrison, Robbins, Costanzo, UWorld/Amboss ou Katzung)\n**Recall** (uma pergunta respondível em 1 linha)\nSe nomenclatura ou guideline do Brasil e do USMLE divergirem, sinalize em uma linha.\n\n")
   + "QUESTION:\n" + plain(c.stem) + "\n\nOPTIONS:\n" + c.opts.map((o,i)=>`${L[i]}) ${plain(o.t)}${i===q.correct?"  [CORRECT]":""}`).join("\n")
   + (pick!==null && pick!==q.correct ? `\n\nThe student chose ${L[pick]} (wrong). Address that misconception first.` : "")
   + "\n\nEXISTING EXPLANATION (do not repeat it, go deeper):\n" + plain(optFull(q,c.opts[q.correct]));
  try{
    const r=await S.sample(prompt,{signal:ctl.signal,onText:({text})=>{ const t=document.getElementById("aiT-"+id); if(t) t.innerHTML=md(text); }});
    S.ai[id]={html:md(r.text)}; hydrateAI(q);
  }catch(e){ const t=document.getElementById("aiT-"+id); if(e.code==="cancelled"){ if(e.text){ S.ai[id]={html:md(e.text)}; hydrateAI(q);} else el.innerHTML=""; } else if(t){ t.innerHTML=(e.text?md(e.text):"")+`<p style="color:var(--bad)">${aiErr(e)}</p>`; } }
  finally{ btn.disabled=false; const s=document.getElementById("aiStop-"+id); if(s) s.remove(); }
}
async function translateQ(id, btn){
  const q=S.qs.get(id); if(!q||!S.sample) return; const target=set().lang; const srcLang=target==="pt"?"en":"pt"; const c=q.i18n[srcLang];
  const box=document.getElementById("tr-"+id); btn.disabled=true; box.innerHTML=`<p class="mono" style="font-size:12px;margin:8px 0 0">${tr("explaining")}</p>`;
  const prompt=`Translate this medical exam question object from ${srcLang==="en"?"English":"Brazilian Portuguese"} to ${target==="en"?"English (US medical terminology, USMLE style)":"Brazilian Portuguese (terminologia médica brasileira)"}. Keep the same JSON shape and keys, keep the order of "opts", keep any <b> tags, translate every string value. Reply with only the JSON object, plus a "tags" array translating these tags: ${JSON.stringify(q.tags?.[srcLang]||[])}.\n\n`+JSON.stringify(c);
  try{
    const out=await S.sample.json(prompt,{modelTier:"default"});
    if(!out||typeof out.stem!=="string"||!Array.isArray(out.opts)||out.opts.length!==c.opts.length||out.opts.some(o=>typeof o?.t!=="string"||typeof o?.why!=="string")) throw {code:"invalid_json"};
    const tags=Array.isArray(out.tags)?out.tags.map(String).slice(0,6):null; delete out.tags;

/* ---------- PLANO (grade de estudos até as provas) ---------- */
// Tudo calculado na hora a partir do catálogo (datas das provas), das questões (★) e do progresso; só as preferências ficam em settings.plan.
const PLAN_COV=.85; // tema "coberto" quando 85% das questões foram vistas
function PL(){ const s=set(), p=s.plan||(s.plan={}); if(typeof p.cap!=="number") p.cap=30; for(const k of ["offWd","offDates"]) if(!Array.isArray(p[k])) p[k]=[]; for(const k of ["dates","hide"]) if(!p[k]||typeof p[k]!=="object") p[k]={}; return p; }
const addDays=(t,n)=>{ const d=new Date(t); d.setDate(d.getDate()+n); return d.getTime(); };
const exKey=(d,ex)=>d.id+"|"+ex.id;
function planExDate(d,ex){ const o=PL().dates[exKey(d,ex)]; return o ? startOfDay(new Date(o+"T12:00:00").getTime()) : examDate(ex); }
function planIsOff(t,P){ return P.offWd.includes(new Date(t).getDay()) || P.offDates.includes(dayKey(new Date(t))); }
function planIndex(){ const m=new Map(); for(const q of S.qs.values()){ if(q.standard==="usmle"||q.standard==="banco") continue; const k=q.discipline+"|"+q.topic; let a=m.get(k); if(!a) m.set(k,a=[]); a.push(q); } return m; }
function planTopic(d,t,idx){ const qs=idx.get(d.id+"|"+t.id)||[]; const n=qs.length; let seen=0,ok=0,ps=0; const wrong=[];
  for(const q of qs){ ps+=priOf(q); const r=rec(q.id); if(r){ seen++; if(r.ok) ok++; else wrong.push(q); } }
  const need=Math.max(0,Math.ceil(n*PLAN_COV)-seen), acc=seen?ok/seen:null, w=n?ps/n:2;
  return {d,t,n,seen,ok,acc,w,need,wrong,done:n>0&&need===0,score:w+(seen?1.5*(1-acc):.3)}; }
function planCompute(){
  const idx=planIndex(), P=PL(), today=startOfDay(now()), tk=dayKey(new Date(today));
  const exams=[];
  for(const d of discs()) for(const ex of (d.exams||[])){ if(P.hide[exKey(d,ex)]) continue; const dt=planExDate(d,ex); if(dt==null||dt<today) continue;
    const tps=(d.topics||[]).filter(t=>ex.all||t.exam===ex.id).map(t=>planTopic(d,t,idx)).filter(x=>x.n); if(!tps.length) continue;
    exams.push({d,ex,dt,days:Math.round((dt-today)/DAY),tps,n:tps.reduce((s,x)=>s+x.n,0),seen:tps.reduce((s,x)=>s+x.seen,0),ok:tps.reduce((s,x)=>s+x.ok,0)}); }
  exams.sort((a,b)=>a.dt-b.dt);
  const days=new Map(), push=(k,it)=>{ if(!days.has(k)) days.set(k,[]); days.get(k).push(it); };
  const doneToday=(S.prog.log[tk]||{}).n||0, used={}, claimed=new Set();
  for(const e of exams){
    const free=[]; for(let t=today;t<e.dt;t=addDays(t,1)) if(!planIsOff(t,P)) free.push(t);
    e.freeN=free.length; e.reviewDay=free.length>=4?free.pop():null;
    const pend=e.tps.filter(x=>!x.done&&!claimed.has(x.d.id+"|"+x.t.id)).sort((a,b)=>b.score-a.score);
    pend.forEach(x=>claimed.add(x.d.id+"|"+x.t.id));
    e.needTotal=pend.reduce((s,x)=>s+x.need,0); e.quota=free.length?Math.min(P.cap,Math.ceil(e.needTotal/free.length)):0;
    const left=new Map(pend.map(x=>[x,x.need]));
    for(const lim of [e.quota,P.cap]){
      for(const x of pend){ let l=left.get(x); if(l<=0) continue;
        for(const t of free){ const k=dayKey(new Date(t)); const room=(t===today?Math.max(0,lim-doneToday):lim)-(used[k]||0); if(room<=0) continue;
          const take=Math.min(l,room); used[k]=(used[k]||0)+take; l-=take; push(k,{k:"new",tp:x,n:take}); if(l<=0) break; }
        left.set(x,l); } }
    e.over=[...left.values()].reduce((s,v)=>s+v,0);
    // erros voltam na data de revisão do FSRS (nunca antes de hoje, nem em dia sem estudo, nem depois da prova)
    for(const x of e.tps){ const by={}; for(const q of x.wrong){ const r=rec(q.id); let t=Math.max(today,r.due!=null?startOfDay(r.due):today+DAY);
        while(t<e.dt&&planIsOff(t,P)) t=addDays(t,1); if(t>=e.dt) t=e.reviewDay||free[free.length-1]||today; by[dayKey(new Date(t))]=(by[dayKey(new Date(t))]||0)+1; }
      for(const k in by) push(k,{k:"rev",tp:x,n:by[k]}); }

document.addEventListener("keydown", e=>{
  if(e.target.closest("input,textarea,select,[contenteditable='true']")||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==="Escape" && $("#layer").innerHTML){ closeSheet(); return; }
  if(e.key==="Escape" && document.body.classList.contains("lpfull")){ S.lpFull=false; render(); return; }
  if(e.key==="Escape" && document.body.classList.contains("lpread")){ S.lpRead=false; render(); return; }
  if($("#layer").innerHTML) return;
  if(e.target.closest("summary")) return; // Enter/Space operate disclosure controls, not session navigation.
  const k=e.key.toLowerCase(); const click=sel=>{ const b=document.querySelector(sel); if(b&&!b.disabled){ b.click(); e.preventDefault(); return true; } return false; };
  if(k==="?"){ e.preventDefault(); return openKeys(); }
  if(k==="/"&&S.view!=="search"&&!inSession()){ e.preventDefault(); S.srBack=S.view; return go("search"); }
  // flashcards
  if(S.view==="cards" && S.fcDeck && S.fcDeck.i<S.fcDeck.ids.length){
    if(!S.fcDeck.show){ if(k===" "||k==="enter") click('[data-act="fcShow"]'); return; }
    const g="123".indexOf(k); if(g>=0) click(`[data-act="fcRate"][data-g="${g}"]`); else if(k===" "||k==="enter") click('[data-act="fcRate"][data-g="2"]');
    if(k==="escape") click('[data-act="fcReset"]'); return; }
  // lição
  if(S.view==="lesson"){ if(k==="escape"||k==="backspace") click('[data-act="lessonBack"]'); return; }
  if(k==="escape"&&S.tuB!=null&&(S.view==="study"||S.view==="review")){ e.preventDefault(); return tuUp(); }
  if(S.view==="tutor"&&S.tuB!=null){ if(k==="escape"||k==="backspace"){ e.preventDefault(); tuUp(); } else if(k==="arrowright") click('[data-act="tuOpen"][data-nx]'); else if(k==="arrowleft") click('[data-act="tuOpen"][data-pv]'); else if(k==="enter") click('.tbmain [data-act="tutorBlock"],.tbmain [data-act="tutorLesson"]'); return; }
  const s=S.session; if(!s||s.done||!(S.view==="study"||S.view==="review")) return;
  const idx="abcde".indexOf(k)>=0?"abcde".indexOf(k):"123456789".indexOf(k); // F, G, I… são atalhos: da 6ª em diante, pelos números
  if(s.scroll){ // prova em página única: letras respondem a questão da vez; ← → (ou J/K) vão para a anterior/próxima
    if(idx>=0){ const b=document.querySelectorAll("#view #sq-"+s.i+" .opts .opt")[idx]; if(b&&!b.disabled){ b.click(); e.preventDefault(); } return; }
    if(k==="arrowright"||k==="j"){ e.preventDefault(); return sqGo(s.i+1); } if(k==="arrowleft"||k==="k"){ e.preventDefault(); return sqGo(s.i-1); }
    if(k==="f") click('#view [data-act="fs"]'); return; }
  if(idx>=0){ const b=document.querySelectorAll("#view .opts .opt")[idx]; if(b&&!b.disabled){ b.click(); e.preventDefault(); } return; }
  if(k==="arrowright"||(k==="enter"&&!e.target.closest("button"))||(k===" "&&!e.target.closest("button"))){ if(!click('#view [data-act="next"]') && k!==" ") click('#view [data-act="finish"]'); return; }
  if(k==="arrowleft"){ click('#view [data-act="prev"]'); return; }
  if(k==="l"){ click('#view .tags [data-act="lesson"]'); return; }
  if(k==="m"){ click('#view [data-act="detail"]'); return; }
  if(k==="i"){ click('#view .qlang [aria-pressed="false"]'); return; }
  if(k==="f"){ click('#view [data-act="fs"]'); return; }
});
/* ---------- MAPA DE CONCEITOS ----------
   Motor em cx.js (CX.build/mastery/rank/train). Dados: linhas kind:"tutor" do Supabase — "tutor:cx" (conceitos e grupos)
   e "tutor:cx:<lote>" (questão → conceitos). O domínio é recalculado de progress.ev; nada novo é gravado no progresso. */
let _cxG=null,_cxGk=null,_cxM=null,_cxMk=null,_cxO=null,_cxOk=null;
function cxGraph(){ const T=S.tutor||{}, base=T["tutor:cx"]; if(!base||!window.CX) return null;
  const k=(base.updated||"")+"|"+Object.keys(T).length; if(_cxGk===k&&_cxG) return _cxG;
  const marks={}; for(const [id,o] of Object.entries(T)) if(id.startsWith("tutor:cx:")&&o.q) Object.assign(marks,o.q);
  _cxG=CX.build(base.nodes||{},marks); _cxG.groups=base.groups||{}; _cxGk=k; _cxMk=null; _cxOk=null; return _cxG; }
function cxState(){ const G=cxGraph(); if(!G) return null; const ev=S.prog.ev||[];
  const k=_cxGk+"|"+ev.length+"|"+(ev.length?ev[ev.length-1][0]:0)+"|"+dayKey();
  if(_cxMk!==k){ _cxM=CX.mastery(G,ev,now()); _cxMk=k; } return {G,M:_cxM}; }
function cxSrc(q){ return q.standard==="banco"?"banco":q.discipline==="usmle"?"uworld":q.discipline; }
function cxSrcName(s){ return s==="banco"?"Banco MED":s==="uworld"?"UWorld":(nm(discById(s))||s); }
function cxOpt(G){ const k=_cxGk+"|"+S.qs.size+"|"+curMode()+"|"+dayKey(); if(_cxOk===k) return _cxO;
  const today=startOfDay(now()), ex=new Map(), steps=curMode()==="steps";
  if(!steps) for(const d of allDiscs()){ let best=null; for(const e of d.exams||[]){ if(PL().hide[exKey(d,e)]) continue; const t=planExDate(d,e); if(t!=null&&t>=today){ const dd=Math.round((t-today)/DAY); if(best==null||dd<best) best=dd; } } if(best!=null) ex.set(d.id,best); }
  const imp=new Map(), exd=new Map(), av=new Map();
  for(const [c,qs] of G.cq){ let s=0,n=0,b=null; for(const id of qs){ const q=S.qs.get(id); if(!q) continue; s+=priOf(q); n++; if(q.standard!=="banco"){ const d=ex.get(q.discipline); if(d!=null&&(b==null||d<b)) b=d; } } imp.set(c,n?(s/n-1)/2:0.5); exd.set(c,b); av.set(c,n); }
  _cxOk=k; return _cxO={imp:id=>imp.get(id)??0.5, exam:id=>exd.get(id)??null, av:id=>av.get(id)||0}; }
function cxRank(){ const X=cxState(); if(!X) return []; const O=cxOpt(X.G); return CX.rank(X.G,X.M,O).filter(r=>O.av(r.id)>0); }
function cxTrainIds(id,n){ const X=cxState(); if(!X) return [];
  return CX.train(X.G,X.M,id,qid=>{ const q=S.qs.get(qid); return q?{src:cxSrc(q),pri:priOf(q)}:null; },qid=>{ const r=rec(qid); return r?{ok:r.ok,ts:r.ts}:undefined; },now(),n||CX.P.TRAIN); }
function cxTrain(id){ const L=cxTrainIds(id).map(i=>S.qs.get(i)).filter(Boolean); if(!L.length) return toast(tr("none"));
  S.fcDeck=null; S.setup=null; S.tuB=null;
  S.session=buildSession("study",L,Object.assign(defaultSetup(),{mode:"study",count:0,order:"seq",shuffleO:true})); Object.assign(S.session,{from:"cx",cx:id});
  if($("#layer").innerHTML){ closeSheetRaw(); S.sheetPushed=false; S.view="study"; try{ history.replaceState({v:"study"},"","#study"); }catch(_){} render(); window.scrollTo({top:0}); }
  else go("study"); }
function cxHue(m){ return Math.round(Math.max(0,Math.min(1,(m-.3)/.55))*130); }
function cxPct(s){ return !s||s.status==="novo"?"—":Math.round(100*s.m)+"%"; }
function cxStName(st){ return ({fraco:T2("Fraco","Weak"),instavel:T2("Em construção","Building"),dominado:T2("Dominado","Mastered"),novo:T2("Não testado","Untested")})[st]||st; }

// Banco MED: a linha fica em discipline "banco" (RLS só para o admin); `link` encaixa a questão num tema existente
function rowToQ(r){ const q=Object.assign({id:r.id}, r.data); if(q.standard==="banco"&&q.link){ q.bd=q.discipline; q.bt=q.topic; q.discipline=q.link.d; q.topic=q.link.t; q.sub="banco"; } return q; }
function qToRow(q){ const {id, ...data}=q; if(data.bd){ data.discipline=data.bd; data.topic=data.bt; delete data.bd; delete data.bt; data.sub=data.sub||"banco"; } return {id, discipline:data.discipline, topic:data.topic, data, updated_at:new Date().toISOString()}; }
// adapter with the subset of the artifact db API the UI uses
const DBA = {
  doc(path){
    const [col,id] = path.startsWith("data/users/") ? ["progress", null] : path.split("/");
    return {
      async set(obj,at){
        if(col==="progress"){ const {error}=await SB.from("progress").upsert({user_id:S.uid, state:obj, updated_at:at||new Date().toISOString()}); if(error) throw error; return; }
        if(col==="questions"){ const {error}=await SB.from("questions").upsert(qToRow(Object.assign({id},obj))); if(error) throw error; return; }
        if(col==="catalog"){ const {error}=await SB.from("catalog").upsert({id, data:obj, updated_at:new Date().toISOString()}); if(error) throw error; return; }
      },
      async update(patch){
        if(col!=="questions") throw new Error("unsupported");
        const cur=S.qs.get(id); if(!cur) throw new Error("missing");
        const merged=deepMerge(JSON.parse(JSON.stringify(cur)), patch);
        const {error}=await SB.from("questions").upsert(qToRow(merged)); if(error) throw error; S.qs.set(id, merged);
      },
      async delete(){ const {error}=await SB.from(col).delete().eq("id",id); if(error) throw error; }
    };
  }
};
function deepMerge(a,b){ for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }

async function fetchAll(){
  setSync("loading");
  try{
    const c=await SB.from("catalog").select("id,data").eq("id","main").maybeSingle();
    if(c.error) throw c.error;
    if(c.data) S.catalog=c.data.data;
    // questões: download completo só na primeira vez ou a cada 12 h (pega também as apagadas); nas voltas ao app,
    // só o que mudou desde a última leitura (updated_at do servidor) — economiza dados no 4G
    const M=S.qsMeta||{}, tNow=Date.now(), full=!S.qs.size||!M.at||tNow-(M.full||0)>12*3600e3;
    if(full||tNow-(S.qsFetchT||0)>60e3){
      const qs=full?new Map():S.qs, ls=full?new Map():S.lessons, tu=full?{}:Object.assign({},S.tutor||{}); let from=0, maxAt=full?"":M.at;
      for(;;){ let rq=SB.from("questions").select("id,data,updated_at"); if(!full) rq=rq.gte("updated_at",M.at); const r=await rq.order("id").range(from, from+999); if(r.error) throw r.error;
        r.data.forEach(x=>{ if(x.updated_at&&x.updated_at>maxAt) maxAt=x.updated_at; const o=rowToQ(x); if(o.kind==="lesson"){ ls.set(o.id,o); qs.delete(o.id); } else if(o.kind==="tutor") tu[o.id]=o; else qs.set(o.id,o); }); if(r.data.length<1000) break; from+=1000; }
      S.qs=qs; S.lessons=ls; S.tutor=tu; S.qsFetchT=tNow; S.qsMeta={at:maxAt||M.at||"", full:full?tNow:M.full}; }
    const p=await SB.from("progress").select("state,updated_at").eq("user_id",S.uid).maybeSingle();
    if(p.error) throw p.error;
    if(p.data?.state){ const remote=p.data.state, dirty=progDirty(); S.remoteAt=p.data.updated_at?Date.parse(p.data.updated_at):0;
      const merged=syncMerge(S.prog,remote,dirty); S.prog=merged;
      if(dirty||progSig(merged)!==progSig(remote)) saveProg(); else { progDirty(false); S.syncAt=Date.now(); } }
    else if(Object.keys(S.prog.q).length) saveProg();
    applyTheme(); setSync("on"); cacheSave();
  }catch(e){ console.error(e); setSync("off"); }
  const rest=posRestore();
  if(rest||!(S.session && (S.view==="study"||S.view==="review"))) render(); else renderTabs();
}

async function importRun(){
  let pack; try{ pack=JSON.parse($("#impTxt").value); }catch(e){ toast("JSON inválido / invalid JSON"); return; }
  const qs = Array.isArray(pack) ? pack : (pack.questions||[]);
  const btn=$("#impBtn"); btn.disabled=true;
  try{
    if(pack.catalog){ const merged=mergeCatalog(S.catalog||{disciplines:[]}, pack.catalog); const {error}=await SB.from("catalog").upsert({id:"main", data:merged, updated_at:new Date().toISOString()}); if(error) throw error; S.catalog=merged; }
    const rows=qs.filter(q=>q&&q.id&&q.i18n&&q.discipline&&q.topic).map(qToRow);
    for(let i=0;i<rows.length;i+=200){ const {error}=await SB.from("questions").upsert(rows.slice(i,i+200)); if(error) throw error; }
    toast(`${tr("imported")}: ${rows.length}`); closeSheet(); await fetchAll();
  }catch(e){ toast((e&&e.message)||tr("aiErr")); btn.disabled=false; }
}
function mergeCatalog(a,b){
  const out=JSON.parse(JSON.stringify(a)); out.disciplines=out.disciplines||[];
  for(const d of (b.disciplines||[])){ let od=out.disciplines.find(x=>x.id===d.id); if(!od){ out.disciplines.push(JSON.parse(JSON.stringify(d))); continue; } Object.keys(d).forEach(k=>{ if(k!=='topics') od[k]=d[k]; }); od.topics=od.topics||[];

/* ---------- PONTO DE LEITURA DE CADA LIÇÃO ----------
   Cada lição guarda onde parou, neste aparelho, em localStorage "gab.lpos" = {id:{b,f,t}}: b = bloco do topo da tela
   (filho de article.lesson), f = fração dentro dele, t = data. Por bloco e não por pixel, para valer na página, na folha
   por cima da questão e no painel do tablet (larguras diferentes). Registros com mais de 14 dias são apagados.
   Abre no começo: "Próxima lição" ao fim dos exercícios (S.lTop) e lição aberta pela busca (vai ao trecho). */
const LPOS_K="gab.lpos", LPOS_TTL=14*864e5;
let lposHold=0, lposSeen={};
function lposAll(){ try{ const o=JSON.parse(localStorage.getItem(LPOS_K)||"{}"); return o&&typeof o==="object"?o:{}; }catch(_){ return {}; } }
function lposPut(o){ const lim=Date.now()-LPOS_TTL; for(const k of Object.keys(o)) if(!(+o[k]?.t>lim)) delete o[k]; try{ localStorage.setItem(LPOS_K,JSON.stringify(o)); }catch(_){} }
function lposArts(){ return [...document.querySelectorAll("article.lesson")].map(art=>{ const id=(art.closest("[data-owner]")?.dataset.owner||"").replace(/^L:/,"");
  const kind=art.closest(".qlbody")?"panel":art.closest(".sheet")?"sheet":"view"; return id&&art.getClientRects().length?{art,id,kind}:null; }).filter(Boolean); }
function lposRef(sc){ const doc=sc===document.scrollingElement||sc===document.documentElement; const top=doc?0:sc.getBoundingClientRect().top, h=doc?innerHeight:sc.clientHeight; return top+Math.min(90,h*.15); }
function lposRead(art){ const sc=annScroller(art), ref=lposRef(sc), kids=[...art.children];
  for(let i=0;i<kids.length;i++){ const r=kids[i].getBoundingClientRect(); if(!r.height) continue; if(r.bottom>ref) return {b:i,f:Math.max(0,Math.min(1,(ref-r.top)/r.height))}; }
  return kids.length?{b:kids.length-1,f:1}:null; }
function lposSave(){ if(Date.now()<lposHold) return; const L=lposArts(); if(!L.length) return; const o=lposAll(), t=Date.now();
  for(const x of L){ const p=lposRead(x.art); if(p) o[x.id]={b:p.b,f:Math.round(p.f*1000)/1000,t}; } lposPut(o); }
function lposGo(art,p){ const el=art.children[p.b]; if(!el) return; lfullReveal(el); const sc=annScroller(art), r=el.getBoundingClientRect();
  sc.scrollTop+=r.top+p.f*r.height-lposRef(sc); }
function lposScan(skip){ const L=lposArts(), now=new Set(L.map(x=>x.kind));
  for(const k of Object.keys(lposSeen)) if(!now.has(k)) delete lposSeen[k];
  for(const x of L){ if(lposSeen[x.kind]===x.id) continue; lposSeen[x.kind]=x.id; if(skip&&x.kind==="view") continue;
    const p=lposAll()[x.id]; if(!p||(+p.t||0)<Date.now()-LPOS_TTL||(!p.b&&!p.f)) continue; lposHold=Date.now()+900;
    const art=x.art; let y=null; const sc=()=>annScroller(art);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(!art.isConnected) return; lposGo(art,p); y=sc().scrollTop; }));
    setTimeout(()=>{ if(art.isConnected&&y!=null&&Math.abs(sc().scrollTop-y)<2){ lposGo(art,p); } },350); } }
(()=>{ const _r=render; render=function(){ const skip=!!S.lessonHl||!!S.lTop; _r.apply(this,arguments); try{ lposScan(skip); }catch(_){} };
  let t=null; document.addEventListener("scroll",()=>{ if(t) return; t=setTimeout(()=>{ t=null; lposSave(); },400); },{passive:true,capture:true});
  const flush=()=>{ lposHold=0; lposSave(); }; document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); }); window.addEventListener("pagehide",flush);
  try{ lposPut(lposAll()); }catch(_){} })();

/* ---------- VER NA LIÇÃO (automático, sem vínculo no conteúdo) ----------
   Palavras do enunciado, da resposta certa, do comentário dela e da pegadinha (com sinônimos de sinonimos.js) são
   comparadas com cada bloco da lição; vence o bloco com mais termos raros em comum (peso de idf). O "Na véspera"
   pesa um pouco menos, para preferir a explicação em prosa. */
const LS_STOP=new Set(("de da do das dos e a o as os em na no nas nos para por com um uma uns umas que se ao aos ou mais menos como qual quais "+
 "e sao ser foi era pode podem deve sobre entre sem seu sua seus suas este esta esse essa isso nao sim muito pouco quando onde mas tambem ja "+
 "paciente pacientes alternativa alternativas correta correto incorreta afirmativa afirmativas assinale caso anos ano exceto principal maior menor "+
 "tipo the of and in to is are with for a an or at on by be this that which most following patient").split(" "));
const lsStem=w=>w.length>6?w.slice(0,6):w;
function lsToks(t){ return nz(t).split(" ").filter(w=>w.length>=3&&!LS_STOP.has(w)&&!/^\d+$/.test(w)); }
function lspotTerms(q){ const c=q.i18n?.pt||content(q).c; if(!c) return [];
  const it=S.session?.items?.find(x=>x.id===q.id), blind=!!(it&&it.pick==null); // ainda não respondida: não usa a resposta
  const co=c.opts?.[q.correct]||{}, F=blind?[[c.stem,1.6],...(c.opts||[]).map(o=>[o.t,.7])]:[[c.stem,1],[co.t,2.2],[optFull(q,co),1.4],[pegFull(q,c),1]];
  const syn=synIndex(), T=new Map(); // chave -> {w, alt:[stems], ph:[frases]}
  for(const [txt,w] of F){ const ws=lsToks(plain(txt||"")); const used=new Set();
    for(let i=0;i<ws.length;i++){ let hit=null; for(let n=Math.min(3,ws.length-i);n>=1&&!hit;n--){ const ph=ws.slice(i,i+n).join(" "); if(syn.has(ph)) hit={n,ph}; }
      const key=hit?"s:"+hit.ph:lsStem(ws[i]); if(used.has(key)){ if(hit) i+=hit.n-1; continue; } used.add(key);
      let e=T.get(key); if(!e){ e={w:0,alt:new Set(),ph:new Set()}; T.set(key,e);
        if(hit){ syn.get(hit.ph).forEach(g=>g.forEach(x=>{ const p=x.n.trim(); if(!p) return; p.includes(" ")?e.ph.add(" "+p+" "):e.alt.add(lsStem(p)); })); } else e.alt.add(key); }
      e.w=Math.min(4,e.w+w); if(hit) i+=hit.n-1; } }
  return [...T.values()]; }
function lspotBlocks(art){ const sel="p,li,tr,h2,h3,h4,dd,dt,figcaption,.tq,.tn,.tf,.chain,blockquote>div";
  const all=[...art.querySelectorAll(sel)].filter(el=>!el.closest("svg,.ann-layer")&&!el.querySelector(sel));
  const sw=art.querySelector(".lfull-sw"); let head="";
  return all.map(el=>{ if(/^H[2-4]$/.test(el.tagName)) head=el.textContent;
    const n=" "+nz(el.textContent)+" ", set=new Set(n.split(" ").filter(Boolean).map(lsStem));
    const vesp=!!(sw&&(sw.compareDocumentPosition(el)&Node.DOCUMENT_POSITION_PRECEDING));
    return {el,n,set,len:set.size,vesp,head:" "+nz(head)+" ",hset:new Set(nz(head).split(" ").filter(Boolean).map(lsStem))}; }).filter(b=>b.len); }
function lspotFind(art,q){ return lspotBest(lspotBlocks(art),lspotTerms(q),2,3); }
function lspotBest(B,terms,minK,minSc){ if(!terms.length||!B.length) return null;
  const has=(e,set,n)=>{ for(const a of e.alt) if(set.has(a)) return true; for(const p of e.ph) if(n.includes(p)) return true; return false; };
  const idf=terms.map(e=>{ let df=0; for(const b of B) if(has(e,b.set,b.n)) df++; return df?Math.log(1+B.length/df):0; });
  let best=null;
  for(const b of B){ let sc=0, k=0; terms.forEach((e,i)=>{ if(!idf[i]) return; if(has(e,b.set,b.n)){ sc+=e.w*idf[i]; k++; } else if(has(e,b.hset,b.head)) sc+=.35*e.w*idf[i]; });
    if(k<minK) continue; sc=sc/(1+.12*Math.log(1+b.len))*(b.vesp?.75:1)*(/^H[2-4]$/.test(b.el.tagName)?.6:1);
    if(!best||sc>best.sc) best={el:b.el,sc,k}; }
  return best&&best.sc>=minSc?best.el:null; }
function lspotShow(art,q){ if(!art||!art.isConnected) return false; const el=lspotFind(art,q); if(!el){ toast(T2("Não achei um trecho parecido; abri a lição do tema.","No close passage found; opened the topic lesson.")); return false; }
  lfullReveal(el); lposHold=Date.now()+1500;

    const top=doc?0:sc.getBoundingClientRect().top, h=doc?innerHeight:sc.clientHeight, r=el.getBoundingClientRect();
    const y=r.top-top-Math.max(60,Math.min(h*.28,(h-r.height)/2)); if(doc) window.scrollBy({top:y}); else sc.scrollTop+=y; };

  setTimeout(()=>el.classList.add("lspot-out"),2200); setTimeout(()=>el.classList.remove("lspot","lspot-out"),3800); return true; }
function lspotOpen(qid){ const q=S.qs.get(qid); if(!q) return; const l=lessonOf(q.discipline,q.topic); if(!l) return;

/* ---------- BARRA DE PROGRESSO DA LIÇÃO ----------
   2 px no topo: na página da lição (fixa no topo da tela, também no modo leitura), no painel do tablet e na folha
   do celular (presa ao topo da área que rola). Mostra quanto da lição já passou pela tela; some se a lição cabe na tela. */
let lprogRaf=0; const lprogRO="ResizeObserver" in window?new ResizeObserver(()=>lprogQ()):null, lprogObs=new WeakSet();
function lprogQ(){ if(lprogRaf) return; lprogRaf=requestAnimationFrame(()=>{ lprogRaf=0; try{ lprogUpd(); }catch(_){} }); }
function lprogUpd(){ let fixed=false;
  for(const art of document.querySelectorAll("article.lesson")){ if(!art.getClientRects().length) continue;
    if(lprogRO&&!lprogObs.has(art)){ lprogObs.add(art); lprogRO.observe(art); }
    const sc=annScroller(art), doc=sc===document.scrollingElement||sc===document.documentElement, r=art.getBoundingClientRect();
    const vt=doc?0:sc.getBoundingClientRect().top, vb=doc?innerHeight:vt+sc.clientHeight;
    let bar;
    if(doc){ if(S.view!=="lesson"||!art.closest(".lwrap")) continue; fixed=true; bar=document.getElementById("lprog");
      if(!bar){ bar=document.createElement("div"); bar.id="lprog"; bar.setAttribute("aria-hidden","true"); document.body.appendChild(bar); } }
    else { bar=sc.querySelector(":scope>.lprog"); if(!bar){ bar=document.createElement("div"); bar.className="lprog"; bar.setAttribute("aria-hidden","true"); sc.prepend(bar); } }
    const fits=r.top>=vt-2&&r.bottom<=vb+2, p=Math.max(0,Math.min(1,(vb-r.top)/Math.max(1,r.height)));
    bar.style.transform="scaleX("+p.toFixed(4)+")"; bar.classList.toggle("off",fits||r.bottom<vt); }

/* ---------- DESLIZAR PARA TROCAR DE QUESTÃO ----------
   Só dedo (S Pen e mouse não), só na coluna da questão. Ignora: lição ao lado, folha aberta, área com Anotar ligado,
   tabelas/blocos que rolam de lado, imagens com zoom, divisórias, campos de texto, dois dedos e texto selecionado. */
(()=>{ let st=null, lastPT="";
  document.addEventListener("pointerdown",e=>{ lastPT=e.pointerType||""; },true);
  const hScroll=el=>{ for(let n=el;n&&n!==document.body;n=n.parentElement){ if(n.scrollWidth>n.clientWidth+2){ const o=getComputedStyle(n).overflowX; if(o==="auto"||o==="scroll") return true; } } return false; };
  document.addEventListener("touchstart",e=>{ st=null; if(e.touches.length!==1||!inQSession()) return; const t=e.touches[0], el=e.target;
    if(t.touchType==="stylus"||lastPT==="pen"||lastPT==="mouse") return;
    if(!el.closest||!el.closest("#view")||el.closest(".qlesson,.qdrag,.gdrag,.mpdrag,.gbox,input,textarea,select,[contenteditable],.ann-enabled:not(.ann-auto),.annbar,#lpFullBtn")) return;
    if($("#layer")?.innerHTML||document.body.classList.contains("mp-on")&&el.closest("#mpane")) return;
    if(t.clientX<24||t.clientX>innerWidth-24) return; // gesto de voltar do sistema
    if(hScroll(el)) return;
    st={x:t.clientX,y:t.clientY,t:Date.now(),max:0}; },{passive:true});
  document.addEventListener("touchmove",e=>{ if(!st) return; if(e.touches.length!==1){ st=null; return; } const t=e.touches[0]; st.max=Math.max(st.max,Math.abs(t.clientY-st.y)); },{passive:true});
  document.addEventListener("touchcancel",()=>{ st=null; },{passive:true});
  document.addEventListener("touchend",e=>{ const s0=st; st=null; if(!s0||!inQSession()) return; const t=e.changedTouches[0]; if(!t) return;
    // tolerante (pedido do Léo, 21/11): 35 px ou 4% da largura, ou um peteleco rápido (≥ 22 px a ≥ 0,3 px/ms);
    // até ~45° de inclinação pelo deslocamento final; até 1 s
    const dx=t.clientX-s0.x, ax=Math.abs(dx), dy=Math.abs(t.clientY-s0.y), dt=Math.max(1,Date.now()-s0.t);
    const flick=ax>=22&&ax/dt>=.3;
    if((!flick&&ax<Math.max(35,innerWidth*.04))||ax<1.1*dy||dt>1000) return;
    if(String(window.getSelection?.()||"").trim()) return;
    const b=$(dx<0?'#view [data-act="next"]':'#view [data-act="prev"]'); if(!b||b.disabled) return;
    b.click(); requestAnimationFrame(()=>($("#view .qgrid.l3>.qcol")||$("#view .qgrid"))?.classList.add("qsw")); },{passive:true});
})();
