<style>
/* Soft Light & Clean — paleta Tailwind (stone/zinc/teal/emerald/rose), cantos 2xl, sombras quase invisíveis, bordas mínimas */
:root{
  --bg:#F5F5F4;            /* stone-100 */
  --surface:#FFFFFF;       /* white */
  --surface-2:#F4F4F5;     /* zinc-100 */
  --pill:rgba(228,228,231,.5); /* zinc-200/50 */
  --ink:#18181B;           /* zinc-900 */
  --ink-2:#27272A;         /* zinc-800 */
  --muted:#71717A;         /* zinc-500 */
  --subtle:#A1A1AA;        /* zinc-400 */
  --line:#E4E4E7;          /* zinc-200 */
  --hair:rgba(24,24,27,.06);
  --accent:#0F766E;        /* teal-700 */
  --usmle:#4338CA; --usmle-soft:#EEF2FF; --usmle-line:#C7D2FE;  /* indigo 700/50/200 */
  --accent-ink:#FFFFFF;
  --accent-soft:#F0FDFA;   /* teal-50 */
  --ok:#059669; --ok-soft:#ECFDF5; --ok-bar:#6EE7B7;     /* emerald 600/50/300 */
  --bad:#E11D48; --bad-soft:#FFF1F2; --bad-bar:#FDA4AF;  /* rose 600/50/300 */
  --warn:#B45309; --warn-soft:#FFFBEB; --warn-line:#FDE68A; /* amber 700/50/200 */
  --shadow:0 1px 2px rgba(24,24,27,.04),0 1px 1px rgba(24,24,27,.02);
  --shadow-md:0 4px 24px rgba(24,24,27,.05);
  --glass:linear-gradient(135deg,rgba(204,251,241,.75) 0%,rgba(236,253,245,.7) 55%,rgba(240,253,250,.6) 100%);
  --f-display:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-ui:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"Inter", system-ui, sans-serif;
  --fs:1;
  --nav-h:66px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#09090B; --surface:#18181B; --surface-2:#27272A; --pill:rgba(63,63,70,.5); --ink:#F4F4F5; --ink-2:#E4E4E7; --muted:#A1A1AA; --subtle:#71717A; --line:#27272A; --hair:rgba(255,255,255,.06);
  --accent:#5EEAD4; --accent-ink:#042F2E; --accent-soft:#042F2E; --usmle:#A5B4FC; --usmle-soft:#1E1B4B; --usmle-line:#3730A3;
  --ok:#34D399; --ok-soft:#022C22; --ok-bar:#10B981; --bad:#FB7185; --bad-soft:#2A0A12; --bad-bar:#E11D48; --warn:#FCD34D; --warn-soft:#271A04; --warn-line:#78350F;
  --shadow:none; --shadow-md:none; --glass:linear-gradient(135deg,rgba(19,78,74,.55),rgba(6,78,59,.35)); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:calc(15px * var(--fs));line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%;align-content:start}
.top,main{min-width:0}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px;white-space:nowrap;color:var(--ink)}
.brand i{font-style:normal;color:var(--accent)}
/* página da lição: ✍ / 🔍 / 📖 na barra de cima, e o menu das canetas abre ali (27/11/2026, pedido do Léo) */
.toplsn{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;margin-left:8px} .toplsn[hidden],.toplsn-r[hidden]{display:none}
.toplsn-r{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
.toplsn .btn,.toplsn-r>.btn{min-height:38px;white-space:nowrap;flex:none} .toplsn>.btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tlann{display:flex;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none} .tlann:empty{display:none} .tlann::-webkit-scrollbar{display:none}
.topann{display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none} .topann[hidden]{display:none} .topann::-webkit-scrollbar{display:none}
.top #annHost.intop{display:flex;min-width:0}
.top #annHost.intop .ann-float{position:static!important;transform:none!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;max-width:none!important;width:max-content!important;margin:0!important;opacity:1!important;box-shadow:none}
.top #annHost.intop .ann-float [data-act="annToggle"]{display:none}
.top #annHost.intop .ann-float{gap:3px;padding:3px 5px;border-radius:14px;background:transparent} .top #annHost.intop .ann-lbl{display:none}
.top #annHost.intop .ann-float .btn{min-height:32px;padding:3px 7px;font-size:14px} .top #annHost.intop .ann-ic{width:19px;height:19px}
.top #annHost.intop .ann-color{width:24px;height:24px;min-width:24px} .top #annHost.intop .ann-size{width:28px;height:28px} .top #annHost.intop .ann-sep{margin:2px 1px}
body.toplsn-pen .toplsn-r .tl-lbl{display:none} /* o ✍ da barra de cima já liga/desliga */
body.toplsn-on .sync{display:none}
@media (max-width:1099px){.toplsn-r .tl-lbl{display:none}} @media (max-width:520px){.toplsn,.toplsn-r{gap:2px}.toplsn{margin-left:2px}.toplsn .btn,.toplsn-r>.btn{padding:6px 8px}}
.sync{font-size:11px;color:var(--subtle);margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:.02em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--subtle)}
.dot.on{background:#34D399} .dot.warn{background:#FBBF24}
.iconbtn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;color:var(--ink-2)}
.ctx{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
.ctx::-webkit-scrollbar{display:none}
.ctx:empty{display:none}
.sel{position:relative;flex:1 1 150px;min-width:0;max-width:360px}
.sel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--surface);border:0;box-shadow:var(--shadow),0 0 0 1px var(--hair);border-radius:999px;padding:9px 32px 9px 14px;width:100%;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--subtle);border-bottom:1.5px solid var(--subtle);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel .lab{position:absolute;left:-9999px}
.sel.per{flex:0 1 auto;max-width:170px}
.selbtn{font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--surface);border:0;box-shadow:var(--shadow),0 0 0 1px var(--hair);border-radius:999px;padding:9px 32px 9px 14px;width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ptop{display:flex;flex-direction:column;gap:10px;position:sticky;top:-14px;background:var(--surface);padding-top:2px;z-index:1}
.ptop h2{display:flex;align-items:center;gap:8px}
.psearch{font:inherit;font-size:15px;width:100%;padding:10px 14px;border-radius:12px;border:0;box-shadow:0 0 0 1px var(--hair);background:var(--surface);color:var(--ink)}
.plist{display:flex;flex-direction:column;gap:4px;margin-top:-6px}
details.pg{border-radius:14px}
details.pg>summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 4px 6px;cursor:pointer;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
details.pg>summary::-webkit-details-marker{display:none}
details.pg>summary span::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s}
details.pg[open]>summary span::before{transform:rotate(90deg)}
details.pg>summary small{text-transform:none;letter-spacing:0;font-weight:500}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;border:0;background:transparent;color:var(--ink);padding:10px 12px;border-radius:12px;cursor:pointer}
.prow:hover{background:var(--pill)}
.prow.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.prow[disabled]{opacity:.45;cursor:default}
.prow .pt{display:flex;flex-direction:column;min-width:0}
.prow .pt b{font-weight:500;font-size:14.5px}
.prow .pt small{color:var(--muted);font-size:12px;margin-top:1px}
.prow .pm{display:flex;align-items:center;gap:6px;flex:none}
.prow .pl{color:var(--accent);display:inline-flex}
.prow .pd{font-size:11.5px;font-weight:600;background:var(--ink);color:var(--surface);border-radius:999px;padding:2px 7px}
.prow .pp{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--pill)}
.prow .pp.good{color:#15803D}.prow .pp.mid{color:#B45309}.prow .pp.bad{color:#B91C1C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.pri.p3{background:#451A03;color:#FCD34D;box-shadow:0 0 0 1px #92400E inset}:root:not([data-theme="light"]) .prow .pp.good{color:#86EFAC}:root:not([data-theme="light"]) .prow .pp.mid{color:#FCD34D}:root:not([data-theme="light"]) .prow .pp.bad{color:#FCA5A5}}
:root[data-theme="dark"] .prow .pp.good{color:#86EFAC}:root[data-theme="dark"] .prow .pp.mid{color:#FCD34D}:root[data-theme="dark"] .prow .pp.bad{color:#FCA5A5}
.seg{display:inline-flex;background:var(--pill);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(24,24,27,.08)}
.seg button[data-std="usmle"][aria-pressed="true"]{color:var(--usmle);box-shadow:0 0 0 1px var(--usmle-line) inset,0 1px 3px rgba(67,56,202,.12)}
.tag.std.usmle{background:var(--usmle-soft);color:var(--usmle);box-shadow:0 0 0 1px var(--usmle-line) inset}
.ddot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
/* main */
main{padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:600;font-size:calc(26px * var(--fs));line-height:1.15;letter-spacing:-.025em;color:var(--ink)}
h2{font-family:var(--f-display);font-weight:600;font-size:calc(15px * var(--fs));line-height:1.3;letter-spacing:-.01em;color:var(--ink)}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--subtle)}
.lede{color:var(--muted);margin:4px 0 0;font-size:14px}
.panel{background:var(--surface);border:0;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.panel h2{margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--hair);color:var(--ink-2);border-radius:999px;padding:12px 20px;font-weight:500;cursor:pointer;min-height:46px;text-align:center;transition:transform .12s ease,box-shadow .15s ease,background .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--surface);box-shadow:0 1px 2px rgba(24,24,27,.12)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{min-height:36px;padding:7px 14px;font-size:13px}
.btn.danger{color:var(--bad);box-shadow:0 0 0 1px var(--bad-bar)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.block{width:100%}
.big{font-family:var(--f-display);font-weight:300;font-size:46px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--ink)}
/* KPIs */
/* Início: painel "o que fazer agora" (modos Provas UFPR × Steps USMLE) */
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.dash .dcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dhead .eyebrow{text-transform:none;letter-spacing:.02em;font-size:12px}
.modeseg button{padding:8px 14px;font-size:13px;font-weight:600}
.modeseg button[data-v="steps"][aria-pressed="true"]{color:var(--usmle);box-shadow:0 0 0 1px var(--usmle-line) inset}
.modeseg button:disabled{opacity:.45;cursor:default}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--dc,var(--accent)) 16%,var(--surface)),color-mix(in srgb,var(--dc,var(--accent)) 5%,var(--surface)));box-shadow:var(--shadow)}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,color-mix(in srgb,var(--dc,var(--accent)) 32%,#18181B),color-mix(in srgb,var(--dc,var(--accent)) 10%,#18181B))}
.hero .eyebrow{color:color-mix(in srgb,var(--dc,var(--accent)) 70%,var(--ink))}

.hrow{display:flex;align-items:center;gap:14px;margin:8px 0 4px}
.hrow .big{font-size:58px;font-weight:300}
.hl{display:flex;flex-direction:column;min-width:0}.hl b{font-size:17px;line-height:1.25}.hl small{color:var(--muted);font-size:12.5px}
.hbar{margin-top:10px;font-size:12.5px;color:var(--muted)}.hbar .track{margin-top:6px;height:8px}
.hsm{font-size:12.5px;color:var(--muted)}
.hnext{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--muted)}
.contbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;cursor:pointer;border-radius:20px;padding:16px 18px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 22px color-mix(in srgb,var(--accent) 28%,transparent)}
.m-steps .contbtn{background:var(--usmle);box-shadow:0 6px 22px color-mix(in srgb,var(--usmle) 28%,transparent)}
:root[data-theme="dark"] .m-steps .contbtn{color:#1E1B4B}
.recbox{display:flex;flex-direction:column;gap:6px}
details.recmore>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--muted);padding:4px 6px;width:max-content}details.recmore>summary::-webkit-details-marker{display:none}
details.recmore>summary::after{content:" ▾"}details.recmore[open]>summary::after{content:" ▴"}
.recl{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.recrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;cursor:pointer;border-radius:14px;padding:10px 14px;background:var(--surface);color:var(--ink);font:inherit;box-shadow:0 0 0 1px var(--hair) inset;min-height:48px}
.recrow span{display:flex;flex-direction:column;min-width:0}.recrow b{font-size:14px;font-weight:600}.recrow small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contbtn .ci{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);font-size:15px;flex:none}
.contbtn .ct{flex:1;min-width:0;display:flex;flex-direction:column}.contbtn .ct b{font-size:16px}.contbtn .ct small{opacity:.85;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contbtn .go{opacity:.8}
.kpis.today .v small{font-size:13px;font-weight:400;color:var(--muted)}
.errs .ev{font-size:15px;margin-top:4px}.errs .ev b{font-size:26px;font-weight:600;margin-right:2px;color:var(--bad)}
.etags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.heat{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hfill{flex:60 1 0;height:0}
.htile{min-width:110px;min-height:74px;border:0;cursor:pointer;text-align:left;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;
  background:hsl(var(--h) 70% 90%);color:hsl(var(--h) 60% 22%);box-shadow:inset 3px 0 0 var(--dc,transparent)}

.hleg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}.hleg i{width:10px;height:10px;border-radius:3px;background:hsl(var(--h) 65% 55%);display:inline-block;margin-left:6px}
.tct{font-size:16px;line-height:1.25}

.kpi{background:var(--surface);border-radius:16px;padding:16px 14px 14px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--f-display);font-weight:500;font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--ink)}

/* due card (vidro fosco) */

/* tingido pela cor da disciplina (--dc), quando definida */
.due.dc{background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 16%,#fff) 0%,color-mix(in srgb,var(--dc) 7%,#fff) 55%,color-mix(in srgb,var(--dc) 4%,#fff) 100%)}
.due.dc::before{background:radial-gradient(circle,color-mix(in srgb,var(--dc) 30%,transparent),transparent 70%)}

.due.dc .lede{color:color-mix(in srgb,var(--dc) 60%,var(--ink));opacity:.9}
.due.dc .btn.pill{box-shadow:0 1px 2px rgba(24,24,27,.06),0 4px 14px color-mix(in srgb,var(--dc) 18%,transparent)}
:root[data-theme="dark"] .due.dc{background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 30%,#18181B),color-mix(in srgb,var(--dc) 14%,#18181B))}
:root[data-theme="dark"] .due.dc .eyebrow,:root[data-theme="dark"] .due.dc .lede{color:color-mix(in srgb,var(--dc) 45%,#fff)}
.due .eyebrow{color:#0F766E;opacity:.75}
.due .big{color:var(--ink);margin-top:6px}
.due .lede{color:#115E59;opacity:.8}
.due .btn.pill{background:#FFFFFF;color:var(--ink);box-shadow:0 1px 2px rgba(24,24,27,.06),0 4px 14px rgba(15,118,110,.10);padding:12px 22px;font-weight:600;white-space:nowrap}
:root[data-theme="dark"] .due{border-color:rgba(255,255,255,.06)}
:root[data-theme="dark"] .due .eyebrow,:root[data-theme="dark"] .due .lede{color:#99F6E4}
:root[data-theme="dark"] .due .btn.pill{background:#F4F4F5;color:#18181B}
/* atalhos */
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:16px 16px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink-2);transition:transform .12s ease,box-shadow .15s ease}
.sc:hover{box-shadow:var(--shadow-md)}
.sc:active{transform:scale(.985)}
.sc .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--pill);display:grid;place-items:center;color:var(--ink-2)}
.sc .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sc .tx{min-width:0;flex:1}

.sc small{display:block;font-size:12px;color:var(--subtle);margin-top:1px}
.sc .go{flex:none;color:var(--subtle)}
.sc.main .ic{background:var(--ink);color:var(--surface)}
@media (min-width:700px){ .sc{flex-direction:column;align-items:flex-start;gap:12px;padding:18px} .sc .go{display:none} }
/* barras */
.bars{display:flex;flex-direction:column;gap:16px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 12px;align-items:baseline}
.bar-row .n{font-size:13.5px;font-weight:500;min-width:0;color:var(--ink-2)}
.bar-row .p{font-size:12px;font-weight:300;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar-row .p b{font-weight:500;color:var(--ink-2)}
.track{grid-column:1/-1;height:4px;border-radius:999px;background:var(--line);overflow:hidden;display:flex;gap:2px}
.track i{display:block;height:100%;border-radius:999px}
.track .ok{background:var(--ok-bar)} .track .bad{background:var(--bad-bar)}
.spark{display:flex;align-items:flex-end;gap:5px;height:72px;padding-top:6px}
.spark div{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%;min-width:0}
.spark i{display:block;border-radius:4px;background:var(--ok-bar)}
.spark i.b{background:var(--bad-bar)}
.spark-l{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin-top:6px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--ok-bar)}
.legend span.b::before{background:var(--bad-bar)}
/* forms */
.field{display:flex;flex-direction:column;gap:7px}
.field label,.flabel{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle)}
.field select,.field input,.field textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:0;box-shadow:0 0 0 1px var(--hair) inset;border-radius:14px;padding:11px 14px;min-height:46px;width:100%}
.field textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.lpex{display:flex;flex-direction:column;gap:6px}
.chip{border:0;background:var(--pill);color:var(--ink-2);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:500;transition:background .15s ease}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] span{color:color-mix(in srgb,var(--surface) 70%,transparent)!important}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.switch{position:relative;width:44px;height:26px;flex:none;border-radius:999px;background:var(--line);border:0;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--surface)}
/* question */
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qnum{font-weight:500;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* ← e Próxima junto da contagem (sem barra inferior); em sessão no modo foco a linha fica presa no topo */
.qtop-nav{gap:10px}
.qtop .qtn{min-height:42px;padding:6px 16px;font-size:14px;flex:none;white-space:nowrap}
.qtop .qtn.icon{width:44px;min-width:44px;padding:6px 0}
.qtop .qtn.primary{background:var(--accent);color:var(--accent-ink)}
.qtop .qtn:disabled{opacity:.4;cursor:default}
.qtop-nav{flex-wrap:nowrap}.qtop-nav .progress{min-width:24px}
.qgrid.l3>.qcol>.qtop-nav .qw{display:none}
body.focus.qnav-on #view>.qtop{position:sticky;top:0;z-index:8;background:var(--bg);margin:-6px 0 0;padding:max(6px,env(safe-area-inset-top,0px)) 0 8px}
@media(max-width:599px){ .qtop-nav{gap:8px;flex-wrap:wrap} .qtop-nav .qw{display:none} .qtop-nav .progress{order:9;flex:1 0 100%;min-width:0;height:3px} }
.progress{flex:1;min-width:80px;height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:999px}
.timer{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border:0;border-radius:999px;background:var(--pill);color:var(--muted);white-space:nowrap}
.qlang{display:inline-flex;border-radius:999px;box-shadow:0 0 0 1px var(--line) inset;overflow:hidden;flex:none}
.qlang button{font:500 10px/1 var(--f-ui);letter-spacing:.08em;padding:5px 10px;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:22px}
.qlang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tag.real{background:var(--warn-soft);color:var(--warn);box-shadow:0 0 0 1px var(--warn-line) inset}
.tag.gen{background:var(--bad-soft);color:var(--bad)}
.tag.exc{background:var(--accent-soft);color:var(--accent)}
.tag.pri{letter-spacing:.02em}.tag.pri.p3{background:#FEF3C7;color:#92400E;box-shadow:0 0 0 1px #FCD34D inset}.tag.pri.p1{opacity:.75}
.stars{font-size:12px;letter-spacing:.5px;color:#D97706;white-space:nowrap}.stars.p1{color:var(--subtle)}.stars.p2{color:#F59E0B}
.ess{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)}
.ess>div{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}.ess>div>b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px}
:root[data-theme="dark"] .tag.pri.p3{background:#451A03;color:#FCD34D;box-shadow:0 0 0 1px #92400E inset}
.tag.std{color:var(--ink-2)}
.stem{font-family:var(--f-read);font-size:calc(18px * var(--fs) * var(--qfs,1));line-height:1.65;margin:2px 0 0;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:0;box-shadow:var(--shadow),0 0 0 1px var(--hair);border-radius:18px;padding:15px 16px;cursor:pointer;transition:box-shadow .15s ease,background .15s ease}
@media(hover:hover) and (pointer:fine){.opt:not([disabled]):hover{box-shadow:var(--shadow-md),0 0 0 1px var(--line)}}
.opt[disabled]{cursor:default}
.opt.picked{box-shadow:0 0 0 1.5px var(--ink)}
.opt.correct{background:var(--ok-soft);box-shadow:0 0 0 1.5px var(--ok-bar)}
.opt.wrong{background:var(--bad-soft);box-shadow:0 0 0 1.5px var(--bad-bar)}
.orow{display:flex;gap:12px;align-items:baseline}
.letter{font-weight:600;font-size:13px;color:var(--subtle);flex:none;width:18px}
.opt.picked .letter{color:var(--ink)}
.opt.correct .letter{color:var(--ok)} .opt.wrong .letter{color:var(--bad)}
.otext{font-family:var(--f-read);font-size:calc(16.5px * var(--fs) * var(--qfs,1));line-height:1.55;min-width:0;flex:1;color:var(--ink)}
.mark{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;flex:none;align-self:center}
.opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--bad)}
.why{margin:12px 0 0 30px;padding-top:12px;border-top:1px solid var(--hair);font-size:calc(14.5px * var(--fs) * var(--qfs,1));line-height:1.6;color:var(--ink-2)}
.why .v{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;color:var(--bad)}
.opt.correct .why .v{color:var(--ok)}
.why .v.neutral{color:var(--subtle)}
.result{font-size:13px;font-weight:600}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
.box{border-radius:18px;padding:15px 16px;font-size:calc(14.5px * var(--fs) * var(--qfs,1));line-height:1.6}
.box h3{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}
.box.peg{background:var(--warn-soft);box-shadow:0 0 0 1px var(--warn-line) inset} .box.peg h3{color:var(--warn)}
.box.src{background:transparent;box-shadow:0 0 0 1px var(--line) inset;color:var(--muted);font-size:13px} .box.src h3{color:var(--subtle)}
.box.ai{background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--hair)} .box.ai h3{color:var(--accent)}
.box.note{background:var(--pill);font-size:13.5px}
.box.tutor{background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset} .box.tutor h3{color:var(--accent)} .box.tutor .md p{margin:.3em 0}
.tuhome .tuh-l{font-size:13.5px;margin:6px 0 2px;color:var(--ink-2)}
.tmsg{font-size:calc(14.5px * var(--fs));line-height:1.6} .tmsg p{margin:.4em 0}
.tblks{display:flex;flex-direction:column;gap:10px}
.tblk{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow),0 0 0 1px var(--hair)} .tblk.ok{opacity:.72}
.tbh{display:flex;gap:10px;align-items:flex-start} .tbn{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px} .tblk.ok .tbn{background:var(--ok-soft,var(--accent-soft))}
.tbt{display:flex;flex-direction:column;min-width:0} .tbt b{font-size:14.5px} .tbt small{font-size:12px;color:var(--muted)}
button.tbh{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:flex-start;cursor:pointer;-webkit-tap-highlight-color:transparent} button.tbh:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:10px} .tbh .tbt{flex:1} .tbh .go{align-self:center;color:var(--muted);display:inline-flex}
.tucrumb{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;min-width:0;font-size:12.5px;color:var(--muted);overflow:hidden}
.tucrumb .tcb{all:unset;cursor:pointer;padding:5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto} .tucrumb .tch{flex:0 0 auto}
.tucrumb .tcb:focus-visible{outline:2px solid var(--accent)} .tucrumb .tcs{flex:0 0 auto;opacity:.6} .tucrumb .tcc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;color:var(--ink-2)}
@media (max-width:520px){ .tucrumb .tct{display:none} }
.tbmain{gap:8px;flex-wrap:wrap} .tbnav{justify-content:space-between;gap:8px}
ol.tbq{list-style:none;margin:6px 0 0;padding:0;counter-reset:tq} ol.tbq li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--hair);font-size:13px;line-height:1.4} ol.tbq li:first-child{border-top:0}
.tbqs{flex:0 0 18px;text-align:center;font-weight:700;color:var(--muted)} li.ok .tbqs{color:var(--ok,#2e7d32)} li.bad .tbqs{color:var(--bad,#c62828)} .tbqt{flex:1;min-width:0;color:var(--ink-2)} ol.tbq .stars{flex:0 0 auto;font-size:11px}
.tbw{font-size:13px;color:var(--ink-2);margin:6px 0 0 36px;line-height:1.5} .tbw p{margin:.2em 0}
.tweak{padding:8px 0;border-top:1px solid var(--hair);font-size:13.5px} .tweak:first-of-type{border-top:0} .tweak .md p{margin:.2em 0;color:var(--ink-2)}
.md p{margin:0 0 8px} .md ul,.md ol{margin:0 0 8px;padding-left:20px} .md h4{margin:10px 0 4px;font-size:14px} .md table{border-collapse:collapse;font-size:13px} .md td,.md th{border:1px solid var(--line);padding:4px 6px}
.mdwrap{overflow-x:auto}
.qnav{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:10px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 0;z-index:5}
#view:has(.qnav){padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.qnav .btn{flex:1}
.qnav .btn.icon{flex:none;min-width:52px}
/* flashcard */
.card{background:var(--surface);border:0;box-shadow:var(--shadow-md);border-radius:24px;padding:24px 22px;min-height:260px;display:flex;flex-direction:column;gap:14px}
.card .face{font-family:var(--f-read);font-size:calc(18px * var(--fs));line-height:1.6}
.card .ans{border-top:1px solid var(--hair);padding-top:14px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:2px;font-size:13px;border-radius:18px}
.rate small{font-size:10.5px;color:var(--subtle);font-weight:400}
/* list */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 0;border-top:1px solid var(--hair);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.srx{grid-column:1/-1;font-size:12.5px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
mark.srh{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px var(--accent-soft)}
.lesson>h2,mark.srh{scroll-margin-top:96px}
mark.lfh{background:color-mix(in srgb,#FACC15 55%,transparent);color:inherit;border-radius:2px;padding:0;scroll-margin:96px 0}
mark.lfh.cur{background:#F59E0B;color:#1a1a1a;box-shadow:0 0 0 2px #F59E0B}
#lfBar{position:fixed;z-index:75;transform:translateX(-50%);display:flex;align-items:center;gap:4px;width:min(440px,calc(100vw - 16px));padding:4px 4px 4px 10px;border-radius:999px;background:var(--surface);box-shadow:0 4px 18px rgba(0,0,0,.18),0 0 0 1px var(--hair)}
#lfBar input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;font-size:16px;padding:6px 2px;outline:none}
#lfBar input::-webkit-search-cancel-button{display:none}
#lfBar .lfc{font-size:12px;color:var(--muted);white-space:nowrap}#lfBar .lfc.bad{color:var(--bad)}
#lfBar .btn{min-height:32px;padding:3px 9px}
details.srt{border-top:1px solid var(--hair)} details.srt:first-child{border-top:0}

details.srt>summary small{font-size:12px;color:var(--muted);text-align:right}

.li .t{font-family:var(--f-read);font-size:15px;line-height:1.45;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.li .m{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
a.li{text-decoration:none;color:inherit}
.tlinks summary{cursor:pointer;list-style-position:inside}
/* painel do material de apoio (Drive /preview) à direita, telas >=1000px */
#mpane{display:none}
@media (min-width:1000px){
  body.mp-on{--mpw:var(--mpwu,clamp(420px,46vw,980px))}
  body.mp-on .shell{margin-right:var(--mpw)}
  body.mp-on #mpane{display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;width:var(--mpw);z-index:40;background:var(--surface);border-left:1px solid var(--hair);box-shadow:var(--shadow)}
  #mpane .mph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--hair)}
  #mpane .mph b{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #mpane .mph small{color:var(--muted);white-space:nowrap}
  #mpane .mpfb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--hair);font-size:12px;color:var(--muted)}
  #mpane .mpfb span{flex:1;min-width:160px}
  #mpane .mpbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
  #mpane .mpbody iframe{flex:1}
  #mpane iframe{flex:1;width:100%;border:0;background:var(--bg)}
  #mpane .mpdrag{position:absolute;left:-12px;top:0;bottom:0;width:24px;cursor:col-resize;touch-action:none;z-index:2}
  #mpane .mpdrag::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--line);transition:background .15s}
  #mpane .mpdrag::after{content:"";position:absolute;left:7px;top:50%;width:10px;height:56px;margin-top:-28px;border-radius:6px;background:var(--surface);box-shadow:0 0 0 1.5px var(--line),var(--shadow);transition:background .15s,box-shadow .15s}
  #mpane .mpdrag:hover::before,body.mp-drag #mpane .mpdrag::before{background:var(--accent)}
  #mpane .mpdrag:hover::after,body.mp-drag #mpane .mpdrag::after{background:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
  body.mp-drag #mpane iframe{pointer-events:none}

const FSRS={ w:[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621],

  d0(g){ const w=this.w; return this.clampD(w[4]-Math.exp(w[5]*(g-1))+1); },
  ret(t,s){ return Math.pow(1+this.F*t/s, this.DEC); },
  ivl(s){ return Math.min(this.MAX, Math.max(1, Math.round(s/this.F*(Math.pow(this.R,1/this.DEC)-1)))); },
  // r: registro existente (pode ser legado, com box/due), g: 1 errei · 2 difícil · 3 acertei/bom · 4 fácil; t: agora
  next(r, g, t){ const w=this.w; let s=r.s, d=r.d; const last=r.lr||r.ts;
    if(s==null && r.box!=null && last){ s=Math.max(0.5, INTERVALS[r.box]||0.5); d=5; } // migração do sistema antigo
    if(s==null){ s=w[g-1]; d=this.d0(g); }
    else { const el=Math.max(0,(t-last)/DAY);
      if(el<1){ s=s*Math.exp(w[17]*(g-3+w[18])); }

      const dd=d+(-w[6]*(g-3))*(10-d)/9; d=this.clampD(w[7]*this.d0(4)+(1-w[7])*dd); }

/* ---------- SINCRONIZAÇÃO CELULAR × TABLET ----------
   Une dois progressos registro a registro, em vez de um aparelho sobrescrever o outro inteiro:
   questões/flashcards/marcas/anotações → o registro mais novo de cada id; respostas (ev) → união sem repetir;
   dia do histórico → o que tem mais respostas; simulados/contestações → união. "Zerar progresso" grava
   settings.resetAt e tudo que é anterior a ele é descartado dos dois lados. Configurações: as do aparelho
   que tem alterações ainda não enviadas (localSet), senão as da nuvem. */
const NAV_SET=["qfs","per","disc","topic","sub","std","perP","stdP","discP","topicP","topicS","revScope"];
function syncMerge(L,R,localSet){ L=L||{}; R=R||{};
  const rs=Math.max(+L.settings?.resetAt||0,+R.settings?.resetAt||0), rsDay=rs?dayKey(new Date(rs)):"";
  const newer=(a,b)=>{ const o={}; for(const src of [a||{},b||{}]) for(const [k,v] of Object.entries(src)){ if(rs&&(+v?.ts||0)<rs) continue; const c=o[k]; if(!c||(+v?.ts||0)>(+c?.ts||0)) o[k]=v; } return o; };
  const em=new Map(); for(const e of [...(L.ev||[]),...(R.ev||[])]){ if(!Array.isArray(e)||(rs&&e[0]*1000<rs)) continue; em.set(e[0]+"|"+e[1],e); }
  const ev=[...em.values()].sort((a,b)=>a[0]-b[0]); if(ev.length>20000) ev.splice(0,ev.length-20000);
  const log={}; for(const src of [L.log||{},R.log||{}]) for(const [k,v] of Object.entries(src)){ if(rsDay&&k<rsDay) continue; const c=log[k]; if(!c||(+v?.n||0)>(+c.n||0)) log[k]=v; }
  const uni=(a,b,key)=>{ const m=new Map(); for(const x of [...(a||[]),...(b||[])]) if(x&&!(rs&&(+x.ts||0)&&x.ts<rs)) m.set(key(x),x); return [...m.values()]; };
  const settings=localSet?Object.assign({},R.settings||{},L.settings||{}):Object.assign({},L.settings||{},R.settings||{}); if(rs) settings.resetAt=rs;

  // (a nuvem só serve de ponto de partida para um aparelho novo, que ainda não tem nenhum)
  const Ls=L.settings||{}; if(NAV_SET.some(k=>Ls[k]!=null)) NAV_SET.forEach(k=>{ if(Ls[k]!=null) settings[k]=Ls[k]; else delete settings[k]; });
  return {settings, q:newer(L.q,R.q), fc:newer(L.fc,R.fc), log, ev,
    sims:uni(L.sims,R.sims,x=>x.ts+"|"+(x.topic||x.exam||"")).sort((a,b)=>(a.ts||0)-(b.ts||0)), reports:uni(L.reports,R.reports,x=>x.id||JSON.stringify(x)),
    read:Object.assign({},L.read||{},R.read||{}), marked:mergeStampedMap(L.marked,R.marked), better:mergeStampedMap(L.better,R.better), exr:mergeStampedMap(L.exr,R.exr), annotations:mergeStampedMap(L.annotations,R.annotations),
    tutor:Object.assign({},L.tutor||{},R.tutor||{})}; }

  for(const raw of lines){ const l=raw.trim();
    if(/^\|.*\|$/.test(l)){ if(/^\|[\s:|-]+\|$/.test(l)) continue; if(list) flush(); (tbl=tbl||[]).push(l.slice(1,-1).split("|").map(c=>c.trim())); continue; }

  return [["s1","Step 1"],["s2","Step 2 CK"]].filter(([k])=>o[k]).map(([k,n])=>{ const dt=startOfDay(new Date(o[k]+"T12:00:00").getTime()); return {k,n,dt,days:Math.round((dt-today)/DAY)}; }).filter(x=>x.days>=0).sort((a,b)=>a.dt-b.dt); }
function heroHTML(qs){
  if(curMode()==="steps"){ const sd=stepDates()[0]; const seen=qs.filter(q=>rec(q.id)), ok=seen.filter(q=>rec(q.id).ok);
    return `<div class="hero" style="--dc:var(--usmle)"><div class="eyebrow">${sd?esc(sd.n):T2("Próximo Step","Next Step")}</div>
      ${sd?`<div class="hrow"><div class="big">${sd.days}</div><div class="hl"><b>${T2(sd.days===1?"dia":"dias",sd.days===1?"day":"days")}</b><small>${fmtDM(sd.dt)} · <a href="#" data-act="stepDate">${T2("alterar","change")}</a></small></div></div>`
        :`<p class="lede" style="margin:6px 0 10px">${T2("Sem data marcada.","No date set.")}</p><button class="btn small primary" data-act="stepDate">${T2("Definir data do Step","Set Step date")}</button>`}
      <div class="hbar"><div class="row" style="justify-content:space-between"><span>UWorld · ${seen.length}/${qs.length} ${T2("feitas","done")}</span><span>${T2("acerto","accuracy")} <b>${pct(ok.length,seen.length)}</b></span></div>
      <div class="track"><i class="ok" style="width:${qs.length?100*ok.length/qs.length:0}%"></i><i class="bad" style="width:${qs.length?100*(seen.length-ok.length)/qs.length:0}%"></i></div></div></div>`; }
  const xs=examReadiness(), x=xs[0]; if(!x) return `<div class="hero"><div class="eyebrow">${T2("Próxima prova","Next exam")}</div><p class="lede" style="margin:6px 0 0">${T2("Nenhuma prova com data neste período.","No dated exam in this term.")}</p></div>`;
  return `<div class="hero" style="--dc:${discColor(x.d)}"><div class="eyebrow">${ddot(x.d)}${T2("Próxima prova","Next exam")}</div>
    <div class="hrow"><div class="big">${x.days}</div><div class="hl"><b>${esc(nm(x.d))}</b><small>${esc(nm(x.ex))} · ${T2(x.days===1?"dia":"dias",x.days===1?"day":"days")}</small></div></div>
    ${x.e3?`<div class="hbar"><div class="row" style="justify-content:space-between"><span>★★★ ${x.e3s}/${x.e3} ${T2("feitas","done")}</span><span>${T2("acerto","accuracy")} <b>${pct(x.e3o,x.e3s)}</b></span></div>
      <div class="track"><i class="ok" style="width:${100*x.e3o/x.e3}%"></i><i class="bad" style="width:${100*(x.e3s-x.e3o)/x.e3}%"></i></div></div>`:""}
    <div class="row" style="justify-content:space-between;margin-top:10px;gap:8px"><span class="hsm">${T2("Prova toda","Whole exam")}: ${x.seen}/${x.n} · ${pct(x.ok,x.seen)}${x.unseen?` · ${T2("meta","goal")} ${x.meta}/${T2("dia","day")}`:""}</span>
      ${x.e3?`<button class="btn small" data-act="examEssentials" data-d="${esc(x.d.id)}" data-ex="${esc(x.ex.id)}">${x.e3s<x.e3?T2("Trilha ★★★","★★★ track"):T2("Revisar erros","Review misses")}</button>`:""}</div>
    ${xs.length>1?`<div class="hnext">${xs.slice(1,3).map(y=>`<span>${ddot(y.d)}${esc(nm(y.d))} · ${esc(y.ex.id)} <b>${y.days}d</b></span>`).join("")}</div>`:""}</div>`; }
// botão principal: sessão aberta → bloco do Tutor (do modo) → revisões do dia → novas questões
function contTarget(){ const s=S.session;
  if(s&&!s.done&&s.items?.length){ const q0=S.qs.get(s.items[Math.min(s.i||0,s.items.length-1)]?.id), d0=q0&&discById(q0.discipline), t0=d0&&(d0.topics||[]).find(x=>x.id===q0.topic);
    return {act:"contSession",b:T2("Continuar","Resume")+` · ${T2("questão","question")} ${Math.min(s.i+1,s.items.length)} ${T2("de","of")} ${s.items.length}`,s:d0?nm(d0)+(t0?" · "+nm(t0):""):""}; }
  const P=tutorPlan(); if(P&&tutorFresh(P)){ const sm=tutorSum(P); const i=(P.blocks||[]).findIndex((b,i)=>!sm.pr[i].done&&tbVis(b)&&((b.type==="lesson"&&S.lessons.get(b.lesson))||(b.type!=="lesson"&&b.type!=="task"&&tbIds(b).length)));
    if(i>=0){ const b=P.blocks[i]; return {act:b.type==="lesson"?"tutorLesson":"tutorBlock",i,b:T2("Continuar plano do Tutor","Continue tutor plan"),s:`${i+1}/${sm.total} · ${b.title||""}${b.min?` · ~${b.min} min`:""}`}; } }
  const due=dueQs().length; if(due) return {act:"startReview",b:T2("Revisões de hoje","Today's reviews"),s:`${due} ${T2("questões","questions")} · ${esc(scopeLabel())}`};
  return {act:"quick",mode:"study",b:T2("Estudar agora","Study now"),s:`${T2("10 questões","10 questions")} · ${esc(nm(curTopic()))}`}; }
/* ---------- PRÓXIMA AÇÃO (recomendação única da Início) ----------
   Junta os sinais que antes ficavam espalhados (sessão aberta, plano do Tutor, prova próxima, revisões vencidas,
   erros pendentes, competência fraca) numa pontuação simples. O primeiro vira o botão grande, com o motivo;
   "Escolher outro" mostra os demais. Pesos: sessão aberta > Tutor > ★★★ de prova em ≤14 dias > revisões/erros/competência > novas. */
function recCands(){ const C=[], c0=contTarget(), steps=curMode()==="steps";
  if(c0.act==="contSession"||c0.act==="tutorLesson"||c0.act==="tutorBlock") C.push(Object.assign({sc:c0.act==="contSession"?1000:300,why:c0.act==="contSession"?T2("sessão em andamento","session in progress"):T2("plano de hoje do Tutor","today's tutor plan")},c0));
  if(!steps){ const x=examReadiness()[0]; if(x&&x.e3&&x.days<=14&&(x.e3s<x.e3||x.e3o<x.e3s))
    C.push({sc:200+(14-x.days)*10, act:"examEssentials", d:x.d.id, ex:x.ex.id, b:(x.e3s<x.e3?T2("Trilha ★★★","★★★ track"):T2("Erros da trilha ★★★","★★★ misses"))+" · "+nm(x.d), s:`${x.e3s}/${x.e3} ${T2("feitas","done")}`, why:`${nm(x.ex)} ${T2("em","in")} ${x.days} ${T2(x.days===1?"dia":"dias",x.days===1?"day":"days")}`}); }
  const due=dueQs().length; if(due) C.push({sc:100+Math.min(due,50)*2, act:"startReview", b:T2("Revisões de hoje","Today's reviews"), s:`${due} ${T2("questões","questions")} · ${scopeLabel()}`, why:T2("vencidas na revisão espaçada","due for spaced review")});
  const bad=modeQs().filter(q=>status(q.id)==="bad").length; if(bad) C.push({sc:80+Math.min(bad,30)*2, act:"dashErrors", b:T2("Refazer erros","Redo misses"), s:`${bad} ${T2(bad===1?"questão errada":"questões erradas",bad===1?"missed question":"missed questions")}`, why:T2("errou e ainda não acertou","missed and not yet fixed")});
  try{ const X=cxState(), r=X&&cxRank()[0], st=r&&X.M.get(r.id); if(st&&st.status==="fraco") C.push({sc:90+Math.round((1-(st.m||0))*60), act:"cxTrain", c:r.id, b:T2("Treinar","Train")+" · "+X.G.N.get(r.id).n, s:`${T2("domínio","mastery")} ${cxPct(st)}`, why:T2("competência mais fraca","weakest competency")}); }catch(_){}
  if(c0.act==="quick") C.push(Object.assign({sc:50,why:T2("questões novas do tema","new questions in this topic")},c0)); else C.push({sc:40,act:"quick",mode:"study",b:T2("Questões novas","New questions"),s:`10 · ${nm(curTopic())}`,why:T2("questões novas do tema","new questions in this topic")});
  const seen=new Set(); return C.sort((a,b)=>b.sc-a.sc).filter(c=>{ const k=c.act+(c.c||"")+(c.ex||""); if(seen.has(k)) return false; seen.add(k); return true; }); }
function recAttrs(c){ return `data-act="${c.act}"${c.i!=null?` data-i="${c.i}"`:""}${c.mode?` data-mode="${c.mode}"`:""}${c.d?` data-d="${esc(c.d)}"`:""}${c.ex?` data-ex="${esc(c.ex)}"`:""}${c.c?` data-c="${esc(c.c)}"`:""}`; }
function contHTML(){ const R=recCands(), c=R[0], rest=R.slice(1,5);
  return `<div class="recbox"><button type="button" class="contbtn" ${recAttrs(c)}><span class="ci">▶</span><span class="ct"><b>${esc(c.b)}</b><small>${esc(c.s)}</small>${c.why?`<small class="why">${T2("Por quê","Why")}: ${esc(c.why)}</small>`:""}</span><span class="go">${CHEV}</span></button>
    ${rest.length?`<details class="recmore"><summary>${T2("Escolher outro","Pick something else")}</summary><div class="recl">${rest.map(x=>`<button type="button" class="recrow" ${recAttrs(x)}><span><b>${esc(x.b)}</b><small>${esc(x.s)}${x.why?" · "+esc(x.why):""}</small></span>${CHEV}</button>`).join("")}</div></details>`:""}</div>`; }
function todayHTML(){ const t=todayStats();
  return `<div class="kpis today"><div class="kpi"><div class="v">${t.n}</div><div class="l">${T2("questões hoje","today")}</div></div>
    <div class="kpi"><div class="v">${t.n?Math.round(100*t.ok/t.n)+"%":"—"}</div><div class="l">${T2("acerto hoje","accuracy")}</div></div>
    <div class="kpi"><div class="v">${t.min}<small> min</small></div><div class="l">${t.streak?`🔥 ${t.streak} ${T2(t.streak===1?"dia":"dias",t.streak===1?"day":"days")}`:T2("estudados","studied")}</div></div></div>`; }
function errorsHTML(qs){ const bad=qs.filter(q=>status(q.id)==="bad"); const due=dueQs().length; const by={};
  for(const q of bad){ const k=curMode()==="steps"?q.topic:q.discipline; by[k]=(by[k]||0)+1; }
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,n])=>{ const lab=curMode()==="steps"?nm((discById(bad.find(q=>q.topic===k)?.discipline)?.topics||[]).find(t=>t.id===k)||{name:{pt:k,en:k}}):nm(discById(k)||{name:{pt:k,en:k}}); return `<span class="tag">${esc(lab)} · ${n}</span>`; }).join("");
  return `<div class="panel errs"><div class="row" style="justify-content:space-between;gap:10px;flex-wrap:nowrap"><div><div class="eyebrow">${T2("Erros para rever","Misses to review")}</div>
    <div class="ev"><b>${bad.length}</b> ${T2(bad.length===1?"erro pendente":"erros pendentes",bad.length===1?"pending miss":"pending misses")}</div></div>
    ${bad.length?`<button class="btn small primary" data-act="dashErrors">${T2("Rever","Review")}</button>`:""}</div>
    ${top?`<div class="etags">${top}</div>`:""}
    ${due?`<div class="row" style="justify-content:space-between;margin-top:10px"><span class="hsm">${T2("Revisões FSRS hoje","FSRS due today")} · ${esc(scopeLabel())}: <b>${due}</b></span><button class="btn small" data-act="startReview">${T2("Revisar","Review")}</button></div>`:""}</div>`; }
// mapa de calor: provas = disciplinas do período (tamanho pelas ★★★); steps = sistemas UWorld (tamanho pelo nº de questões)
function heatHTML(qs){ const steps=curMode()==="steps", agg=new Map();
  for(const q of qs){ const k=steps?q.discipline+"|"+q.topic:q.discipline; let a=agg.get(k); if(!a) agg.set(k,a={n:0,seen:0,ok:0,e3:0}); a.n++; if(priOf(q)===3) a.e3++; const r=rec(q.id); if(r){ a.seen++; if(r.ok) a.ok++; } }
  const items=[]; if(steps){ for(const d of discs()) for(const t of (d.topics||[])){ const a=agg.get(d.id+"|"+t.id); if(a) items.push({id:t.id,d:d.id,lab:nm(t),a,w:a.n}); } }
  else for(const d of discs()){ const a=agg.get(d.id); if(a) items.push({id:d.id,d:d.id,lab:nm(d),a,w:a.e3||a.n/3,c:discColor(d)}); }
  if(!items.length) return "";
  items.sort((x,y)=>y.w-x.w); const mx=Math.max(...items.map(x=>x.w));
  const tiles=items.map(x=>{ const acc=x.a.seen?x.a.ok/x.a.seen:null, h=acc==null?null:Math.round(Math.max(0,Math.min(1,(acc-.4)/.45))*130);
    return `<button type="button" class="htile${acc==null?" nv":""}" style="flex:${(1+2*x.w/mx).toFixed(2)} 1 ${Math.round(110+130*x.w/mx)}px;${h!=null?`--h:${h};`:""}${x.c?`--dc:${x.c}`:""}" data-act="dashTile" data-d="${esc(x.d)}" data-t="${steps?esc(x.id):""}" title="${esc(x.lab)}">
      <b>${esc(x.lab)}</b><span>${acc==null?T2("não iniciada","not started"):Math.round(100*acc)+"%"}</span><small>${x.a.seen}/${x.a.n}${!steps&&x.a.e3?` · ★★★ ${x.a.e3}`:""}</small></button>`; }).join("");
  return `<div class="panel"><div class="row" style="justify-content:space-between"><div class="eyebrow">${steps?T2("Sistemas · acerto","Systems · accuracy"):T2("Disciplinas · acerto","Disciplines · accuracy")}</div>
    <div class="hleg"><i style="--h:0"></i>${T2("fraco","weak")}<i style="--h:130"></i>${T2("forte","strong")}</div></div>
    <div class="heat">${tiles}<i class="hfill" aria-hidden="true"></i></div><p class="hsm" style="margin:8px 2px 0">${steps?T2("Tamanho = nº de questões.","Size = number of questions."):T2("Tamanho = nº de questões ★★★ (peso na prova).","Size = ★★★ count (exam weight).")}</p></div>`; }

    <button class="btn small" data-act="topicPick">${T2("Trocar tema","Change topic")}</button></div>
    ${!t.pseudo?`<div class="row" style="margin-top:10px">${lessonOf(d.id,t.id)?lessonBtn(d.id,t.id):lessonReqBtn(d.id,t.id)}</div>${topicLinksHTML(t)}`:""}

function sourcesHTML(){ const steps=curMode()==="steps"; const ps=[...S.qs.values()].filter(perOk);
  if(steps){ const n=ps.filter(q=>q.standard==="usmle").length;
    return `<div class="srcs"><div class="src"><b>UWorld</b><span>${n} ${T2("questões","questions")} · ${discs().reduce((s,d)=>s+(d.topics||[]).length,0)} ${T2("sistemas","systems")}</span></div>

function discListHTML(){ const steps=curMode()==="steps"; const cnt=new Map(); for(const q of S.qs.values()){ if(!stdOk(q)) continue; const k=steps?q.topic:q.discipline; cnt.set(k,(cnt.get(k)||0)+1); }

  return `<div class="list">${rows.map(r=>`<button type="button" class="li" data-act="dashTile" data-d="${esc(r.d)}" data-t="${esc(r.t)}"><span class="t"><i class="ddot" style="background:${r.c}"></i>${esc(r.lab)}</span><span class="st">${r.n} q</span></button>`).join("")}</div>`; }

function buildSession(kind, list, su){

  if(su.count) qs = qs.slice(0, su.count);
  const items = qs.map(q=>({id:q.id, perm: (su.shuffleO && q.origin!=="real") ? shuffle([...Array((q.i18n.pt||q.i18n.en).opts.length).keys()]) : [...Array((q.i18n.pt||q.i18n.en).opts.length).keys()], pick:null}));
  return {kind, mode: kind==="review"?"study":su.mode, items, i:0, t0:now(), done:false, std:set().std, topic:curTopic()?.id};
}

function sqRvTag(art,dId){ const d=discById(dId); const norm=x=>String(x||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim(); let cur=null;

    const tx=(el.firstChild?.textContent||el.textContent).trim(), num=(tx.match(/^\s*(\d{1,2})\s/)||[])[1];
    const t=(d?.topics||[]).find(x=>num?Number((nm(x).match(/^\s*(\d{1,2})\s/)||[])[1])===Number(num):norm(nm(x))===norm(tx)); cur=t?t.id:null; if(t) el.dataset.tp=t.id; } }
function sqRvMark(scroll){ const s=S.session, art=$("#view .sqwrap .qlesson article.lesson.review"); if(!s||!art) return; const q0=S.qs.get(s.items[0]?.id); if(!q0) return;

  art.querySelectorAll(".sqr-ok,.sqr-bad,.sqr-cur,.sqr-mk,.sqh-cur").forEach(x=>x.classList.remove("sqr-ok","sqr-bad","sqr-cur","sqr-mk","sqh-cur")); art.querySelectorAll("td[data-sq]").forEach(x=>x.removeAttribute("data-sq"));

  for(const [r,L] of M){ const td=r.querySelector("td"); if(td) td.dataset.sq=L.map(i=>{ const it=s.items[i], q=S.qs.get(it.id); return "Q"+(i+1)+(it.pick===null?"":s.mode!=="study"?" •":it.pick===q?.correct?" ✓":" ✗"); }).join("  ");
    r.classList.add("sqr-mk"); const an=L.filter(i=>s.items[i].pick!==null); if(s.mode==="study"&&an.length){ const bad=an.some(i=>s.items[i].pick!==S.qs.get(s.items[i].id)?.correct); r.classList.add(bad?"sqr-bad":"sqr-ok"); } }
  const cq=S.qs.get(s.items[s.i]?.id), cr=rowOf(s.i); let tgt=cr; if(cr) cr.classList.add("sqr-cur");
  else if(cq){ const h=art.querySelector('h2[data-tp="'+CSS.escape(cq.topic)+'"],h3[data-tp="'+CSS.escape(cq.topic)+'"]'); if(h){ h.classList.add("sqh-cur"); tgt=h; } }
  if(scroll&&tgt){ const sc=tgt.closest(".qlbody"); if(!sc) return; const a=sc.getBoundingClientRect(), r=tgt.getBoundingClientRect(); if(r.top<a.top+40||r.bottom>a.bottom-40) sc.scrollBy({top:r.top-a.top-Math.min(140,a.height*.25),behavior:"smooth"}); } }

function sqTopPos(){ const h=$("#view .sqtop"); if(!h) return; const tb=$(".top"); const y=!sqScroller()&&tb&&getComputedStyle(tb).display!=="none"&&getComputedStyle(tb).position==="sticky"?Math.round(tb.getBoundingClientRect().height):0; h.style.top=y+"px"; }
function sqStripCur(){ const s=S.session; const cu=$("#sqcur"); if(cu) cu.textContent=`${tr("q")} ${s.i+1}/${s.items.length}`;

{ let raf=0; document.addEventListener("scroll",()=>{ if(raf||!S.session?.scroll) return; raf=requestAnimationFrame(()=>{ raf=0; sqTrack(); }); },{passive:true,capture:true}); window.addEventListener("resize",()=>{ if(S.session?.scroll){ sqTopPos(); } }); }

function pickKeep(y0,find){ if(y0==null) return; const fix=()=>{ const el=find(); if(!el) return; const d=el.getBoundingClientRect().top-y0; if(Math.abs(d)<1) return; let sc=el.parentElement; while(sc&&sc!==document.body&&sc!==document.documentElement){ const o=getComputedStyle(sc).overflowY; if((o==="auto"||o==="scroll")&&sc.scrollHeight>sc.clientHeight) break; sc=sc.parentElement; } if(sc&&sc!==document.body&&sc!==document.documentElement) sc.scrollTop+=d; else window.scrollBy(0,d); }; const pos=()=>window.scrollY+"|"+($("#view .sqwrap>.qcol")?.scrollTop||0); fix(); const p0=pos(); requestAnimationFrame(()=>{ if(pos()===p0) fix(); }); }
function sqPick(sec,p){ const s=S.session, i=+sec.dataset.i, it=s.items[i], q=S.qs.get(it?.id); if(!q) return;
  const pb=sec.querySelector('[data-pick="'+p+'"]'), y0=pb?pb.getBoundingClientRect().top:null; it.pick=p; if(s.mode==="study") record(q,p,{rev:false, ms:it.t0?now()-it.t0:null}); exrPick(q,p);
  if(s.i!==i){ s.i=i; } sec.outerHTML=sqItem(s,i); const ns=$("#view #sq-"+i), asf=ns?.closest("[data-ann-surface]"); if(asf) annInit(asf);
  const sc=$("#sqsc"); if(sc) sc.innerHTML=sqScore(s); const st=$("#sqstrip"); if(st){ const x=st.scrollLeft; st.innerHTML=sqStrip(s); st.scrollLeft=x; }
  const ra=$("#view .sqwrap .qlesson article.lesson.review"); if(ra&&ra._m){ ra._m[i]=undefined; sqRvMark(false); }
  hydrateAI(q); posSave(); pickKeep(y0,()=>$("#view #sq-"+i+' [data-pick="'+p+'"]')); }

function questionHTML(q, it, reveal, simMode, sc){ // sc = prova em página única (rolagem)
  const lsnRow=!simMode&&lessonOf(q.discipline,q.topic); // botão "Lição do tema" junto da explicação, sem precisar subir até as etiquetas
  const {c, lang, fallback} = content(q); if(!c) return "";

  if(c.outdated) tags.push(`<span class="tag old">${set().lang==="en"?"Outdated":"Defasada"}</span>`);
  if(q.exc) tags.push(`<span class="tag exc">${set().lang==="en"?"Except / incorrect":"Exceto / incorreta"}</span>`);
  const qlb = (q.i18n?.pt&&q.i18n?.en) ? `<span class="qlang" role="group" aria-label="${T2("Idioma da questão","Question language")}">${["pt","en"].map(x=>`<button type="button" data-act="qlang" data-q="${esc(q.id)}" data-v="${x}" aria-pressed="${lang===x}" title="${x==="pt"?T2("Ver em português (I)","Show in Portuguese (I)"):T2("Ver em inglês (I)","Show in English (I)")}">${x.toUpperCase()}</button>`).join("")}</span>` : "";
  const det = true; // 22/11/2026: só existe a justificativa aprofundada (enxuta + detalhada num texto só)
  const opts = perm.map((orig,pos)=>{

  }).join("");

  const explanation = orig=>{

// "P2 20.2 · Q33 · 22.2 · Q14" → [{ex:"P2 20.2",n:33},{ex:"P2 22.2",n:14}]
function examPairs(label){ const out=[]; let cur=null, pre="";
  for(const tok of String(label||"").split(" · ").map(x=>x.trim())){ const m=tok.match(/^Q(\d+)$/i); if(m){ if(cur) out.push({ex:cur,n:Number(m[1])}); continue; }
    if(/^\d{2,4}(\.\d)?$/.test(tok)) cur=(pre?pre+" ":"")+tok; else { cur=tok; const p=tok.match(/^(.*?)\s*\d{2,4}(\.\d)?$/); pre=p?p[1]:""; } }
  return out; }
// peso do tema: aparições das questões do tema nas provas reais da UFPR (repetida em outro ano conta de novo; sem fixação, Banco ou UWorld)
function realW(dId,tId){ if(S._rwM!==S.qs||S._rwN!==S.qs.size){ S._rwM=S.qs; S._rwN=S.qs.size; const m={}; for(const q of S.qs.values()){ if(!q.exam||q.origin!=="real"||q.standard==="usmle"||q.discipline==="banco") continue; const k=q.discipline+"|"+q.topic; m[k]=(m[k]||0)+(examPairs(q.exam).length||1); } S._rw=m; } return S._rw[dId+"|"+tId]||0; }
const wtTxt=n=>T2(`${n} em provas`,`${n} in exams`);
const WT_TIP=()=>T2("Questões deste tema nas provas antigas da UFPR","Questions on this topic in past UFPR exams");

function wtMeta(dId,tId){ const n=realW(dId,tId); return n?` · <b style="color:var(--warn);font-weight:600" title="${esc(WT_TIP())}">${esc(wtTxt(n))}</b>`:""; }
// revisão final: "## 05 Arritmias" → tema cujo nome começa por 05 (ou nome igual); text=true põe o peso como texto (PDF)
function rvWeights(dId,html,text){ const d=discById(dId); if(!d) return html; const norm=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
  return String(html||"").replace(/<h([23])>([^<]*)<\/h\1>/g,(m,h,tx)=>{ const num=(tx.match(/^\s*(\d{1,2})\s/)||[])[1];
    const t=(d.topics||[]).find(x=>num?Number((nm(x).match(/^\s*(\d{1,2})\s/)||[])[1])===Number(num):norm(nm(x))===norm(tx)); const n=t?realW(dId,t.id):0; if(!n) return m;
    return text?`<h${h}>${tx} <span class="wtp">· ${esc(wtTxt(n))}</span></h${h}>`:`<h${h} data-wt="${esc(wtTxt(n))}" title="${esc(WT_TIP())}">${tx}</h${h}>`; }); }
// revisão final: o "Na véspera" sai da tabela e vai para o topo, numa superfície própria (os blocos da tabela não mudam de índice: anotações ficam no lugar)
function rvSplit(l){ const h=l.html||"", V=[]; const body=h.replace(/<aside class="call vespera">[\s\S]*?<\/aside>\n?/g,m=>{ V.push(m); return ""; }); return {vesp:l.vesp!=null?l.vesp:V.join("\n"), body}; }
function fullExams(dId){ const map=new Map();
  for(const q of S.qs.values()){ if(q.discipline!==dId||!q.exam) continue; for(const {ex,n} of examPairs(q.exam)){ if(!map.has(ex)) map.set(ex,[]); map.get(ex).push({q,n}); } }
  const yr=ex=>{ const m=ex.match(/(\d{2,4})(?:\.(\d))?$/); if(!m) return 0; let y=Number(m[1]); if(y<100) y+=2000; return y*10+Number(m[2]||0); };
  return [...map.entries()].map(([ex,list])=>({ex, list:list.sort((a,b)=>a.n-b.n)})).sort((a,b)=>a.ex.split(" ")[0].localeCompare(b.ex.split(" ")[0]) || yr(b.ex)-yr(a.ex)); }
function exrRow(ex){ const t=exrStats(ex); if(!t||(!t.ans&&!t.f)) return ""; const r=exrRedo(ex).length;
  return `<div class="exr"><span>${T2("Sua resolução","Your run")}: <b class="ok">✓ ${t.ok}</b> <b class="bad">✗ ${t.bad}</b>${t.f?` <b>🚩 ${t.f}</b>`:""} <span style="color:var(--subtle)">· ${t.ans}/${t.n}</span></span><span class="row" style="gap:6px;flex-wrap:nowrap">${r?`<button class="btn small" data-act="exRedo" data-ex="${esc(ex)}">↺ ${T2("Refazer erradas e 🚩","Redo missed & 🚩")} · ${r}</button>`:""}<button class="btn small ghost" data-act="exZero" data-ex="${esc(ex)}" title="${T2("Apaga acertos, erros e 🚩 desta prova (o resto do progresso fica)","Clears this exam's run (other progress stays)")}">${T2("Zerar","Reset")}</button></span></div>`; }
// grupos P1/P2 recolhíveis na lista de provas (23/11/2026, pedido do Léo); aberto/fechado gravado em settings.exgrp (disciplina|grupo), vale para todos os aparelhos

document.addEventListener("toggle",e=>{ const d=e.target; if(!d.matches?.("details.exg")) return; const m=exgMap(); if(d.open) delete m[d.dataset.k]; else m[d.dataset.k]=0; set().exgrp=m; saveProg(); },true);
function fullExamsHTML(){ const d=curDisc(); if(!d||set().std==="usmle") return ""; const L=fullExams(d.id); if(!L.length) return "";
  const last=ex=>(S.prog.sims||[]).filter(s=>s.exam===ex&&(s.ts||0)>(exrOf(ex).z||0)).slice(-1)[0];

   ${fin?`<div class="panel sqfin"><div class="row" style="justify-content:space-between;gap:10px;flex-wrap:nowrap"><span><b>🏁 ${T2("Rodada final","Final round")}</b><br><small style="color:var(--subtle)">${T2("Erradas e 🚩 de todas as provas, numa lista só","Missed and 🚩 from all exams, in one list")}</small></span><button class="btn small primary" data-act="exFinal">${T2("Resolver","Start")} · ${fin}</button></div></div>`:""}
   ${groups.map(g=>{ const n=L.filter(x=>grp(x)===g).length, k=d.id+"|"+g; return `<details class="panel exg" data-k="${esc(k)}" ${exgOpen(k)?"open":""}><summary><h2>${esc(g)}</h2><small>${n} ${T2(n===1?"prova":"provas",n===1?"exam":"exams")}</small><span class="exgc" aria-hidden="true">▾</span></summary><div class="list">${L.filter(x=>grp(x)===g).map(x=>{ const l=last(x.ex); return `<div class="li" style="cursor:default;align-items:center"><span class="t" style="font-family:var(--f-ui)"><b>${esc(x.ex)}</b><br><small style="color:var(--subtle)">${x.list.length} ${T2("questões","questions")}${l?` · ${T2("última","last")}: ${l.ok}/${l.n}`:""}</small></span>
     <span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn small" data-act="fullExam" data-ex="${esc(x.ex)}" data-mode="study">${T2("Comentada","Tutor")}</button><button class="btn small primary" data-act="fullExam" data-ex="${esc(x.ex)}" data-mode="sim">${T2("Simulado","Timed")}</button></span></div>${exrRow(x.ex)}`; }).join("")}</div></details>`; }).join("")}`; }
/* Histórico por prova (23/11/2026, pedido do Léo): S.prog.exr[prova] = {ts, z (zerada em), p:{questão:alternativa}, f:{questão:1 = 🚩 dúvida}}.
   Grava a cada resposta da prova em rolagem, em todas as provas em que a questão aparece. "Refazer erradas e 🚩" e
   "Rodada final" (erradas e 🚩 de todas as provas da disciplina) saem daqui. "Zerar" limpa só isto; o progresso
   geral (revisão, Tutor, competências) não muda. */
function exrOf(ex){ S.prog.exr=S.prog.exr||{}; return S.prog.exr[ex]||{ts:0,p:{},f:{}}; }
function exrPut(ex,fn){ const o=exrOf(ex), n={ts:now(),z:o.z||0,p:Object.assign({},o.p),f:Object.assign({},o.f)}; fn(n); S.prog.exr[ex]=n; }
function exrExams(q){ return q?.exam?examPairs(q.exam).map(x=>x.ex):[]; }
function exrPick(q,p){ exrExams(q).forEach(ex=>exrPut(ex,o=>{ o.p[q.id]=p; })); saveProg(); }
function exrFlagged(qid){ const q=S.qs.get(qid); return exrExams(q).some(ex=>exrOf(ex).f[qid]); }
function exrFlag(qid){ const q=S.qs.get(qid); if(!q) return; const on=!exrFlagged(qid); exrExams(q).forEach(ex=>exrPut(ex,o=>{ if(on) o.f[qid]=1; else delete o.f[qid]; })); saveProg(); return on; }
function exrRedo(ex){ const o=exrOf(ex); const x=fullExams(curDisc()?.id).find(e=>e.ex===ex); if(!x) return [];
  return x.list.map(i=>i.q).filter(q=>o.f[q.id]||(o.p[q.id]!=null&&o.p[q.id]!==q.correct)); }
function exrFinal(){ const d=curDisc(); if(!d) return []; const seen=new Set(), out=[]; for(const x of fullExams(d.id)) for(const q of exrRedo(x.ex)) if(!seen.has(q.id)){ seen.add(q.id); out.push(q); } return out; }
function exrStats(ex){ const o=exrOf(ex), x=fullExams(curDisc()?.id).find(e=>e.ex===ex); if(!x) return null; let ok=0,bad=0,f=0; for(const {q} of x.list){ const p=o.p[q.id]; if(p!=null){ p===q.correct?ok++:bad++; } if(o.f[q.id]) f++; } return {ok,bad,f,n:x.list.length,ans:ok+bad}; }
function exrZero(ex){ S.prog.exr=S.prog.exr||{}; S.prog.exr[ex]={ts:now(),z:now(),p:{},f:{}}; saveProg(); }
function startRedo(qs,label,kind){ if(!qs.length) return toast(T2("Nada para refazer","Nothing to redo")); const su=Object.assign(defaultSetup(),{mode:"study",count:0,shuffleQ:false,shuffleO:false}); S.setup=su;

function startFullExam(ex, mode){ const d=curDisc(); const x=fullExams(d.id).find(e=>e.ex===ex); if(!x) return;
  const qs=x.list.map(i=>i.q); const su=Object.assign(defaultSetup(),{mode, count:0, shuffleQ:false, shuffleO:false}); S.setup=su;
  S.session=buildSession("study", qs, su); S.session.exam=ex; S.session.scroll=true;
  // reabrir a prova traz as respostas já dadas (progress.exr); só "Zerar esta prova" apaga (Léo, 24/11)
  const o=exrOf(ex); S.session.items.forEach(it=>{ const p=o.p[it.id], q=S.qs.get(it.id); if(p!=null&&q&&p<(q.i18n.pt||q.i18n.en).opts.length) it.pick=p; });
  const nx=S.session.items.findIndex(it=>it.pick===null); S.session.i=nx>0?nx:0; go("study"); } // página única com rolagem (23/11/2026)
// incidência: cada aparição em prova (questão repetida em anos diferentes conta de novo)
function incidence(dId, exId){ const d=discById(dId); if(!d) return {rows:[],total:0}; const by={}; let total=0;
  const okT=new Set((d.topics||[]).filter(t=>!exId||t.exam===exId).map(t=>t.id));
  for(const q of S.qs.values()){ if(q.discipline!==dId||!q.exam||!okT.has(q.topic)) continue; const k=examPairs(q.exam).length||1; by[q.topic]=(by[q.topic]||0)+k; total+=k; }
  const rows=(d.topics||[]).filter(t=>by[t.id]).map(t=>{ const r=[...S.qs.values()].filter(q=>q.discipline===dId&&q.topic===t.id&&rec(q.id)); const o=r.filter(q=>rec(q.id).ok).length; return {t,n:by[t.id],seen:r.length,o}; }).sort((a,b)=>b.n-a.n);

   <div class="bars">${rows.map(r=>{ const ex=(cur.exams||[]).find(e=>e.id===r.t.exam); return `<button type="button" class="bar-row" data-act="incTopic" data-d="${esc(cur.id)}" data-t="${esc(r.t.id)}" style="all:unset;display:block;cursor:pointer;width:100%">
     <span class="row" style="justify-content:space-between;gap:8px;flex-wrap:nowrap"><span class="n">${esc(nm(r.t))}${ex?`<small style="color:var(--subtle)"> · ${esc(r.t.exam)}</small>`:""}</span><span class="p">${r.n}&ensp;<b>${Math.round(100*r.n/total)}%</b></span></span>

   <p class="lede" style="margin:10px 0 0;font-size:12.5px">${T2(`${total} aparições em provas antigas${exSel?` (temas da ${exSel})`:""}. Toque num tema para estudá-lo.`,`${total} appearances in past exams${exSel?` (${exSel} topics)`:""}. Tap a topic to study it.`)}</p></div>`; }

  const leg=tps.map((x,i)=>`<button type="button" data-act="incTopic" data-d="${esc(cur.id)}" data-t="${esc(x.t.id)}" title="${esc(nm(x.t))}" style="all:unset;box-sizing:border-box;min-width:0;cursor:pointer;display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px">

  return `<div class="panel"><h2>${T2("Mapa da disciplina","Discipline map")}</h2>
   <div class="chips" style="margin:2px 0 8px">${ds.map(d=>`<button type="button" class="chip" data-act="incDisc" data-val="${esc(d.id)}" aria-pressed="${d.id===cur.id}">${ddot(d)}${esc(nm(d))}</button>`).join("")}</div>

  const fb=()=>{ const ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} ta.remove(); return ok?Promise.resolve():Promise.reject(new Error("copy")); };

}

  const pg=document.createElement("div"); pg.className="pg"; const bd=document.createElement("div"); bd.className="bd"; const c=document.createElement("div"); c.className="pdfc"; c.style.width=lay.cw+"px"; nodes.forEach(x=>c.appendChild(x.cloneNode(true))); bd.appendChild(c);
  const add=(cls,t,st)=>{ const e=document.createElement("div"); e.className=cls; if(t) e.textContent=t; if(st) e.style.cssText=st; pg.appendChild(e); return e; };
  add("hd",label,`width:${lay.cw}px`); if(lay.ln){ add("ln","",`left:${lay.ln}px`); add("nt",T2("Notas","Notes"),`left:${lay.ln+14}px`); } pg.appendChild(bd);
  const ft=add("ft","",`width:${lay.cw}px`); ft.innerHTML=`<span>Gabarito</span><b>${n} / ${N}</b>`;
  const root=document.createElement("div"); root.innerHTML=`<style>${css}</style>`; root.appendChild(pg);
  const host=document.createElement("div"); host.style.cssText="position:fixed;left:-10000px;top:0"; host.appendChild(root); document.body.appendChild(host);
  let links=[]; try{ const pr=pg.getBoundingClientRect(); links=[...pg.querySelectorAll("[data-go]")].map(a=>{ const r=a.getBoundingClientRect(); return {go:+a.dataset.go, r:[r.left-pr.left, r.top-pr.top, r.right-pr.left, r.bottom-pr.top]}; }); } finally{ host.remove(); }
  const xml=new XMLSerializer().serializeToString(root);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${PW*PSC}" height="${PH*PSC}" viewBox="0 0 ${PW} ${PH}"><foreignObject width="${PW}" height="${PH}"><div xmlns="http://www.w3.org/1999/xhtml">${xml}</div></foreignObject></svg>`;
  const img=new Image(); await new Promise((ok,no)=>{ img.onload=ok; img.onerror=()=>no(new Error("falha ao desenhar a página")); img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg); });
  const cv=document.createElement("canvas"); cv.width=Math.round(PW*PSC); cv.height=Math.round(PH*PSC); const g=cv.getContext("2d"); g.imageSmoothingQuality="high"; g.fillStyle=th.bg; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img,0,0,cv.width,cv.height);
  const blob=await new Promise(ok=>cv.toBlob(ok,"image/jpeg",qual)); if(!blob) throw new Error("falha ao gerar imagem");
  return {b:new Uint8Array(await blob.arrayBuffer()), w:cv.width, h:cv.height, links};
}
// PDF 1.4 mínimo: uma página A4 por JPEG + links do índice + marcadores (outline)
function jpegPdf(pages, title, ex={}){
  const enc=new TextEncoder(), parts=[], off=[]; let len=0, nobj=0;
  const put=x=>{ const u=typeof x==="string"?enc.encode(x):x; parts.push(u); len+=u.length; };
  const obj=(n,s,bin)=>{ off[n]=len; put(`${n} 0 obj\n${s}`); if(bin){ put("\nstream\n"); put(bin); put("\nendstream"); } put("\nendobj\n"); };
  const id=()=>++nobj, u16=s=>"<FEFF"+Array.from({length:s.length},(_,i)=>s.charCodeAt(i).toString(16).padStart(4,"0")).join("").toUpperCase()+">";
  const k=595.28/PW, H=841.89, f2=x=>(+x).toFixed(2);
  const cat=id(), pgs=id(), info=id(), P=pages.map(()=>({pg:id(),ct:id(),im:id(),an:[]}));
  const links=(ex.links||[]).filter(L=>L.to!=null&&P[L.pg]&&P[L.to]).map(L=>({...L,id:id()})); links.forEach(L=>P[L.pg].an.push(L.id));
  const ol=(ex.outline||[]).filter(x=>P[x.p]); const olRoot=ol.length?id():0, olIds=ol.map(()=>id());
  put("%PDF-1.4\n"); put(new Uint8Array([37,226,227,207,211,10]));
  obj(cat,`<< /Type /Catalog /Pages ${pgs} 0 R${olRoot?` /Outlines ${olRoot} 0 R`:""} >>`);
  obj(pgs,`<< /Type /Pages /Count ${pages.length} /Kids [${P.map(x=>`${x.pg} 0 R`).join(" ")}] >>`);
  obj(info,`<< /Title ${u16(title)} /Producer (Gabarito) >>`);
  pages.forEach((p,i)=>{ const o=P[i], cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(o.pg,`<< /Type /Page /Parent ${pgs} 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${o.im} 0 R >> >> /Contents ${o.ct} 0 R${o.an.length?` /Annots [${o.an.map(a=>a+" 0 R").join(" ")}]`:""} >>`);
    obj(o.ct,`<< /Length ${cs.length} >>`,enc.encode(cs));
    obj(o.im,`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.b.length} >>`,p.b); });
  links.forEach(L=>{ const [x1,y1,x2,y2]=L.r; obj(L.id,`<< /Type /Annot /Subtype /Link /Rect [${f2(x1*k)} ${f2(H-y2*k)} ${f2(x2*k)} ${f2(H-y1*k)}] /Border [0 0 0] /Dest [${P[L.to].pg} 0 R /Fit] >>`); });
  if(olRoot){ obj(olRoot,`<< /Type /Outlines /First ${olIds[0]} 0 R /Last ${olIds[olIds.length-1]} 0 R /Count ${ol.length} >>`);
    ol.forEach((x,i)=>obj(olIds[i],`<< /Title ${u16(x.t)} /Parent ${olRoot} 0 R${i?` /Prev ${olIds[i-1]} 0 R`:""}${i<ol.length-1?` /Next ${olIds[i+1]} 0 R`:""} /Dest [${P[x.p].pg} 0 R /Fit] >>`)); }
  const xr=len; put(`xref\n0 ${nobj+1}\n0000000000 65535 f \n`); for(let n=1;n<=nobj;n++) put(String(off[n]).padStart(10,"0")+" 00000 n \n");
  put(`trailer\n<< /Size ${nobj+1} /Root ${cat} 0 R /Info ${info} 0 R >>\nstartxref\n${xr}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}
// HTML → páginas (+ índice clicável quando há 2 ou mais seções) → PDF (File)
async function pdfFromHtml(label, html, op={}){
  const o=op.o||pdfOpt(), lay=PLAY[o.margin]||PLAY.normal, th=PTHEME[pdfThemeKey(o)], css=`${PDF_CSS}\n.pg,.pdfc{${th.v}}`; PCW=lay.cw;
  const box=document.createElement("div"); box.style.cssText="position:fixed;left:-10000px;top:0";
  box.innerHTML=`<style>${css}</style><div class="pdfc" style="width:${PCW}px">${html}</div>`; document.body.appendChild(box);
  let pages, toc=[];
  try{ const c=box.querySelector(".pdfc"), heads=op.toc?[...c.querySelectorAll(op.toc)]:[];
    await Promise.all([...c.querySelectorAll("img")].map(i=>(i.complete&&i.naturalWidth?Promise.resolve():i.decode()).catch(()=>{})));   // figura sem altura medida sairia cortada no pé da página
    pages=pdfPaginate(c);
    toc=heads.map(h=>({t:h.textContent.replace(/\s+/g," ").trim(), sub:h.classList.contains("pq-grp"), p:pages.findIndex(pg=>pg.includes(h))})).filter(x=>x.p>=0&&x.t);
    let tp=[]; if(toc.length>=2){
      c.innerHTML=`<h1>${T2("Índice","Contents")}</h1>`+toc.map((x,i)=>`<a class="te${x.sub?" sub":""}" data-go="${i}"><span>${esc(x.t)}</span><b>000</b></a>`).join("");
      tp=pdfPaginate(c); const T=tp.length; toc.forEach(x=>x.p+=T);
      tp.forEach(pg=>pg.forEach(el=>{ if(el.dataset?.go!=null) el.querySelector("b").textContent=String(toc[+el.dataset.go].p+1); })); }
    pages=[...tp,...pages].map(p=>p.map(x=>x.cloneNode(true)));
  } finally{ box.remove(); }
  const cx={lay,th,css}, jp=[], links=[];
  for(let i=0;i<pages.length;i++){ const r=await pdfRaster(pages[i],label,i+1,pages.length,op.qual||.9,cx); r.links.forEach(L=>links.push({pg:i,r:L.r,to:toc[L.go]?.p})); jp.push(r); }
  return new File([jpegPdf(jp,label,{links,outline:toc})], (fsafe(op.name)||fsafe(label)||"Gabarito")+".pdf", {type:"application/pdf"});
}

// figura → data URL (null se falhar)
async function pqImgData(url){
  try{ const ac=new AbortController(), t=setTimeout(()=>ac.abort(),8000);
    try{ const r=await fetch(url,{signal:ac.signal}); if(!r.ok) return null; const b=await r.blob();
      return await new Promise((ok,no)=>{ const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.onerror=no; fr.readAsDataURL(b); }); }
    finally{ clearTimeout(t); }
  }catch(e){ return null; }
}
// grupos [{title?, qs}] → {q: blocos das questões, g: blocos do gabarito}; numeração contínua. inline: gabarito logo abaixo de cada questão

async function discPdfFiles(dId, prog, o=pdfOpt()){

  const groups=pdfHasQ(o)?tops.map(t=>({title:nm(t),qs:pdfQsF(d.id,t.id,o)})).filter(x=>x.qs.length):[];
  const qT=o.what==="err"?T2("99 Erradas","99 Missed"):T2("99 Questões","99 Questions"), head=`${d.period!=null?d.period+"º · ":""}${nm(d)}${ex?" · "+ex:""}`;
  if(o.one){ prog&&prog(1,1); if(!(withL&&ls.length)&&!groups.length) return [];

    const name=fsafe([nm(d),ex,withL?(o.what==="vesp"?T2("Na véspera","Night before"):T2("Completo","Complete")):qT.replace(/^99 /,"")].filter(Boolean).join(" - "));

  return files;
}

const GSCOPE="https://www.googleapis.com/auth/drive.readonly";
const G={tok:null,exp:0,cache:new Map()};

async function gToken(interactive){
  if(G.tok&&G.exp>Date.now()+60000) return G.tok;
  if(!window.google?.accounts?.oauth2) await gLoad("https://accounts.google.com/gsi/client");
  return new Promise((ok,no)=>{
    const c=google.accounts.oauth2.initTokenClient({ client_id:window.GABARITO_CONFIG.GOOGLE_CLIENT_ID, scope:GSCOPE, login_hint:window.__email||undefined,
      callback:r=>{ if(r&&r.access_token){ G.tok=r.access_token; G.exp=Date.now()+(r.expires_in||3600)*1000; try{ localStorage.setItem("gab.gtok",JSON.stringify({t:G.tok,exp:G.exp})); }catch(_){} ok(G.tok); } else no(new Error("auth")); },
      error_callback:()=>no(new Error("auth")) });

async function gPdf(box,blob,startPg){
  if(!window.pdfjsLib){ await gLoad("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); const w=await (await fetch("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")).text(); pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:"text/javascript"})); }
  const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
  const wrap=document.createElement("div"); wrap.className="gpdf"; box.innerHTML=""; box.appendChild(wrap);
  const p1=await pdf.getPage(1), v1=p1.getViewport({scale:1}), ratio=v1.height/v1.width, pages=[];
  const io=new IntersectionObserver(es=>es.forEach(async e=>{ if(!e.isIntersecting) return; const d=e.target; if(d.dataset.r) return; d.dataset.r="1"; io.unobserve(d);
      const pg=await pdf.getPage(+d.dataset.n), w=Math.max(d.clientWidth,300), sc=Math.min(w*Math.min(devicePixelRatio||1,2),4096)/pg.getViewport({scale:1}).width, vp=pg.getViewport({scale:sc});
      const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height; await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise; d.style.aspectRatio=""; d.replaceChildren(cv); }),{root:null,rootMargin:"600px 0px"});

async function gMount(host,id,interactive){
  const href="https://drive.google.com/file/d/"+encodeURIComponent(id)+"/view";
  host.querySelectorAll("iframe,.gbox").forEach(n=>n.remove());
  const box=document.createElement("div"); box.className="gbox"; host.insertBefore(box,host.firstChild);
  const ext='<a class="btn small" href="'+esc(href)+'" target="_blank" rel="noopener" data-ext="1">'+T2("Abrir no Drive","Open in Drive")+'</a>';
  box.innerHTML='<div class="gmsg">'+T2("Carregando do Drive…","Loading from Drive…")+'</div>';
  try{ const f=await gFile(id,interactive);
    if(f.mime.startsWith("image/")){ box.innerHTML=""; const im=document.createElement("img"); im.className="gimg"; im.alt=f.name||""; im.src=URL.createObjectURL(f.blob); box.appendChild(im); }
    else if(f.mime==="application/pdf"){ await gPdf(box,f.blob,(String(host.dataset.gp||"").match(/\d+/)||[])[0]); }
    else box.innerHTML='<div class="gmsg">'+esc(f.name||"")+"<br>"+T2("Este tipo de arquivo abre no Drive.","This file type opens in Drive.")+ext+'</div>';
  }catch(e){
    if(e.message==="auth"){ box.innerHTML='<div class="gmsg">'+T2("Entre com sua conta Google para ver este arquivo dentro do app.","Sign in with Google to view this file inside the app.")+'<button type="button" class="btn small primary" data-gsign>'+T2("Entrar com Google","Sign in with Google")+'</button></div>'; box.querySelector("[data-gsign]").onclick=()=>gMount(host,id,true); }
    else box.innerHTML='<div class="gmsg">'+T2("Não consegui carregar o arquivo ("+esc(e.message)+").","Could not load the file ("+esc(e.message)+").")+ext+'</div>';
  }
}
