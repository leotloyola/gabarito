function vPlan(v){
  const P=PL(), C=planCompute(), today=C.today, wk=S.planWeek||0, dow=(new Date(today).getDay()+6)%7, start=addDays(today,-dow+7*wk), W=WDN();
  const rows=[...Array(7)].map((_,i)=>{ const t=addDays(start,i), k=dayKey(new Date(t)), past=t<today, wdOff=P.offWd.includes(new Date(t).getDay()), off=planIsOff(t,P), its=C.days.get(k)||[], exs=C.exams.filter(e=>e.dt===t), lg=S.prog.log[k];
    const body=exs.map(e=>`<div class="pitem exam"><div class="pt"><b>🎯 ${ddot(e.d)}${esc(nm(e.d))} · ${esc(nm(e.ex))}</b></div></div>`).join("")+
      (past? (lg&&lg.n?`<div class="pnote ok">✓ ${lg.n} ${T2("questões","questions")} · ${T2("acerto","accuracy")} ${pct(lg.ok,lg.n)}</div>`:`<div class="pnote">—</div>`)
       : its.length ? its.map(planItem).join("") : off ? `<div class="pnote">${T2("Sem estudo","Day off")}</div>` : exs.length?"":`<div class="pnote">${t===today&&C.doneToday?T2("Meta cumprida ✓","Goal done ✓"):T2("Livre","Free")}</div>`);
    return `<div class="pday ${t===today?"today":""} ${past?"past":""} ${off?"off":""}"><div class="pdl"><b>${W[new Date(t).getDay()]}</b><span>${fmtDM(t)}</span>${!past&&!wdOff?`<button type="button" class="pdx" data-act="planOff" data-day="${k}" aria-pressed="${off}" title="${T2("Marcar dia sem estudo (plantão)","Mark day off")}">${off?T2("liberar","free"):T2("plantão","off")}</button>`:""}</div><div class="pbody">${body}</div></div>`; }).join("");
  const cards=C.exams.map(e=>{ const warn=e.over>0, none=!e.needTotal;
    return `<div class="panel pexam"><div class="row" style="justify-content:space-between;gap:8px;flex-wrap:nowrap"><div><div class="eyebrow">${ddot(e.d)}${esc(nm(e.d))}</div><b style="font-size:16px">${esc(nm(e.ex))}</b></div><span class="tag ${e.days<=7?"old":""}">${e.days} ${T2(e.days===1?"dia":"dias",e.days===1?"day":"days")}</span></div>
      <div class="track" style="margin:12px 0 8px"><i class="ok" style="width:${100*e.ok/e.n}%"></i><i class="bad" style="width:${100*(e.seen-e.ok)/e.n}%"></i></div>
      <div style="font-size:12.5px;color:var(--muted)"><b>${pct(e.seen,e.n)}</b> ${T2("coberto","covered")} (${e.seen}/${e.n}) · ${T2("acerto","accuracy")} <b>${pct(e.ok,e.seen)}</b></div>
      <div class="pstat ${warn?"warn":""}">${warn?`⚠ ${e.over} ${T2("questões não cabem: aumente a meta diária ou libere dias.","questions don't fit: raise the daily goal or free up days.")}`: none?`✓ ${T2("Cobertura-alvo atingida: foque nos erros e na revisão.","Coverage target reached: focus on misses and review.")}`:`${T2("Ritmo","Pace")}: ~${e.quota} ${T2("questões novas/dia em","new questions/day over")} ${e.freeN-(e.reviewDay!=null?1:0)} ${T2("dias de estudo","study days")}`}</div>
      <details class="ptps"><summary>${T2("Temas","Topics")} (${e.tps.length})</summary>${e.tps.map(x=>`<div class="pitem ${x.done?"ok":""}"><div class="pt"><b>${x.done?"✓ ":""}${esc(nm(x.t))}</b><small>${planStars(x.w)} · ${pct(x.seen,x.n)} ${T2("visto","seen")}${x.acc!=null?` · ${T2("acerto","accuracy")} ${Math.round(x.acc*100)}%`:""}</small></div><div class="pa">${planLinks(x)}</div></div>`).join("")}</details></div>`; }).join("");
  const a=new Date(start), b=new Date(addDays(start,6));
  v.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${T2("Até as provas","Until the exams")}</div><h1>${T2("Plano de estudos","Study plan")}</h1></div><button class="btn small" data-act="planCfg">⚙ ${T2("Configurar","Settings")}</button></div>
   <div class="plexams">${C.exams.length?cards:`<div class="panel"><h2>${T2("Nenhuma prova futura","No upcoming exam")}</h2><p class="lede">${T2("Defina a data das provas em Configurar. O plano distribui os temas (★ primeiro, os mais fracos antes) pelos dias livres, e se atrasar ele remaneja sozinho.","Set the exam dates in Settings. The plan spreads topics (★ and weakest first) over free days and re-plans itself if you fall behind.")}</p></div>`}</div>
   <div class="row" style="justify-content:space-between"><button class="btn small ghost" data-act="planWeek" data-v="-1" aria-label="${T2("Semana anterior","Previous week")}">‹</button><button class="btn small ghost" data-act="planWeek" data-v="0">${fmtDM(a)} – ${fmtDM(b)}${wk?"":" · "+T2("esta semana","this week")}</button><button class="btn small ghost" data-act="planWeek" data-v="1" aria-label="${T2("Próxima semana","Next week")}">›</button></div>
   <div class="pgrid">${rows}</div>
   <p class="lede" style="font-size:12px">${T2("Verde = feito (o app marca sozinho quando você responde as questões). Meta de "+P.cap+" questões novas por dia. Erros voltam na data da revisão espaçada.","Green = done (the app ticks it when you answer the questions). Goal: "+P.cap+" new questions/day. Misses return on their spaced-review date.")}</p>`;
}
function openPlanCfg(){ const P=PL(), en=set().lang==="en", W=WDN(), today=startOfDay(now());
  const exr=discs().flatMap(d=>(d.exams||[]).map(ex=>{ const key=exKey(d,ex), dt=planExDate(d,ex); return `<div class="plrow"><label><input type="checkbox" data-pinc="${esc(key)}" ${P.hide[key]?"":"checked"}> ${ddot(d)}<span>${esc(nm(d))} · ${esc(nm(ex))}</span></label><input type="date" data-pdate="${esc(key)}" value="${dt!=null?dayKey(new Date(dt)):""}" aria-label="${T2("Data da prova","Exam date")}"></div>`; })).join("");
  const offs=P.offDates.filter(k=>k>=dayKey(new Date(today))).sort();
  openSheet(`<div class="row" style="justify-content:space-between"><h2>${T2("Configurar plano","Plan settings")}</h2><button class="btn small ghost" data-act="closeSheet">✕</button></div>
   <div class="eyebrow" style="margin:14px 0 8px">${T2("Meta: questões novas por dia","Goal: new questions per day")}</div>
   <div class="chips">${[15,30,50,80].map(n=>`<button type="button" class="chip" data-act="planCap" data-v="${n}" aria-pressed="${P.cap===n}">${n}</button>`).join("")}</div>
   <div class="eyebrow" style="margin:16px 0 8px">${T2("Dias da semana sem estudo","Weekdays off")}</div>
   <div class="chips">${[1,2,3,4,5,6,0].map(i=>`<button type="button" class="chip" data-act="planWd" data-v="${i}" aria-pressed="${P.offWd.includes(i)}">${W[i]}</button>`).join("")}</div>
   <div class="eyebrow" style="margin:16px 0 8px">${T2("Plantões / dias específicos sem estudo","Specific days off")}</div>
   <div class="row" style="gap:8px"><input type="date" id="plOffD" min="${dayKey(new Date(today))}" aria-label="${T2("Data","Date")}"><button class="btn small" data-act="planOffAdd">${T2("Adicionar","Add")}</button></div>
   ${offs.length?`<div class="chips" style="margin-top:8px">${offs.map(k=>`<button type="button" class="chip" data-act="planOffDel" data-day="${k}">${k.slice(8)}/${k.slice(5,7)} ✕</button>`).join("")}</div>`:""}
   <div class="eyebrow" style="margin:16px 0 8px">${T2("Provas (marque as que entram no plano)","Exams (tick those in the plan)")}</div>
   <div class="plrows">${exr||`<p class="lede">—</p>`}</div>`); }

/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const nav=e.target.closest("[data-nav]"); if(nav){ if($("#layer").innerHTML) closeSheet(); go(nav.dataset.nav); return; }
  const stdB=e.target.closest("[data-std]"); if(stdB){ set().std=stdB.dataset.std; S.session=null; S.fcDeck=null; saveProg(); render(); return; }
  const lgB=e.target.closest("[data-lang]"); if(lgB){ set().lang=lgB.dataset.lang; saveProg(); render(); return; }
  const su=e.target.closest("[data-su]"); if(su){ const k=su.dataset.su, v=su.dataset.val; S.setup[k]= k==="count"?Number(v):v; render(); return; }
  const sw=e.target.closest("[data-sw]"); if(sw){ const k=sw.dataset.sw; S.setup[k]=!S.setup[k]; render(); return; }
  const pk=e.target.closest("[data-pick]"); if(pk && !pk.disabled){ const s=S.session; if(!s) return; const it=s.items[s.i]; const q=S.qs.get(it.id); const p=Number(pk.dataset.pick);
     if(s.mode==="study"){ it.pick=p; record(q,p,{rev:s.kind==="review", ms:it.t0?now()-it.t0:null}); render(); const r=$(".result"); r&&r.scrollIntoView({behavior:"smooth",block:"nearest"}); }
     else { it.pick=p; render(); }
     return; }
  const sl=e.target.closest("[data-setl]"); if(sl){ set().lang=sl.dataset.setl; saveProg(); render(); openSettings(); return; }
  const stt=e.target.closest("[data-sett]"); if(stt){ set().theme=stt.dataset.sett; applyTheme(); saveProg(); openSettings(); return; }
  const sf=e.target.closest("[data-setf]"); if(sf){ set().fs=Number(sf.dataset.setf); applyTheme(); saveProg(); openSettings(); return; }
  const gb=e.target.closest("[data-g]"); if(gb&&S.gen){ const k=gb.dataset.g; S.gen[k]= k==="qty"?Number(gb.dataset.v):gb.dataset.v; openGen(); return; }
  const a=e.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act;
  if(act==="search"){ if(S.view!=="search") S.srBack=S.view; if(S.session&&!S.session.done&&S.view==="study"){ S.session=null; } return go("search"); }
  if(act==="srClose"){ if(history.state&&history.state.v==="search"&&history.length>1){ history.back(); return; } return go(S.srBack&&S.srBack!=="search"?S.srBack:"home"); }
  if(act==="srF"){ const k=a.dataset.sk, v=a.dataset.sv, f=S.srch.f; f[k]= k==="real"? v==="true" : k==="pri"||k==="per" ? (v==="all"?"all":Number(v)) : v; return srRefresh(true); }
  if(act==="srRecent"){ S.srch.text=a.dataset.v; const i=$("#srQ"); if(i) i.value=S.srch.text; return srRefresh(); }
  if(act==="srMore"){ S.srch.more[a.dataset.key]=(S.srch.more[a.dataset.key]||25)+50; const y=window.scrollY; srRefresh(); window.scrollTo({top:y}); return; }
  if(act==="srStudy") return srStudy(a.dataset.d||null,a.dataset.t||null,Number(a.dataset.n||0));
  if(act==="srTopic") return srOpenTopic(a.dataset.d,a.dataset.t);
  if(act==="srLesson"){ S.lessonBack="search"; S.lessonId=a.dataset.id; S.lessonHl={i:Number(a.dataset.i), hres:S.srRes?.P.hres||[]}; return go("lesson"); }
  if(act==="settings") return openSettings();
  if(act==="toggleFocus"){ set().focus = set().focus===false; saveProg(); render(); return openSettings(); }
  if(act==="fs"){ try{ if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen({navigationUI:"hide"}); }catch(err){ toast(set().lang==="en"?"Full screen is not available here":"Tela cheia não disponível aqui"); } setTimeout(render,150); return; }
  if(act==="signOut") return signOut();
  if(act==="closeSheet") return closeSheet();
  if(act==="keys") return openKeys();
  if(act==="tocGo"){ const h=document.getElementById("sec-"+a.dataset.i); if(h){ h.scrollIntoView({behavior:"smooth",block:"start"}); if(!WIDE_L.matches){ const d=a.closest("details"); if(d) d.open=false; } } return; }
  if(act==="quick"){ S.setup=Object.assign(defaultSetup(),{mode:a.dataset.mode, count:10, order:a.dataset.mode==="sim"?"rand":"pri", filter:a.dataset.mode==="study"?"open":"all"}); let pool=setupPool(S.setup); if(!pool.length){ S.setup.filter="all"; pool=setupPool(S.setup);} if(!pool.length) return toast(tr("none")); S.session=buildSession("study",pool,S.setup); return go("study"); }
  if(act==="startSession"){ const pool=setupPool(S.setup); if(!pool.length) return; S.session=buildSession("study",pool,S.setup); return render(); }
  if(act==="imgZoom"){ return openImg(a.dataset.q); }
  if(act==="report"){ return openReport(a.dataset.q); }
  if(act==="repKind"){ S.rep.kind=a.dataset.val; if(S.rep.kind!=="key") S.rep.alt=null; return S.repDraw(); }
  if(act==="repAlt"){ S.rep.alt=Number(a.dataset.val); return S.repDraw(); }
  if(act==="repSend"){ const r=S.rep; const ta=$("#repTxt"); r.text=(ta?ta.value:r.text||"").trim(); if(r.kind==="key"&&r.alt==null&&!r.text) return toast(T2("Escolha a alternativa correta ou escreva uma observação","Pick the correct option or add a note"));
    S.prog.reports=(S.prog.reports||[]).concat([{id:"r"+now().toString(36), qid:r.qid, ts:now(), kind:r.kind, alt:r.alt, text:r.text||"", status:"aberta"}]); saveProg(); flushProg&&flushProg(); closeSheet(); toast(T2("Contestação enviada","Report sent")); return render(); }
  if(act==="lpane"){ LP=!LP; try{ localStorage.setItem("gab.lpane",LP?"1":"0"); }catch(e){} return render(); }
  if(act==="lesson"){ S.lessonBack=S.view==="lesson"?S.lessonBack:S.view; S.lessonId=a.dataset.id; S.prog.read=S.prog.read||{}; if(!S.prog.read[a.dataset.id]){ S.prog.read[a.dataset.id]=now(); saveProg(); } return go("lesson"); }
  if(act==="lessonPdf"){ return pdfRun([S.lessons.get(S.lessonId)], a); }
  if(act==="discPdf"){ const d=curDisc(); return d&&pdfRun(lessonsOf(d.id), a, d.id); }
  if(act==="pdfShare"){ const fs=S.pdfFiles||[]; return pdfShare(a.dataset.i==="all"?fs:[fs[a.dataset.i]]); }
  if(act==="pdfDl"){ return pdfSave(S.pdfFiles[a.dataset.i]); }
  if(act==="pdfDlAll"){ return (S.pdfFiles||[]).forEach((f,i)=>setTimeout(()=>pdfSave(f),i*400)); }
  if(act==="lessonRead"){ S.prog.read=S.prog.read||{}; if(S.prog.read[S.lessonId]) delete S.prog.read[S.lessonId]; else S.prog.read[S.lessonId]=now(); saveProg(); return render(); }
  if(act==="lessonBack"){ if(history.state&&history.state.v==="lesson"&&history.length>1){ history.back(); return; } return go(S.lessonBack&&S.lessonBack!=="lesson"?S.lessonBack:"study"); }
  if(act==="lessonPractice"){ set().disc=a.dataset.d; set().topic=a.dataset.t; S.session=null; S.fcDeck=null; saveProg(); S.setup=Object.assign(defaultSetup(),{mode:"study",count:10,filter:"open"}); let pool=setupPool(S.setup); if(!pool.length){ S.setup.filter="all"; pool=setupPool(S.setup);} if(!pool.length) return toast(tr("none")); S.session=buildSession("study",pool,S.setup); return go("study"); }
  if(act==="statsTab"){ S.statsTab=a.dataset.val; render(); window.scrollTo({top:0}); return; }
  if(act==="examEssentials"){ set().topic="exam:"+a.dataset.ex; S.fcDeck=null; saveProg(); S.studyTab="build"; S.setup=Object.assign(defaultSetup(),{prio:"3",order:"pri",count:20,filter:"open"}); let pool=setupPool(S.setup); if(!pool.length){ S.setup.filter="wrong"; pool=setupPool(S.setup); } if(!pool.length){ S.setup.filter="all"; pool=setupPool(S.setup); } if(!pool.length) return toast(tr("none")); S.session=buildSession("study",pool,S.setup); return go("study"); }
  if(act==="planCfg") return openPlanCfg();
  if(act==="planCap"){ PL().cap=Number(a.dataset.v); saveProg(); render(); return openPlanCfg(); }
  if(act==="planWd"){ const P=PL(), i=Number(a.dataset.v); P.offWd=P.offWd.includes(i)?P.offWd.filter(x=>x!==i):P.offWd.concat(i); saveProg(); render(); return openPlanCfg(); }
  if(act==="planOffAdd"){ const k=$("#plOffD")?.value; if(!k) return; const P=PL(); if(!P.offDates.includes(k)) P.offDates.push(k); saveProg(); render(); return openPlanCfg(); }
  if(act==="planOffDel"){ const P=PL(); P.offDates=P.offDates.filter(x=>x!==a.dataset.day); saveProg(); render(); return openPlanCfg(); }
  if(act==="planOff"){ const P=PL(), k=a.dataset.day; P.offDates=P.offDates.includes(k)?P.offDates.filter(x=>x!==k):P.offDates.concat(k); saveProg(); return render(); }
  if(act==="planWeek"){ const v=Number(a.dataset.v); S.planWeek=v===0?0:(S.planWeek||0)+v; return render(); }
  if(act==="planStudy"){ set().disc=a.dataset.d; set().topic=a.dataset.t; S.session=null; S.fcDeck=null; S.setup=null; S.studyTab="build"; saveProg(); return go("study"); }
  if(act==="planRev"){ set().disc=a.dataset.d; set().topic=a.dataset.t; S.fcDeck=null; S.setup=null; const L=[...S.qs.values()].filter(q=>q.discipline===a.dataset.d&&q.topic===a.dataset.t&&q.standard!=="usmle"&&q.standard!=="banco"&&rec(q.id)&&!rec(q.id).ok); if(!L.length) return toast(tr("none")); saveProg(); S.session=buildSession("review",prioSort(shuffle(L)),{mode:"study",count:0,order:"seq",shuffleO:true}); return go("review"); }
  if(act==="planFinal"){ set().disc=a.dataset.d; a.dataset.act="examEssentials"; return a.click(); }
  if(act==="examStudy"){ set().topic="exam:"+a.dataset.ex; S.session=null; S.fcDeck=null; S.setup=null; S.studyTab="build"; saveProg(); return go("study"); }
  if(act==="studyTab"){ S.studyTab=a.dataset.val; return render(); }
  if(act==="fullExam"){ return startFullExam(a.dataset.ex, a.dataset.mode); }
  if(act==="incExam"){ S.incExam=a.dataset.val; return render(); }
  if(act==="incDisc"){ S.incDisc=a.dataset.val; return render(); }
  if(act==="incTopic"){ set().disc=a.dataset.d; set().topic=a.dataset.t; S.session=null; S.fcDeck=null; S.setup=null; saveProg(); return go("study"); }
  if(act==="leechStudy"){ const qs=leechList().slice(0,20); if(!qs.length) return; S.setup=Object.assign(defaultSetup(),{mode:"study",count:0}); S.session=buildSession("study",shuffle(qs),S.setup); return go("study"); }
  if(act==="topicPick"){ return openTopicPicker(); }
  if(act==="subPick"){ return openSubPicker(); }
  if(act==="pickTopic"){ set().topic=a.dataset.val; saveProg(); S.session=null; S.fcDeck=null; if(S.setup) S.setup.sub=""; S.bankFilter.sub=""; closeSheet(); render(); window.scrollTo({top:0}); return; }
  if(act==="pickSub"){ const su=S.setup||(S.setup=defaultSetup()); su.sub=a.dataset.val; closeSheet(); return render(); }
  if(act==="revScope"){ set().revScope=a.dataset.val; saveProg(); return render(); }
  if(act==="startReview"){ const due=dueQs(); if(!due.length) return; S.session=buildSession("review",prioSort(shuffle(due)),{mode:"study",count:0,order:"seq",shuffleO:true}); return go("review"); }
  if(act==="next"){ const s=S.session; s.i=Math.min(s.i+1,s.items.length-1); render(); window.scrollTo({top:0}); return; }
  if(act==="prev"){ const s=S.session; s.i=Math.max(0,s.i-1); render(); window.scrollTo({top:0}); return; }
  if(act==="finish"){ const s=S.session;
    if(s.mode==="sim"){ return arm(a, tr("confirmFinish"), ()=>{ s.secs=(now()-s.t0)/1000; s.done=true; let ok=0; s.items.forEach(it=>{ const q=S.qs.get(it.id); if(q&&it.pick!==null){ if(record(q,it.pick,{rev:false})) ok++; } }); S.prog.sims=(S.prog.sims||[]).concat([{ts:now(),n:s.items.length,ok,secs:Math.round(s.secs),topic:s.topic,std:s.std,exam:s.exam||null}]).slice(-30); saveProg(); clearInterval(timerInt); render(); window.scrollTo({top:0}); }); }
    const v=S.view, fs=s.from; S.session=null; toast("✓"); return go(fs==="search"?"search":v==="review"?"review":"home"); }
  if(act==="exit"){ clearInterval(timerInt); const fs=S.session?.from; S.session=null; return fs==="search"?go("search"):render(); }
  if(act==="newSession"){ S.session=null; return go("study"); }
  if(act==="reviewItem"){ const s=S.session; const i=Number(a.dataset.i); s.mode="study"; s.done=false; s.i=i; s.reviewing=true; return render(); }
  if(act==="detail"){ const id=a.dataset.q; if(S.detail.has(id)) S.detail.delete(id); else S.detail.add(id); const y=window.scrollY; if($("#layer").innerHTML){ bankPreview(id); } else { render(); } window.scrollTo({top:y}); return; }
  if(act==="toggleDetail"){ set().detail=!set().detail; S.detail.clear(); saveProg(); render(); return openSettings(); }
  if(act==="explain") return explain(a.dataset.q, a);
  if(act==="translate") return translateQ(a.dataset.q, a);
  if(act==="fcStart"){ const all=a.dataset.all==="1"; const ids=shuffle((all?ctxQs():dueCards()).map(q=>q.id)); S.fcDeck={ids,i:0,show:false,topic:curTopic()?.id,std:set().std}; return render(); }
  if(act==="fcShow"){ S.fcDeck.show=true; return render(); }
  if(act==="fcRate"){ const d=S.fcDeck; const q=S.qs.get(d.ids[d.i]); rateCard(q,Number(a.dataset.g)); d.i++; d.show=false; render(); window.scrollTo({top:0}); return; }
  if(act==="fcReset"){ S.fcDeck=null; return render(); }
  if(act==="bankOpen") return bankPreview(a.dataset.q);
  if(act==="bankSort"){ const so=S.bankSort||(S.bankSort={k:"n",dir:1}); if(so.k===a.dataset.val) so.dir*=-1; else { so.k=a.dataset.val; so.dir=(a.dataset.val==="last"||a.dataset.val==="pri"?-1:1); } return render(); }
  if(act==="genOpen") return openGen();
  if(act==="genRun") return genRun();
  if(act==="genSave") return genSave();
  if(act==="genDiscard"){ S.gen.items=null; return openGen(); }
  if(act==="importOpen") return openImport();
  if(act==="importRun") return importRun();
  if(act==="export") return exportJSON();
  if(act==="markRev"){ const id=a.dataset.q; try{ await S.db.doc("questions/"+id).update({reviewed:true}); toast(tr("reviewed")); closeSheet(); }catch(err){ toast(tr("aiErr")); } return; }
  if(act==="delQ"){ const id=a.dataset.q; return arm(a, tr("confirmDel"), async ()=>{ try{ await S.db.doc("questions/"+id).delete(); S.qs.delete(id); toast(tr("deleted")); closeSheet(); cacheSave(); render(); }catch(err){ toast(tr("aiErr")); } }); }
  if(act==="resetProg"){ return arm(a, tr("confirmReset"), ()=>{ S.prog=mergeProg(S.prog,{settings:S.prog.settings}); S.session=null; S.fcDeck=null; saveProg(); closeSheet(); toast(tr("resetDone")); render(); }); }
});
document.addEventListener("input", e=>{ if(e.target.id!=="srQ") return; clearTimeout(srRefresh.it); srRefresh.it=setTimeout(()=>{ S.srch.text=e.target.value; srRefresh(); },180); });
document.addEventListener("change", e=>{
  const di=e.target.closest("[data-pdate]"); if(di){ const P=PL(); if(di.value) P.dates[di.dataset.pdate]=di.value; else delete P.dates[di.dataset.pdate]; saveProg(); render(); return; }
  const ci=e.target.closest("[data-pinc]"); if(ci){ const P=PL(); if(ci.checked) delete P.hide[ci.dataset.pinc]; else P.hide[ci.dataset.pinc]=1; saveProg(); render(); }
});
document.addEventListener("keydown", e=>{
  if(e.target.closest("input,textarea,select")||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==="Escape" && $("#layer").innerHTML){ closeSheet(); return; }
  if($("#layer").innerHTML) return;
  const k=e.key.toLowerCase(); const click=sel=>{ const b=document.querySelector(sel); if(b&&!b.disabled){ b.click(); e.preventDefault(); return true; } return false; };
  if(k==="?"){ e.preventDefault(); return openKeys(); }
  if(k==="/"&&S.view!=="search"&&!inSession()){ e.preventDefault(); S.srBack=S.view; return go("search"); }
  // flashcards
  if(S.view==="cards" && S.fcDeck && S.fcDeck.i<S.fcDeck.ids.length){
    if(!S.fcDeck.show){ if(k===" "||k==="enter") click('[data-act="fcShow"]'); return; }
    const g="123".indexOf(k); if(g>=0) click(`[data-act="fcRate"][data-g="${g}"]`); else if(k===" "||k==="enter") click('[data-act="fcRate"][data-g="2"]');
    if(k==="escape") click('[data-act="fcReset"]'); return; }
  // lição
  if(S.view==="lesson"){ if(k==="escape"||k==="backspace") click('[data-act="lessonBack"]'); return; }
  const s=S.session; if(!s||s.done||!(S.view==="study"||S.view==="review")) return;
  const idx="abcde".indexOf(k)>=0?"abcde".indexOf(k):"12345".indexOf(k);
  if(idx>=0){ const b=document.querySelectorAll("#view .opts .opt")[idx]; if(b&&!b.disabled){ b.click(); e.preventDefault(); } return; }
  if(k==="arrowright"||(k==="enter"&&!e.target.closest("button"))||(k===" "&&!e.target.closest("button"))){ if(!click('#view [data-act="next"]') && k!==" ") click('#view [data-act="finish"]'); return; }
  if(k==="arrowleft"){ click('#view [data-act="prev"]'); return; }
  if(k==="l"){ click('#view .tags [data-act="lesson"]'); return; }
  if(k==="m"){ click('#view [data-act="detail"]'); return; }
  if(k==="f"){ click('#view [data-act="fs"]'); return; }
});
function openKeys(){ const en=set().lang==="en"; const r=(k,t)=>`<div class="krow"><span>${k.split(" ").map(x=>`<kbd>${x}</kbd>`).join(" ")}</span><span>${t}</span></div>`;
  openSheet(`<div class="row" style="justify-content:space-between"><h2>⌨ ${en?"Keyboard shortcuts":"Atalhos de teclado"}</h2><button class="btn small ghost" data-act="closeSheet">✕</button></div>
   <div class="kgrp"><div class="eyebrow">${en?"Questions":"Questões"}</div>${r("A–E 1–5",en?"Pick option":"Marcar alternativa")}${r("Enter →",en?"Next (finish on the last)":"Próxima (no fim, finalizar)")}${r("←",en?"Previous":"Anterior")}${r("M",en?"More / less detail":"Mais / menos detalhe")}${r("L",en?"Open topic lesson":"Abrir a lição do tema")}${r("F",en?"Full screen":"Tela cheia")}</div>
   <div class="kgrp"><div class="eyebrow">Flashcards</div>${r("Espaço Enter",en?"Show answer":"Mostrar resposta")}${r("1 2 3",en?"Missed · Hard · Got it":"Errei · Difícil · Acertei")}</div>
   <div class="kgrp"><div class="eyebrow">${en?"General":"Geral"}</div>${r("Esc",en?"Close / go back":"Fechar / voltar")}${r("?",en?"This list":"Esta lista")}</div>`); }

/* ---------- data wiring (Supabase) ---------- */
const CFG = window.GABARITO_CONFIG || {};
let SB = null;
function sbReady(){ return !!(SB && S.uid); }
// Banco MED: a linha fica em discipline "banco" (RLS só para o admin); `link` encaixa a questão num tema existente
function rowToQ(r){ const q=Object.assign({id:r.id}, r.data); if(q.standard==="banco"&&q.link){ q.bd=q.discipline; q.bt=q.topic; q.discipline=q.link.d; q.topic=q.link.t; q.sub="banco"; } return q; }
function qToRow(q){ const {id, ...data}=q; if(data.bd){ data.discipline=data.bd; data.topic=data.bt; delete data.bd; delete data.bt; data.sub=data.sub||"banco"; } return {id, discipline:data.discipline, topic:data.topic, data, updated_at:new Date().toISOString()}; }
// adapter with the subset of the artifact db API the UI uses
const DBA = {
  doc(path){
    const [col,id] = path.startsWith("data/users/") ? ["progress", null] : path.split("/");
    return {
      async set(obj){
        if(col==="progress"){ const {error}=await SB.from("progress").upsert({user_id:S.uid, state:obj, updated_at:new Date().toISOString()}); if(error) throw error; return; }
        if(col==="questions"){ const {error}=await SB.from("questions").upsert(qToRow(Object.assign({id},obj))); if(error) throw error; return; }
        if(col==="catalog"){ const {error}=await SB.from("catalog").upsert({id, data:obj, updated_at:new Date().toISOString()}); if(error) throw error; return; }
      },
      async update(patch){
        if(col!=="questions") throw new Error("unsupported");
        const cur=S.qs.get(id); if(!cur) throw new Error("missing");
        const merged=deepMerge(JSON.parse(JSON.stringify(cur)), patch);
        const {error}=await SB.from("questions").upsert(qToRow(merged)); if(error) throw error; S.qs.set(id, merged);
      },
      async delete(){ const {error}=await SB.from(col).delete().eq("id",id); if(error) throw error; }
    };
  }
};
function deepMerge(a,b){ for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }

async function fetchAll(){
  setSync("loading");
  try{
    const c=await SB.from("catalog").select("id,data").eq("id","main").maybeSingle();
    if(c.error) throw c.error;
    if(c.data) S.catalog=c.data.data;
    const qs=new Map(), ls=new Map(); let from=0;
    for(;;){ const r=await SB.from("questions").select("id,data").order("id").range(from, from+999); if(r.error) throw r.error; r.data.forEach(x=>{ const o=rowToQ(x); if(o.kind==="lesson") ls.set(o.id,o); else qs.set(o.id,o); }); if(r.data.length<1000) break; from+=1000; }
    S.qs=qs; S.lessons=ls;
    const p=await SB.from("progress").select("state,updated_at").eq("user_id",S.uid).maybeSingle();
    if(p.error) throw p.error;
    if(p.data?.state){ const remote=p.data.state; const lt=Math.max(0,...Object.values(S.prog.q).map(r=>r.ts||0)); const rt=Math.max(0,...Object.values(remote.q||{}).map(r=>r.ts||0));
      if(rt>=lt) S.prog=mergeProg(S.prog,remote); else saveProg(); }
    else if(Object.keys(S.prog.q).length) saveProg();
    applyTheme(); setSync("on"); cacheSave();
  }catch(e){ console.error(e); setSync("off"); }
  if(!(S.session && (S.view==="study"||S.view==="review"))) render(); else renderTabs();
}

/* login */
function vLogin(msg){
  $("#ctx").innerHTML=""; $("#tabs").innerHTML="";
  $("#view").innerHTML = `
   <div style="padding-top:6vh"><div class="eyebrow">${set().lang==="en"?"Medical study":"Estudo médico"}</div><h1 style="font-size:40px">Gabarito<span style="color:var(--accent)">.</span></h1>
   <p class="lede">${set().lang==="en"?"Sign in to sync your progress across devices.":"Entre para sincronizar seu progresso entre aparelhos."}</p></div>
   <form class="panel" id="loginForm" style="display:flex;flex-direction:column;gap:12px">
     <div class="field"><label for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="email" required></div>
     <div class="field"><label for="lgPass">${set().lang==="en"?"Password":"Senha"}</label><input id="lgPass" type="password" autocomplete="current-password" minlength="6" required></div>
     ${msg?`<div class="banner">${esc(msg)}</div>`:""}
     <button class="btn primary" type="submit" id="lgIn">${set().lang==="en"?"Sign in":"Entrar"}</button>
     <button class="btn" type="button" id="lgUp">${set().lang==="en"?"Create account (first time)":"Criar conta (primeiro acesso)"}</button>
     ${S.qs.size?`<button class="btn ghost" type="button" id="lgOff">${set().lang==="en"?"Continue offline with saved copy":"Continuar offline com a cópia salva"}</button>`:""}
   </form>`;
  const f=$("#loginForm"), em=$("#lgEmail"), pw=$("#lgPass");
  f.onsubmit=async e=>{ e.preventDefault(); $("#lgIn").disabled=true; const {error}=await SB.auth.signInWithPassword({email:em.value.trim(), password:pw.value}); const b=$("#lgIn"); if(b) b.disabled=false; if(error) return vLogin(error.message); };
  $("#lgUp").onclick=async ()=>{ if(!f.reportValidity()) return; const {data,error}=await SB.auth.signUp({email:em.value.trim(), password:pw.value, options:{emailRedirectTo:location.origin+location.pathname}}); if(error) return vLogin(error.message); if(!data.session) vLogin(set().lang==="en"?"Check your e-mail to confirm the account, then sign in.":"Confira seu e-mail para confirmar a conta e depois entre."); };
  const off=$("#lgOff"); if(off) off.onclick=()=>{ S.offlineMode=true; setSync("off"); render(); };
}
async function signOut(){ try{ await SB.auth.signOut(); }catch(e){} S.uid=null; S.owner=false; closeSheet(); vLogin(); }

/* import / export packs */
function openImport(){
  openSheet(`<div class="row" style="justify-content:space-between"><h2>${tr("importJ")}</h2><button class="btn small ghost" data-act="closeSheet">✕</button></div>
   <p class="lede">${set().lang==="en"?"Choose a .json content pack sent by Claude, or paste its content.":"Escolha o pacote .json enviado pelo Claude, ou cole o conteúdo."}</p>
   <div class="field"><label for="impFile">${set().lang==="en"?"File":"Arquivo"}</label><input id="impFile" type="file" accept="application/json,.json"></div>
   <div class="field"><label for="impTxt">JSON</label><textarea id="impTxt" placeholder="${tr("importPh")}"></textarea></div>
   <button class="btn primary" data-act="importRun" id="impBtn">${tr("importDo")}</button>`, ()=>{
     $("#impFile").onchange=async e=>{ const f=e.target.files[0]; if(f) $("#impTxt").value=await f.text(); };
   });
}
async function importRun(){
  let pack; try{ pack=JSON.parse($("#impTxt").value); }catch(e){ toast("JSON inválido / invalid JSON"); return; }
  const qs = Array.isArray(pack) ? pack : (pack.questions||[]);
  const btn=$("#impBtn"); btn.disabled=true;
  try{
    if(pack.catalog){ const merged=mergeCatalog(S.catalog||{disciplines:[]}, pack.catalog); const {error}=await SB.from("catalog").upsert({id:"main", data:merged, updated_at:new Date().toISOString()}); if(error) throw error; S.catalog=merged; }
    const rows=qs.filter(q=>q&&q.id&&q.i18n&&q.discipline&&q.topic).map(qToRow);
    for(let i=0;i<rows.length;i+=200){ const {error}=await SB.from("questions").upsert(rows.slice(i,i+200)); if(error) throw error; }
    toast(`${tr("imported")}: ${rows.length}`); closeSheet(); await fetchAll();
  }catch(e){ toast((e&&e.message)||tr("aiErr")); btn.disabled=false; }
}
function mergeCatalog(a,b){
  const out=JSON.parse(JSON.stringify(a)); out.disciplines=out.disciplines||[];
  for(const d of (b.disciplines||[])){ let od=out.disciplines.find(x=>x.id===d.id); if(!od){ out.disciplines.push(JSON.parse(JSON.stringify(d))); continue; } Object.keys(d).forEach(k=>{ if(k!=='topics') od[k]=d[k]; }); od.topics=od.topics||[];
    for(const t of (d.topics||[])){ const i=od.topics.findIndex(x=>x.id===t.id); if(i<0) od.topics.push(t); else od.topics[i]=Object.assign({},od.topics[i],t); } }
  out.updated=new Date().toISOString(); return out;
}
function exportJSON(){
  const pack={format:"gabarito-pack",version:1,catalog:S.catalog,questions:ctxQs()};
  const blob=new Blob([JSON.stringify(pack,null,1)],{type:"application/json"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`gabarito-${curDisc()?.id}-${curTopic()?.id}-${dayKey()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
function subscribeQs(){ /* questions are fetched on open and when the app returns to foreground */ }

async function boot(){
  await cacheLoad(); applyTheme();
  const h=(location.hash||"").slice(1); if(["home","study","review","cards","stats","bank"].includes(h)) S.view=h;
  try{ history.replaceState({v:S.view},"","#"+S.view); }catch(e){}
  S.downloads=true; // enables the export button (plain browser download)
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
  if(!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase){ setSync("off"); render(); if(!CFG.SUPABASE_URL) toast("config.js sem Supabase"); return; }
  SB = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  S.db = DBA;
  const {data:{session}} = await SB.auth.getSession();
  const onSession = async sess=>{
    if(sess?.user){ const changed=S.uid!==sess.user.id; S.uid=sess.user.id; window.__email=sess.user.email; S.owner=(sess.user.email||"").toLowerCase()===(CFG.ADMIN_EMAIL||"").toLowerCase(); if(changed){ render(); fetchAll(); } }
    else { S.uid=null; if(!S.offlineMode) vLogin(); }
  };
  SB.auth.onAuthStateChange((_e,sess)=>{ onSession(sess); });
  if(session) onSession(session); else if(navigator.onLine===false && S.qs.size){ S.offlineMode=true; setSync("off"); render(); } else vLogin();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && sbReady()) fetchAll(); });
  window.addEventListener("online",()=>{ if(sbReady()){ saveProg(); fetchAll(); } });
}
boot();
</script>
